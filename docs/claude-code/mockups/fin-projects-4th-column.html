<!doctype html>
<!-- Finance › Projects on a phone, Option 2 (the compact table) without Owed (Andy, 7 Nov 2026): three choices for the
     4th column. Mock-ups only, with the projects from his screenshot. Pictures: column-a/b/c.png. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects Fourth Column</title>
<style>
  :root { --ink:#1E2124; --slate:#5B6472; --line:#E1E5EA; --bg:#EEF0F2; --brand:#3F7BD9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#cfd3d8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); padding:20px; display:flex; gap:24px; flex-wrap:wrap; }
  .phone { width:390px; background:var(--bg); padding-bottom:14px; }
  .label { background:var(--ink); color:#fff; font-size:15px; font-weight:600; padding:10px 16px; margin-bottom:12px; }
  .label small { display:block; font-weight:400; font-size:12.5px; color:#cfd3d8; margin-top:2px; }
  .tbl { background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; margin:0 16px; }
  .tr { display:flex; align-items:center; padding:8px 11px; border-top:1px solid #eef0f2; gap:8px; }
  .tr.hd { border-top:0; background:#F6F7F9; }
  .tr.hd div { font-size:11.5px; font-weight:600; color:var(--slate); }
  .a { width:58px; flex:none; } .b { flex:1; min-width:0; } .c { width:74px; flex:none; text-align:right; } .d { width:72px; flex:none; text-align:right; }
  .b b { display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b small { display:block; font-size:11.5px; color:var(--slate); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jn { font-size:12px; font-weight:600; color:var(--brand); }
  .tr .c { font-size:13px; font-weight:600; }
  .tr .d { font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr .d.none { color:var(--slate); }
</style></head>
<body>
<div id="ca" class="phone"></div>
<div id="cb" class="phone"></div>
<div id="cc" class="phone"></div>
<script>
// Job no, name, client, value, client PO, PM, start (start dates are examples).
var P = [
  ['SBX-127','123 Test Street','RTB Roofing',0,'','','3 Nov 26'],
  ['SBX-111','Andy House','Ashcroft Estates Ltd',0,'','Demo','27 Oct 26'],
  ['SBX-107','Andy House','RTB Roofing',11000,'12345679','','14 Oct 26'],
  ['SBX-126','ddf','RTB Roofing',610,'123456','Demo','6 Nov 26'],
  ['SBX-106','Harbour Mill – Industrial Unit','Hollin Developments Ltd',96400,'','','1 Sep 26'],
  ['SBX-103','Kestrel House – Office Refurb','Kestrel Facilities Management',42750,'','','18 Aug 26'],
  ['SBX-102','Oakfield Primary School – Re-roof','Ashcroft Estates Ltd',186000,'','','4 Aug 26'],
  ['SBX-108','Richardson court','Ashcroft Estates Ltd',1000,'12234','','20 Oct 26']
];
function gbp(n){ return n ? '£' + n.toLocaleString('en-GB') : '—'; }
function table(id, label, sub, head, cell){
  document.getElementById(id).innerHTML = '<div class="label">' + label + '<small>' + sub + '</small></div>'
    + '<div class="tbl"><div class="tr hd"><div class="a">Job No</div><div class="b">Project ▾</div><div class="c">Value</div><div class="d">' + head + '</div></div>'
    + P.map(function(p){ var v = cell(p); return '<div class="tr"><div class="a jn">' + p[0] + '</div><div class="b"><b>' + p[1] + '</b><small>' + p[2] + '</small></div><div class="c">' + gbp(p[3]) + '</div><div class="d' + (v[1] ? ' none' : '') + '">' + v[0] + '</div></div>'; }).join('') + '</div>';
}
table('ca', 'A — Client PO', 'The client’s order number, or No PO, so you can see which jobs still need one.', 'Client PO', function(p){ return p[4] ? [p[4]] : ['No PO', 1]; });
table('cb', 'B — PM', 'Who runs the job.', 'PM', function(p){ return p[5] ? [p[5]] : ['—', 1]; });
table('cc', 'C — Start', 'When the job starts (dates here are examples).', 'Start', function(p){ return [p[6]]; });
</script>
</body></html>
