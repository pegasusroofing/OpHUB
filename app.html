<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OpHUB</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpHUB">
<meta name="theme-color" content="#101114">
<link rel="apple-touch-icon" href="assets/ophub-logo.png">
<link rel="icon" href="assets/ophub-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand1:#4E8FD1;
    --brand2:#101114;
    --red:#C8102E;
    --ink:#101114;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --line:#E4E1D8;
    --slate:#5B5F68;
    --slate-light:#9A9DA3;
    --ok:#2E6B3E;
    --ok-bg:#E4EFE4;
    --warn:#B0740F;
    --warn-bg:#F5EBD6;
    --blue:#2A4B7C;
    --blue-bg:#E7EDF5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  /* Lots of tiles/rows/buttons in this app are plain divs/spans with an
     onclick handler rather than real <button>/<a> elements, so the browser
     was showing its default text-select (I-beam) cursor over their text
     instead of a normal pointer — this catches all of them in one go. */
  [onclick]{cursor:pointer;}
  body{
    margin:0;background:#EFEDE6;
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
  }
  #app{
    max-width:460px;margin:0 auto;min-height:100vh;
    background:var(--paper);
    display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  /* Same app, same layout, same everything below this width — on a wide
     desktop browser window this just widens #app into a real page (like
     admin.html's topbar + wide content layout) instead of framing it as a
     phone card. Nothing inside #app is touched, so behavior is identical. */
  @media (min-width:760px){
    #app{
      max-width:1180px;box-shadow:none;
    }
    .appbar{padding:20px 32px;}
    .scrollarea{padding:24px 32px 32px;}
    .tabbar{position:sticky;bottom:0;}
  }
  /* Phone-only header text scale-down (0.85x) — only applies below the
     desktop breakpoint above, so the wide-browser header stays full size. */
  @media (max-width:759px){
    .appbar .brandline{font-size:12.75px;}
    .appbar .brandline.lg{font-size:19.125px;}
    .appbar h2{font-size:20.4px;}
    .appbar h2.lg{font-size:22.95px;}
    .rolechip{font-size:6.63px;}
  }
  .stripe-edge{height:5px;width:100%;flex:0 0 auto;
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.14) 0 2px, transparent 2px 7px),
      linear-gradient(90deg, var(--brand1), var(--brand2));}

  .appbar{background:var(--brand1);color:#fff;padding:21px 24px 18px;flex:0 0 auto;}
  .appbar .row{display:flex;align-items:center;gap:15px;}
  .badge{background:var(--brand1);color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;padding:3px 7px;border-radius:4px;}
  .brandmark{width:72px;height:72px;border-radius:0;object-fit:contain;background:#fff;flex:0 0 72px;padding:4px;}
  .brandline{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#b9b9b9;margin-bottom:1.5px;}
  .brandline.lg{font-size:22.5px;}
  .appbar h2{margin:0;font-size:24px;font-weight:800;}
  .appbar h2.lg{font-size:27px;}
  .appbar .meta{font-size:16.5px;color:#b9b9b9;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px;}
  .img-viewer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;padding:20px;}
  .img-viewer-overlay img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .geo-modal-overlay{display:none;position:fixed;inset:0;background:rgba(16,17,20,0.55);z-index:9999;align-items:center;justify-content:center;padding:20px;}
  .geo-modal-card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.25);}
  .geo-modal-card h3{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--ink);}
  .geo-modal-card p.stub{margin:0 0 16px;}
  .geo-modal-btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer;}
  .geo-modal-btn .sub2{display:block;font-weight:600;font-size:11.5px;color:var(--slate);margin-top:2px;}
  .geo-modal-btn:hover{border-color:var(--slate-light);}
  .geo-modal-cancel{display:block;width:100%;text-align:center;background:none;border:none;padding:10px;margin-top:4px;
    font-weight:700;font-size:13px;color:var(--slate);cursor:pointer;}
  .backarrow{font-size:57px;font-weight:900;line-height:1;color:#fff;opacity:.95;padding:6px 21px 6px 0;margin:-6px 0;display:flex;align-items:center;min-height:66px;min-width:54px;text-shadow:0 0 1px #fff, 0.5px 0 0 #fff;}
  .rolechip{margin-left:auto;background:#232323;color:#ccc;font-size:7.8px;font-weight:800;
    font-family:Calibri,'Open Sans',sans-serif;padding:3px 6.75px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;}

  .scrollarea{flex:1;overflow-y:auto;padding:14px;padding-bottom:26px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .sectiontitle{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin:4px 0 10px;}

  .primarybtn,.darkbtn,.ghostbtn{
    display:block;width:100%;padding:13px;border-radius:10px;border:none;
    font-weight:800;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;text-align:center;
  }
  .primarybtn{background:var(--brand1);color:#fff;}
  .exportbtn{padding:8.125px;font-size:8.4375px;}
  .darkbtn{background:var(--brand1);color:#fff;}
  .ghostbtn{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .primarybtn:disabled,.darkbtn:disabled{background:#d8d5cb;color:#9a978c;}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14px;background:#fff;color:var(--ink);font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  label.field-label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--slate);margin:0 0 6px;}
  .formfield{margin-bottom:12px;}
  .row-gap{display:flex;gap:8px;}
  .row-gap > *{flex:1;}

  .rolepick{display:flex;gap:10px;margin-top:6px;}
  .rolebtn{
    flex:1;padding:18px 10px;border-radius:12px;border:2px solid var(--line);
    background:#fff;text-align:center;font-weight:800;font-size:13.5px;color:var(--slate);
  }
  .rolebtn .ic{font-size:24px;display:block;margin-bottom:6px;}
  .rolebtn.selected{border-color:var(--brand1);background:#E9F1FB;color:var(--brand1);}

  .authtabs{display:flex;gap:8px;margin-bottom:14px;}
  .authtab{flex:1;text-align:center;padding:10px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--slate);}
  .authtab.active{background:var(--brand1);border-color:var(--brand1);color:#fff;}

  .sitecard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:10px;}
  .sitecard .swatch{width:44px;height:44px;border-radius:9px;flex:0 0 44px;
    background:linear-gradient(135deg,var(--brand1),var(--brand2));display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;}
  .sitecard .swatch.personswatch{width:55px;height:55px;border-radius:11px;flex:0 0 55px;font-size:18.75px;}
  .sitecard .info{flex:1;min-width:0;}
  .sitecard .info .name{font-weight:800;font-size:14.5px;}
  .sitecard .info .addr{font-size:12px;color:var(--slate);margin-top:1px;}
  .sitecard .status{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;flex:0 0 auto;}
  .sitecard .status.active{background:var(--ok-bg);color:var(--ok);}
  .sitecard .status.closed{background:var(--line);color:var(--slate);}
  .closedtoggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .closedtoggle .arrow{font-size:10px;}

  .status-strip{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;padding:5px 9px;border-radius:999px;}
  .pill.on{background:var(--ok-bg);color:var(--ok);}
  .pill.off{background:var(--line);color:var(--slate);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile-wide{grid-column:1 / -1;flex-direction:row;justify-content:center;align-items:center;min-height:72px;}
  .tile-wide .icon{margin-bottom:0;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-height:112px;position:relative;}
  .tile .icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .tile .lbl{font-size:15.94px;font-weight:800;line-height:1.2;font-family:Calibri,'Open Sans',sans-serif;}
  .tile .sub{font-size:13.39px;color:var(--slate-light);font-family:Calibri,'Open Sans',sans-serif;}
  .tile .badge-count{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:10px;
    font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

  .task{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:12px;margin-bottom:8px;}
  .checkbox{width:22px;height:22px;border-radius:5px;flex:0 0 22px;margin-top:1px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900;}
  .checkbox.progress{border-color:var(--warn);background:var(--warn);}
  .checkbox.done{border-color:var(--ok);background:var(--ok);}
  .taskbody{flex:1;min-width:0;}
  .statusbtns{display:flex;gap:6px;margin-top:9px;}
  .statusbtn{flex:1;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    padding:8px 4px;border-radius:8px;border:1.5px solid var(--line);color:var(--slate);background:var(--paper);}
  .statusbtn.active-todo{border-color:var(--slate-light);color:var(--ink);background:#fff;}
  .statusbtn.active-progress{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);}
  .statusbtn.active-done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .taskname{font-size:13.5px;font-weight:700;}
  .taskname.done{text-decoration:line-through;color:var(--slate-light);}
  .taskmeta{font-size:11px;color:var(--slate);margin-top:3px;}
  .taskphoto{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .taskphoto img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .addphotobtn{margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--brand1);}
  .taskrowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .taskicons{display:flex;gap:4px;flex:0 0 auto;}
  .taskicon{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--slate);}
  .taskicon.danger{color:var(--brand1);}
  .taskicon.lg{width:39px;height:39px;flex:0 0 39px;font-size:18px;border-radius:8px;}
  .taskeditrow{display:flex;gap:6px;margin-bottom:4px;}
  .taskeditrow input{flex:1;padding:7px 9px;font-size:13px;}
  .taskeditrow button{flex:0 0 auto;padding:7px 10px;font-size:11px;border-radius:6px;border:none;font-weight:800;}

  .snag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .snag .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .snag .title{font-size:13px;font-weight:700;margin-top:2px;}
  .snag .loc{font-size:11px;color:var(--slate);margin-top:3px;}
  .statustag2{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex:0 0 auto;}
  .statustag2.open,.statustag2.live{background:var(--warn-bg);color:var(--warn);}
  .statustag2.closed{background:var(--ok-bg);color:var(--ok);}
  .statustag2.pending{background:#EAE6DC;color:#6B6F76;}
  .snagthumb{width:100%;max-width:160px;border-radius:8px;margin-top:8px;display:block;}
  .filterrow{display:flex;gap:8px;margin-bottom:12px;}
  .filterchip{flex:1;text-align:center;padding:8px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--slate);}
  .filterchip.active{background:var(--brand1);border-color:var(--brand1);color:#fff;}
  .closurerow{display:flex;gap:10px;margin-top:10px;align-items:center;}
  .closurerow img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}

  .ramsdoc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
  .ramsdoc .name{font-size:13.5px;font-weight:800;}
  .ramsdoc .meta{font-size:11px;color:var(--slate);margin-top:3px;}
  .ramsdoc .viewlink{font-size:11.5px;color:var(--blue);font-weight:700;text-decoration:underline;}
  .siglinebox{margin-top:12px;border:1.5px dashed var(--line);border-radius:8px;min-height:56px;
    display:flex;align-items:center;justify-content:center;color:var(--slate-light);font-size:12px;font-weight:600;
    flex-direction:column;gap:2px;padding:8px;text-align:center;}
  .siglinebox.signed{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .siglinebox.signed .name{font-family:'Segoe Script','Brush Script MT',cursive;font-size:20px;}
  .signerlist{margin-top:10px;font-size:11px;color:var(--slate);}
  .signerlist div{padding:3px 0;}

  .matcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .matcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .matcard .name{font-size:13.5px;font-weight:700;}
  .matcard .qty{font-size:11.5px;color:var(--slate);margin-top:2px;}
  .statustag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;}
  .statustag.sent{background:var(--blue-bg);color:var(--blue);}
  .statustag.pending{background:var(--warn-bg);color:var(--warn);}
  .merchantrow{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--slate);}
  .merchantchip{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;
    font-weight:700;font-size:10.5px;}
  .merchantchip.pickable{cursor:pointer;}
  .merchantchip.pickable.active{background:var(--brand1);border-color:var(--brand1);color:#fff;}
  .merchantchip.sent{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}

  .varcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .varcard img{width:100%;border-radius:8px;margin-bottom:8px;}
  .varcard .desc{font-size:13px;}
  .varcard .meta{font-size:11px;color:var(--slate);margin-top:6px;}
  .photoupload{background:var(--card);border:1.5px dashed var(--slate-light);border-radius:10px;
    min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--slate);font-size:12px;font-weight:700;overflow:hidden;}
  .photoupload img{width:100%;height:100%;object-fit:cover;}

  .empty{text-align:center;color:var(--slate-light);font-size:13px;padding:26px 10px;}

  .tabbar{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 3px 12px;
    background:#fff;border-top:1px solid var(--line);}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-weight:700;
    color:var(--slate-light);padding:4px 5px;border-radius:10px;}
  .tb.active{color:var(--brand1);}
  .tabicon{font-size:15px;}
  .tb.tb-emph{border:1.5px solid var(--line);padding:6px 9px;margin:-4px 0;background:var(--paper);font-size:9.5px;}
  .tb.tb-emph .tabicon{font-size:19px;}
  .tb.tb-emph.active{border-color:var(--brand1);}

  .toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:13px 16px;
    border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:10px;max-width:428px;margin:0 auto;z-index:100;}
  .toast .stripe{width:5px;align-self:stretch;background:var(--brand1);border-radius:3px;}

  .stub{font-size:11px;color:var(--slate-light);font-style:italic;margin-top:6px;}
  .errbox{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>
/* ================= Supabase config ================= */
const SUPABASE_URL = 'https://dtrfupmcazoioubhwdml.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0cmZ1cG1jYXpvaW91Ymh3ZG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODI2MTEsImV4cCI6MjEwMjQ1ODYxMX0.RpPi02zvyPCrw9CxfkK0hNvmEEnILlXQ5qoMwxYsSKc';

/* ================= generic helpers ================= */
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,9); }
// A per-install identifier persisted in localStorage — survives app
// restarts and browser sessions, but resets if someone clears site data or
// reinstalls the app. Good enough to stop casual "log in as me on your
// phone" sharing without needing a native device-ID plugin.
function getDeviceId(){
  let id = localStorage.getItem('ophub_device_id');
  if(!id){
    id = 'dev_'+Date.now()+'_'+Math.random().toString(36).slice(2,12);
    try{ localStorage.setItem('ophub_device_id', id); }catch(e){ /* private browsing etc — non-fatal */ }
  }
  return id;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// For values dropped into an onclick="fn('...')" attribute: escape backslash
// and single-quote for JS FIRST, then HTML-escape the result for the
// attribute. Doing it the other way round (HTML-escape, then try to
// backslash-escape quotes) is a no-op, because escapeHtml already turned
// every ' into &#39; — leaving nothing left to backslash-escape. The
// browser decodes &#39; back to a literal ' before parsing the onclick JS,

function compressImage(file, opts){
  // 1600px / 0.85 quality (the default) keeps photos sharp enough for
  // snagging reports and OneDrive exports while still compressing well
  // below the original camera file size (was 480px/0.6, which looked like
  // a thumbnail). That default is overkill for things that are never shown
  // bigger than a small icon (a company logo, for instance) — a full-size
  // modern phone photo (4000px+, several MB) run through the 1600px target
  // is real work for the JS-side canvas decode/redraw/encode, especially on
  // an older Android device, which is what made logo upload feel "frozen"
  // with no progress indicator shown while it churned. Pass {maxW, quality}
  // to use a smaller/faster target for cases like that.
  opts = opts || {};
  const maxW = opts.maxW || 1600;
  const quality = opts.quality != null ? opts.quality : 0.85;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('read failed'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('load failed'));
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const c=document.createElement('canvas'); c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function getGeo(){
  // In the native app, use Capacitor's Geolocation plugin — it drives Android's
  // runtime permission prompt properly. Bare navigator.geolocation inside an
  // embedded WebView often silently fails on Android because nothing ever
  // triggers the permission dialog.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation){
    try{
      const perm = await window.Capacitor.Plugins.Geolocation.checkPermissions();
      if(perm.location !== 'granted' && perm.coarseLocation !== 'granted'){
        const req = await window.Capacitor.Plugins.Geolocation.requestPermissions();
        if(req.location !== 'granted' && req.coarseLocation !== 'granted'){
          return {error:'Location permission denied. Enable it for this app in your phone\'s Settings.'};
        }
      }
      const pos = await window.Capacitor.Plugins.Geolocation.getCurrentPosition({enableHighAccuracy:true, timeout:12000});
      return {lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy};
    }catch(e){
      return {error: (e && e.message) || 'Could not get your location.'};
    }
  }
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve({error:'Location not supported.'}); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),
      e=>resolve({error:e.message||'Location permission denied.'}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  });
}
function distMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7;
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-day);
  return dt.getTime();
}

/* ================= local persistence (session only — no raw passwords ever stored) =================
   Keeps a signed-in user signed in across page reloads / app restarts, so
   nobody has to log back in every time — only an explicit "Sign out" clears
   this. Uses Capacitor's Preferences plugin (native storage that survives
   app restarts) when running as the native app, and localStorage on the
   plain website. */
window.storage = {
  async get(key, shared){
    try{
      if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences){
        return await window.Capacitor.Plugins.Preferences.get({key});
      }
    }catch(e){ /* fall through to localStorage */ }
    try{ return {value: localStorage.getItem(key)}; }catch(e){ return {value:null}; }
  },
  async set(key, value){
    try{
      if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences){
        await window.Capacitor.Plugins.Preferences.set({key, value});
        return true;
      }
    }catch(e){ /* fall through to localStorage */ }
    try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
  },
  async delete(key){
    try{
      if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences){
        await window.Capacitor.Plugins.Preferences.remove({key});
        return true;
      }
    }catch(e){ /* fall through to localStorage */ }
    try{ localStorage.removeItem(key); return true; }catch(e){ return false; }
  }
};
async function sget(key, shared){ try{ const r=await window.storage.get(key,shared); return r?r.value:null; }catch(e){ return null; } }
async function sset(key, value, shared){ try{ return await window.storage.set(key,value,shared);}catch(e){ console.error(e); return null; } }
async function sdelete(key, shared){ try{ return await window.storage.delete(key, shared); }catch(e){ return null; } }
async function getJSON(key, shared, fallback){ const v=await sget(key,shared); if(!v) return fallback; try{return JSON.parse(v);}catch(e){return fallback;} }
async function setJSON(key, obj, shared){ return sset(key, JSON.stringify(obj), shared); }
const K_SESSION = 'rtb-session-v1';

/* ================= Supabase data layer ================= */
let SESSION = null; // {access_token, refresh_token, expires_at, user:{id,email}}

async function ensureFreshToken(){
  if(!SESSION) return;
  if(Date.now() < SESSION.expires_at - 60000) return;
  try{
    const res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: SESSION.refresh_token})
    });
    if(res.ok){
      const d = await res.json();
      SESSION = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in*1000), user:SESSION.user};
      await setJSON(K_SESSION, SESSION, false);
    } else {
      SESSION = null; ME = null; await sdelete(K_SESSION, false);
    }
  }catch(e){ SESSION = null; ME = null; }
}
async function sbFetch(path, opts){
  opts = opts || {};
  await ensureFreshToken();
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (SESSION ? SESSION.access_token : SUPABASE_ANON_KEY),
    'Content-Type': 'application/json'
  }, opts.headers||{});
  return fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
}
async function safeErr(res){ try{ const j = await res.json(); return j.message||j.error_description||j.error||res.status; }catch(e){ return res.status; } }

async function dbSelect(table, qs){
  const res = await sbFetch('/rest/v1/'+table+'?'+qs, {method:'GET'});
  if(!res.ok){ console.error(await safeErr(res)); return []; }
  return res.json();
}
async function dbInsert(table, rowOrRows){
  const res = await sbFetch('/rest/v1/'+table, {method:'POST', headers:{'Prefer':'return=representation'}, body:JSON.stringify(rowOrRows)});
  if(!res.ok){ toast('Save failed — '+(await safeErr(res))); return null; }
  const d = await res.json();
  return d;
}
async function dbUpdate(table, id, patch){
  const res = await sbFetch('/rest/v1/'+table+'?id=eq.'+id, {method:'PATCH', headers:{'Prefer':'return=representation'}, body:JSON.stringify(patch)});
  if(!res.ok){ toast('Update failed — '+(await safeErr(res))); return null; }
  const d = await res.json();
  return Array.isArray(d)?d[0]:d;
}
async function dbDelete(table, id){
  const res = await sbFetch('/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE'});
  if(!res.ok){ toast('Delete failed — '+(await safeErr(res))); return false; }
  return true;
}
async function uploadToStorage(bucket, path, blobOrFile, contentType){
  await ensureFreshToken();
  const res = await fetch(SUPABASE_URL+'/storage/v1/object/'+bucket+'/'+path, {
    method:'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization':'Bearer '+SESSION.access_token,
      'Content-Type': contentType || blobOrFile.type || 'application/octet-stream',
      'x-upsert':'true'
    },
    body: blobOrFile
  });
  if(!res.ok){ toast('Upload failed — '+(await safeErr(res))); return null; }
  return path;
}
async function uploadDataUrl(bucket, path, dataUrl){
  const blob = await (await fetch(dataUrl)).blob();
  return uploadToStorage(bucket, path, blob, blob.type);
}
function publicUrl(bucket, path){ return path ? (SUPABASE_URL+'/storage/v1/object/public/'+bucket+'/'+path) : null; }

/* ================= auth ================= */
// `extra` becomes the new account's auth metadata. Only `invite_id` matters
// server-side: the handle_new_user() DB trigger looks it up in the `invites`
// table and resolves org_id/role from THAT row — anything else sent here
// (e.g. a role) is display-only and is never trusted by the backend.
async function signUp(email, password, extra){
  const res = await fetch(SUPABASE_URL+'/auth/v1/signup', {
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password, data: extra||{}})
  });
  const d = await res.json();
  if(!res.ok) return {error: d.msg||d.error_description||d.error||'Sign up failed'};
  if(d.access_token){
    SESSION = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in*1000), user:{id:d.user.id, email:d.user.email}};
    await setJSON(K_SESSION, SESSION, false);
    return {ok:true, confirmed:true};
  }
  return {ok:true, confirmed:false};
}

async function signIn(email, password){
  const res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const d = await res.json();
  if(!res.ok) return {error: d.msg||d.error_description||d.error||'Sign in failed'};
  SESSION = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in*1000), user:{id:d.user.id, email:d.user.email}};
  await setJSON(K_SESSION, SESSION, false);
  return {ok:true};
}

/* ================= push notifications ================= */
// Registers this device for push (native app only) and saves the FCM token
// against the signed-in user so server-side reminders (e.g. the 3pm sign-out
// nudge) know where to deliver. Silently no-ops on the plain website.
let pushRegistered = false;
async function registerPushNotifications(){
  try{
    if(pushRegistered) return;
    if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
    const PN = window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
    if(!PN) return;
    let perm = await PN.checkPermissions();
    if(perm.receive !== 'granted'){ perm = await PN.requestPermissions(); }
    if(perm.receive !== 'granted') return;
    pushRegistered = true;
    PN.addListener('registration', async (token)=>{
      if(!ME || !token || !token.value) return;
      try{
        await sbFetch('/rest/v1/push_tokens?on_conflict=token', {
          method:'POST',
          headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify({user_id: ME.id, token: token.value, platform:'android', updated_at: new Date().toISOString()})
        });
      }catch(e){ console.error('Could not save push token', e); }
    });
    PN.addListener('registrationError', (err)=>{ console.error('Push registration error', err); });
    await PN.register();
  }catch(e){ console.error('Push notification setup failed', e); }
}

/* ================= OneDrive OAuth deep-link handoff (native app only) =================
   The OneDrive "Connected"/"Connection failed" page (served from Supabase, in
   the system browser Browser.open() opened) redirects to ophub://onedrive-callback
   once it's done — iOS/Android route that straight back into this app and
   auto-dismiss the system browser, so nobody has to tap "Close Window"
   themselves. This just needs to catch that hand-off and refresh the screen. */
function registerOneDriveDeepLinkHandler(){
  if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
  const AppPlugin = window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(!AppPlugin) return;
  AppPlugin.addListener('appUrlOpen', async (data)=>{
    try{
      const openedUrl = new URL(data.url);
      if(openedUrl.protocol !== 'ophub:' || openedUrl.hostname !== 'onedrive-callback') return;
      if(window.Capacitor.Plugins.Browser){ try{ await window.Capacitor.Plugins.Browser.close(); }catch(e){} }
      const status = openedUrl.searchParams.get('status');
      toast(status==='success' ? 'OneDrive connected' : 'OneDrive connection failed — try again.');
      go('#/team');
    }catch(e){ console.error('OneDrive deep link handling failed', e); }
  });
}

window.maybeAutoSignIn = function(ev){
  // Only Enter submits — a bare "fields look filled" trigger caused false
  // sign-ins whenever the browser's saved-password autofill populated the
  // form (e.g. switching accounts on a shared device), signing people in as
  // whoever was saved before they could change the email. Explicit Sign In
  // click or Enter key only, from here on.
  if(ev && ev.key === 'Enter'){ doSignIn(); }
};
window.doSignIn = async function(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ authError='Enter your email and password.'; render(); return; }
  authBusy = true; authError = null; render();
  const r = await signIn(email, password);
  authBusy = false;
  if(r.error){ authError = r.error; render(); return; }
  await loadProfile();
  if(!ME || (!ME.org_id && ME.role!=='superadmin')){
    authError = 'Your account isn\'t linked to a company yet. Contact your Project Manager for an invite.';
    await doSignOut();
    return;
  }
  if(ME.role==='superadmin'){ go('#/'); return; }
  if(ME.role==='operative'){
    const lock = await checkDeviceLock();
    if(!lock.ok){
      authError = lock.error==='device_locked'
        ? `This phone is already signed in to OpHUB as ${lock.locked_to_name || 'another team member'}. Each phone can only be used by one person — ask your admin to unlock it in Admin Centre if this is wrong.`
        : 'Could not verify this device — check your connection and try again.';
      await doSignOut();
      return;
    }
  }
  await loadOrg();
  await loadAllProfiles();
  SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  registerPushNotifications();
  go('#/sites');
};

window.doJoin = async function(inviteId){

  const email = document.getElementById('joinEmail').value.trim();
  const password = document.getElementById('joinPassword').value;
  if(!email || !password || !name){ joinError='Fill in every field.'; render(); return; }

let setupLogoProcessing = false;
window.onSetupLogoChosen = async function(e){
  const file = e.target.files[0];
  if(!file) return;
  // Show visible progress and handle failure — previously this ran silently
  // with nothing on screen until it finished, which on a big camera photo
  // looked exactly like the app had frozen.
  setupLogoProcessing = true; setupError = null; renderCompanySetup();
  try{
    // Logos are only ever shown at a small size in the app (max ~250px), so
    // there's no need to run them through the full 1600px photo pipeline —
    // 400px keeps the upload and processing fast regardless of how large the
    // original camera photo is.
    setupLogoDataUrl = await compressImage(file, {maxW:400, quality:0.85});
  }catch(err){
    setupError = 'Could not process that image — try a different photo.';
  }
  setupLogoProcessing = false;
  renderCompanySetup();
};
window.saveCompanySetup = async function(){
  if(!setupLogoDataUrl){ setupError='A logo is required.'; renderCompanySetup(); return; }
  setupBusy = true; setupError = null; renderCompanySetup();
  try{
    const path = await uploadDataUrl('org-logos', ME.org_id+'/logo.jpg', setupLogoDataUrl);
    if(!path){ setupBusy=false; setupError='Logo upload failed — try again.'; renderCompanySetup(); return; }
    const row = await dbUpdate('organizations', ME.org_id, {logo_path: path, color_primary: setupColor1, color_secondary: setupColor2});
    setupBusy = false;
    if(!row){ setupError='Could not save — try again.'; renderCompanySetup(); return; }
    await loadOrg();
    toast('Company set up');
    go('#/sites');
  }catch(err){
    // A network hiccup mid-upload used to leave this stuck on "Saving…"
    // forever with no way to retry short of reloading the whole app.
    setupBusy = false;
    setupError = 'Something went wrong saving that — check your connection and try again.';
    renderCompanySetup();
  }
};

window.addSite = async function(){
  const name = document.getElementById('newSiteName').value.trim();
  const addr = document.getElementById('newSiteAddr').value.trim();
  const postcode = document.getElementById('newSitePostcode').value.trim();
  if(!name) return;
  // Deliberately not asking PostgREST for the row back here (no
  // Prefer: return=representation) — Postgres has a known quirk where a
  // table's own SELECT policy, if it re-queries that same table (as sites'
  // does via has_site_access()), can't reliably see a row that's still
  // mid-insert within the same statement, which makes any "insert and
  // return the new row" call get rejected even though the insert itself
  // is fully allowed. Inserting plain, then re-fetching the list, sidesteps
  // it without weakening the security policy.
  const res = await sbFetch('/rest/v1/sites', {method:'POST', body: JSON.stringify({name, address:addr||null, postcode:postcode||null, status:'active', created_by:ME.id, org_id:ME.org_id})});
  if(!res.ok){ toast('Save failed — '+(await safeErr(res))); return; }
  SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  const newSite = SITES.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  await preloadTbtBankForSite(newSite);
  toast('Site created');
  render();
};
// Pre-loads every company-wide Toolbox Talk template into this new site's

    const rows = templates.map(t=>({site_id:site.id, org_id:ME.org_id, title:t.title, storage_path:t.storage_path, status:'bank', created_by:ME.id}));

let sigCtx = null;
function attachSignatureCanvas(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#101114';
  sigCtx = ctx;
  sigHasDrawn = false;
  let drawing = false, lastX = 0, lastY = 0;
  function posFromEvent(e){
    const r = canvas.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  canvas.onpointerdown = (e)=>{ drawing = true; const p = posFromEvent(e); lastX = p.x; lastY = p.y; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = (e)=>{
    if(!drawing) return;
    const p = posFromEvent(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
    sigHasDrawn = true;
  };
  canvas.onpointerup = ()=>{ drawing = false; };
  canvas.onpointerleave = ()=>{ drawing = false; };
}
window.clearSignaturePad = function(){
  const canvas = document.getElementById('sigCanvas');
  if(canvas && sigCtx){ sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHasDrawn = false; }
};
window.saveSignaturePad = async function(){
  if(!sigHasDrawn){ toast('Draw your signature first.'); return; }
  const canvas = document.getElementById('sigCanvas');
  const dataUrl = canvas.toDataURL('image/png');
  const path = ME.id+'/signature.png';
  const stored = await uploadDataUrl('signatures', path, dataUrl);
  if(!stored) return;
  const row = await dbUpdate('profiles', ME.id, {signature_path: path});
  if(row){
    ME.signature_path = path;
    toast('Signature saved');
    history.length>1 ? history.back() : go('#/sites');
  }
};

/* ================= ONEDRIVE FOLDER PICKER (link a site to its real, existing project folder) =================
   A folder can either live in the connected account's own OneDrive (driveId
   null — addressed via /me/drive/...) or in a DIFFERENT drive that's been
   shared with them — another person's OneDrive, or a SharePoint document
   library (driveId set — addressed via /drives/{driveId}/...).

   There are two separate ways a folder can be "not really mine" and they
   need different Graph calls to find:
     - Someone individually shared it with this account → /me/drive/sharedWithMe
       (the "🔗 Shared with me" virtual entry).
     - It's visible because this account is a member of a SharePoint team
       site (e.g. everyone at the company can see the org's shared folder,
       nobody explicitly "shared" it with any one person) → /sites then
       /sites/{id}/drives (the "🏢 Company Sites" virtual entry, which lists
       sites and then that site's document libraries).
   Both virtual entries only exist client-side to get the picker into that
   mode — they're not real Graph items. */
const SHARED_ROOT_ID = '__SHARED__';
const SITES_ROOT_ID = '__SITES__';
let odPickerStack = null; // array of {id, name, driveId, isSite} — first entry is always the OneDrive root
let odPickerFolders = [];
let odPickerError = null;
window.startOneDriveFolderPicker = function(siteId){
  odPickerStack = [{id:null, name:'OneDrive', driveId:null}];
  odPickerFolders = [];
  odPickerError = null;
  go(`#/site/${siteId}/onedrive-folder`);
};
async function loadOdPickerFolders(){
  const current = odPickerStack[odPickerStack.length-1];
  try{
    const body = current.id===SHARED_ROOT_ID
      ? {shared:true}
      : current.id===SITES_ROOT_ID
        ? {companySites:true}
        : current.isSite
          ? {company_site_id: current.id}
          : current.driveId
            ? {parent_id: current.id, drive_id: current.driveId}
            : {parent_id: current.id};
    const res = await sbFetch('/functions/v1/onedrive-list-folders', {method:'POST', body: JSON.stringify(body)});
    const d = await res.json();
    if(!res.ok || d.error){ odPickerError = d.error || 'Could not load OneDrive folders.'; odPickerFolders = []; }
    else {
      odPickerFolders = d.folders || [];
      odPickerError = null;
      // At the true root of the user's own OneDrive, also offer the two
      // ways into folders that aren't in their own drive at all — see the
      // comment above.
      if(current.id===null && !current.driveId){
        odPickerFolders = [
          {id:SHARED_ROOT_ID, name:'🔗 Shared with me', driveId:null, virtual:true},
          {id:SITES_ROOT_ID, name:'🏢 Company Sites', driveId:null, virtual:true},
          ...odPickerFolders,
        ];
      }
    }
  }catch(e){ odPickerError = 'Could not reach OneDrive.'; odPickerFolders = []; }
}
async function renderOneDriveFolderPicker(siteId){
  const site = SITES.find(s=>s.id===siteId);
  if(!odPickerStack) odPickerStack = [{id:null, name:'OneDrive', driveId:null}];
  await loadOdPickerFolders();
  const current = odPickerStack[odPickerStack.length-1];
  const canUseCurrent = current.id && current.id!==SHARED_ROOT_ID && current.id!==SITES_ROOT_ID && !current.isSite;
  const emptyMsg = current.id===SHARED_ROOT_ID ? 'Nothing has been shared with this account yet.'
    : current.id===SITES_ROOT_ID ? 'No SharePoint sites found for this account.'
    : current.isSite ? 'No document libraries in this site.'
    : 'No subfolders here.';
  document.getElementById('app').innerHTML = shell(`
    <p class="stub" style="margin:0 0 10px;">${odPickerStack.map(s=>escapeHtml(s.name)).join(' / ')}</p>
    ${odPickerStack.length>1 ? `<button class="ghostbtn" style="margin-bottom:14px;" onclick="odPickerUp()">‹ Back a folder</button>` : ''}
    ${odPickerError ? `
      <div class="card"><p class="stub" style="color:var(--warn);margin:0;">${escapeHtml(odPickerError)}</p></div>
    ` : `
      ${canUseCurrent ? `<button class="darkbtn" style="margin-bottom:14px;" onclick="selectOneDriveFolder('${siteId}','${current.id}','${jsAttr(current.name)}','${current.driveId||''}')">Use "${escapeHtml(current.name)}" as this site's folder</button>` : `<p class="stub" style="margin:0 0 14px;">Open a folder below, then tap "Use this folder" once you're inside the right one.</p>`}
      ${odPickerFolders.map(f=>`
        <div class="sitecard" onclick="odPickerInto('${f.id}','${jsAttr(f.name)}','${f.driveId||''}',${f.isSite?'true':'false'})">
          <div class="swatch">${f.isSite?'🏢':f.virtual?'🔗':'📁'}</div>
          <div class="info"><div class="name">${escapeHtml(f.name)}</div></div>

      `).join('') || `<div class="empty">${emptyMsg}</div>`}

// Converts one co-ordinate token to decimal degrees. Accepts plain decimal
// ("51.51828", "-0.15139"), decimal with a hemisphere letter ("0.15139 W"),
// and degrees/minutes/seconds as copied straight out of Google Maps/Google
// Search ("51°31'05.8"N", "0°09'05.0"W", also tolerates straight quotes,
// curly quotes, "deg"/"min"/"sec" words, and missing seconds).
function parseCoordToken(raw){
  if(raw==null) return NaN;
  let str = String(raw).trim();
  if(!str) return NaN;
  str = str.replace(/[’′]/g,"'").replace(/[”″]/g,'"');
  // Plain decimal, optionally with a trailing/leading hemisphere letter.
  let m = str.match(/^([NSEW])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSEW])?$/i);
  if(m){
    let val = parseFloat(m[2]);
    const hem = (m[1]||m[3]||'').toUpperCase();
    if(hem==='S'||hem==='W') val = -Math.abs(val);
    else if(hem==='N'||hem==='E') val = Math.abs(val);
    return val;
  }
  // Degrees° minutes' seconds" [hemisphere]
  m = str.match(/^(-?\d+(?:\.\d+)?)\s*(?:°|deg)\s*(\d+(?:\.\d+)?)?\s*(?:'|min)?\s*(\d+(?:\.\d+)?)?\s*(?:"|sec)?\s*([NSEW])?$/i);
  if(m && (m[2]!=null || m[4]!=null)){
    const deg = parseFloat(m[1]);
    const min = m[2]!=null ? parseFloat(m[2]) : 0;
    const sec = m[3]!=null ? parseFloat(m[3]) : 0;
    let val = Math.abs(deg) + min/60 + sec/3600;
    const hem = (m[4]||'').toUpperCase();
    if(hem==='S'||hem==='W' || deg<0) val = -val;
    return val;
  }
  return NaN;
}
// If someone pastes a full "lat, lon" pair (either decimal or DMS) into a
// single box, split it into the two halves so each can be parsed on its own.
function splitCoordPair(str){
  if(!str) return null;
  const s = String(str).trim();
  // DMS pair: two chunks each ending in a hemisphere letter.
  const dmsMatches = s.match(/-?\d+(?:\.\d+)?\s*(?:°|deg)\s*\d*(?:\.\d+)?\s*(?:'|min)?\s*\d*(?:\.\d+)?\s*(?:"|sec)?\s*[NSEW]/gi);
  if(dmsMatches && dmsMatches.length===2) return [dmsMatches[0].trim(), dmsMatches[1].trim()];
  // Decimal pair separated by comma and/or whitespace, e.g. "51.51828, -0.15139".
  const m = s.match(/^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(m) return [m[1], m[2]];
  return null;
}
window.updateGeoMapLink = function(){
  const latEl = document.getElementById('geoManualLat');
  const lonEl = document.getElementById('geoManualLon');
  if(!latEl || !lonEl) return;
  // Auto-split a full pair pasted into either single box.
  const pastedInLat = splitCoordPair(latEl.value);
  if(pastedInLat && !lonEl.value.trim()){ latEl.value = pastedInLat[0]; lonEl.value = pastedInLat[1]; }
  else {
    const pastedInLon = splitCoordPair(lonEl.value);
    if(pastedInLon && !latEl.value.trim()){ latEl.value = pastedInLon[0]; lonEl.value = pastedInLon[1]; }
  }
  const lat = parseCoordToken(latEl.value);
  const lon = parseCoordToken(lonEl.value);
  const link = document.getElementById('geoManualMapLink');
  const preview = document.getElementById('geoManualPreview');
  const valid = isFinite(lat) && isFinite(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180;
  if(link) link.style.display = valid ? 'block' : 'none';
  if(valid) link.href = `https://www.google.com/maps?q=${lat},${lon}`;
  if(preview){
    if(valid){ preview.textContent = 'Interpreted as: '+lat.toFixed(5)+', '+lon.toFixed(5); preview.style.display='block'; }
    else { preview.style.display = 'none'; }
  }
};

/* ================= CHECK IN/OUT ================= */
let checkinBusy = false;
let checkinError = null;
// Pairs up each operative's raw in/out log (chronological, ascending) into
// sessions of {user_id, in, out} — out:null means still on site. An "in"
// with no prior open session starts a new one; a stray "out" with nothing
// open is kept as its own row (in:null) so nothing silently disappears.
function buildCheckinSessions(rowsAsc){
  const byUser = {};
  rowsAsc.forEach(c=>{ (byUser[c.user_id] = byUser[c.user_id] || []).push(c); });
  const sessions = [];
  Object.keys(byUser).forEach(uid=>{
    let open = null;
    byUser[uid].forEach(c=>{
      if(c.type==='in'){
        if(open) sessions.push({user_id:uid, in:open, out:null});
        open = c;
      } else {
        if(open){ sessions.push({user_id:uid, in:open, out:c}); open = null; }
        else sessions.push({user_id:uid, in:null, out:c});
      }
    });
    if(open) sessions.push({user_id:uid, in:open, out:null});
  });
  return sessions;
}
function checkinDayLabel(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if(d.getTime()===today.getTime()) return 'Today';
  if(d.getTime()===yest.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}

window.doCheckAction = async function(siteId, type){
  checkinError = null;
  checkinBusy = true;
  render();

  // OpHUB Basic doesn't include GPS check-in & geofencing — just log the
  // timestamp with no location and skip the distance check entirely.
  if(!orgAllowsGps()){
    const rows = await dbInsert('checkins', {site_id:siteId, user_id:ME.id, type});
    checkinBusy = false;
    if(rows){
      toast((type==='in'?'Checked in':'Checked out')+' · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
    }
    render();
    return;
  }

  const g = await getGeo();
  if(g.error){
    checkinBusy = false; checkinError = g.error; render(); return;
  }
  const site = SITES.find(s=>s.id===siteId);
  if(site.geofence_lat){
    const dist = Math.round(distMeters(g.lat, g.lon, site.geofence_lat, site.geofence_lon));
    const allowedRadius = site.geofence_radius_m || 100;
    if(dist > allowedRadius){
      checkinBusy = false;
      checkinError = `${dist}m from site — must be within ${allowedRadius}m to ${type==='in'?'check in':'check out'}. Move closer and try again.`;
      render();
      return;
    }
  }
  const rows = await dbInsert('checkins', {site_id:siteId, user_id:ME.id, type, lat:g.lat, lon:g.lon, accuracy_m:Math.round(g.accuracy||0)});
  checkinBusy = false;
  if(rows){
    toast((type==='in'?'Checked in':'Checked out')+' · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
  }
  render();
};

// Kept separate from created_at deliberately -- created_at ties (e.g. from a

window.importScheduleExcel = async function(input, siteId){
  const file = input.files && input.files[0]; if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel library failed to load — check connection.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const names = rows.slice(1).map(r=>r[0]).filter(v=>v!=null && String(v).trim()!=='');
    if(!names.length){ toast('No task names found in column A.'); return; }
    const startPos = await nextTaskPosition(siteId);
    const newRows = names.map((n,i)=>({site_id:siteId, name:String(n).trim(), status:'todo', position:startPos+i}));
    const inserted = await dbInsert('schedule_tasks', newRows);
    if(inserted){ toast(`${names.length} task(s) imported`); render(); }
  }catch(e){ toast('Could not read that file — check it\'s a valid .xlsx or .csv.'); }
};
window.importSchedulePdf = async function(input, siteId){
  const file = input.files && input.files[0]; if(!file) return;
  if(typeof pdfjsLib==='undefined'){ toast('PDF reader failed to load — check connection.'); return; }
  const manual = !!(document.getElementById('pdfManualMode') && document.getElementById('pdfManualMode').checked);
  toast('Reading PDF…');
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let lines = [];
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      // Group text fragments into lines by their vertical position, since
      // pdf.js returns individual text runs rather than whole lines.
      let lineMap = {};
      content.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        (lineMap[y] = lineMap[y] || []).push(it.str);
      });
      Object.keys(lineMap).map(Number).sort((a,b)=>b-a).forEach(y=>{
        const text = lineMap[y].join(' ').replace(/\s+/g,' ').trim();
        if(text) lines.push(text);
      });
    }
    if(!lines.length){ toast('No readable text found in that PDF — try ticking manual entry and paste the list yourself.'); pdfImportSiteId=siteId; pdfImportText=''; render(); return; }
    let prefill;
    if(manual){
      // Manual mode: hand back everything we could read so the person can
      // trim it down themselves, rather than guessing what's a task line.
      prefill = lines.join('\n');
    } else {
      // Best-effort auto-pull: drop obvious non-task lines (page numbers,
      // headers, very short fragments) and hope the rest are task rows —
      // still reviewed and editable before anything is actually imported.
      const skip = /^(page\s*\d+|schedule of works|item|description|task|ref\.?|no\.?|date|status|notes?)$/i;
      prefill = lines.filter(l=>{
        const t = l.trim();
        if(t.length<3) return false;
        if(/^\d+$/.test(t)) return false;
        if(skip.test(t)) return false;
        return true;
      }).join('\n');
    }
    pdfImportSiteId = siteId;
    pdfImportText = prefill;
    render();
  }catch(e){ console.error(e); toast('Could not read that PDF — try ticking manual entry and paste the list yourself.'); }
  input.value = '';
};

function pdfHexToRgb(hex){

  if(h.length!==6) return PDFLib.rgb(0.306,0.561,0.820);
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  return PDFLib.rgb(r,g,b);
}

// Shared "Signature Record" pages used by both the RAMS and Toolbox Talk
// signed-PDF exports: a disclaimer paragraph followed by a clean
// Name / Signature / Date table (one row per signer), paginating cleanly if
// the signer list runs past a page.
async function drawSignatureTablePages(pdfDoc, opts){
  const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const RED = PDFLib.rgb(0.784,0.063,0.180);
  const INK = PDFLib.rgb(0.06,0.06,0.07);
  const SLATE = PDFLib.rgb(0.36,0.37,0.41);
  const LINE = PDFLib.rgb(0.85,0.85,0.85);
  const HEADBG = PDFLib.rgb(0.95,0.94,0.91);
  const PAGE_W = 595.28, PAGE_H = 841.89;
  const MARGIN = 50;
  const TABLE_W = PAGE_W - 2*MARGIN;
  const COL_NAME = 160, COL_SIG = 205, COL_DATE = TABLE_W - COL_NAME - COL_SIG;
  const ROW_H = 46, HEADER_H = 24;

  function wrapText(text, font, size, maxWidth){
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(font.widthOfTextAtSize(test, size) > maxWidth && cur){ lines.push(cur); cur = w; }
      else cur = test;
    }
    if(cur) lines.push(cur);
    return lines;
  }

  let page, y;
  function drawTableHeader(){
    page.drawRectangle({x:MARGIN, y:y-HEADER_H, width:TABLE_W, height:HEADER_H, color:HEADBG});
    page.drawText('Name', {x:MARGIN+10, y:y-HEADER_H+7, size:9.5, font:bold, color:INK});
    page.drawText('Signature', {x:MARGIN+COL_NAME+10, y:y-HEADER_H+7, size:9.5, font:bold, color:INK});
    page.drawText('Date', {x:MARGIN+COL_NAME+COL_SIG+10, y:y-HEADER_H+7, size:9.5, font:bold, color:INK});
    page.drawLine({start:{x:MARGIN,y:y-HEADER_H}, end:{x:MARGIN+TABLE_W,y:y-HEADER_H}, thickness:1, color:INK});
    page.drawLine({start:{x:MARGIN+COL_NAME,y:y}, end:{x:MARGIN+COL_NAME,y:y-HEADER_H}, thickness:0.5, color:LINE});
    page.drawLine({start:{x:MARGIN+COL_NAME+COL_SIG,y:y}, end:{x:MARGIN+COL_NAME+COL_SIG,y:y-HEADER_H}, thickness:0.5, color:LINE});
    y -= HEADER_H;
  }
  function newPage(continued){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    y = PAGE_H - 60;
    page.drawText('Signature Record' + (continued ? ' (continued)' : ''), {x:MARGIN, y, size:18, font:bold, color:RED});
    y -= 8;
    page.drawLine({start:{x:MARGIN,y}, end:{x:PAGE_W-MARGIN,y}, thickness:1.5, color:INK});
    y -= 24;
    page.drawText(opts.title, {x:MARGIN, y, size:12, font:bold, color:INK});
    y -= 20;
    if(!continued){
      wrapText(opts.disclaimer, reg, 9.5, TABLE_W).forEach(line=>{
        page.drawText(line, {x:MARGIN, y, size:9.5, font:reg, color:SLATE});
        y -= 13;
      });
      y -= 12;
    }
    drawTableHeader();
  }
  newPage(false);
  for(const s of opts.signers){
    if(y - ROW_H < 70) newPage(true);
    const rowTop = y;
    page.drawLine({start:{x:MARGIN,y:rowTop-ROW_H}, end:{x:MARGIN+TABLE_W,y:rowTop-ROW_H}, thickness:0.5, color:LINE});
    page.drawLine({start:{x:MARGIN+COL_NAME,y:rowTop}, end:{x:MARGIN+COL_NAME,y:rowTop-ROW_H}, thickness:0.5, color:LINE});
    page.drawLine({start:{x:MARGIN+COL_NAME+COL_SIG,y:rowTop}, end:{x:MARGIN+COL_NAME+COL_SIG,y:rowTop-ROW_H}, thickness:0.5, color:LINE});
    page.drawText(s.name, {x:MARGIN+10, y:rowTop-ROW_H/2-4, size:10, font:reg, color:INK});
    if(s.imagePath){
      try{
        const bytes = await pdfFetchImageBytes(publicUrl('signatures', s.imagePath));
        if(bytes){
          let img; try{ img = await pdfDoc.embedPng(bytes); }catch(e){ img = await pdfDoc.embedJpg(bytes); }
          const dim = img.scale(1);
          const boxH = 30, boxW = COL_SIG-20;
          const s2 = Math.min(boxW/dim.width, boxH/dim.height);
          const w = dim.width*s2, h = dim.height*s2;
          page.drawImage(img, {x:MARGIN+COL_NAME+10, y:rowTop-ROW_H/2-h/2, width:w, height:h});
        }
      }catch(e){ /* fall back to blank signature cell */ }
    }
    page.drawText(s.when, {x:MARGIN+COL_NAME+COL_SIG+10, y:rowTop-ROW_H/2-4, size:9.5, font:reg, color:SLATE});
    y = rowTop - ROW_H;
  }
  y -= 16;
  if(y < 60) newPage(true);
  page.drawText('Generated ' + new Date().toLocaleString('en-GB') + ' — original document pages are unmodified above.', {x:MARGIN, y, size:8.5, font:reg, color:SLATE});
}
window.exportSnaggingPDF = async function(siteId, scope){

  toast('Building PDF…');
  try{
    const pdfDoc = await PDFLib.PDFDocument.create();

      page.drawText(site.name, {x:textX, y:PAGE_H-60, size:16, font:bold, color:WHITE});
      page.drawText(companyName + ' · ' + scopeLabel + ' snags', {x:textX, y:PAGE_H-76, size:9.5, font:reg, color:WHITE, opacity:0.9});

      const cardTop = y;

      const pillColor = s.status==='closed' ? OK : WARN;
      const pillBg = s.status==='closed' ? OKBG : WARNBG;
      const textLeft = MARGIN + 16;
      const imgSlot = 84;
      const textWidth = hasPhoto ? (PAGE_W-2*MARGIN) - imgSlot - 32 : (PAGE_W-2*MARGIN) - 32;
      let ty = cardTop - 22;
      const title = (i+1)+'. '+(s.title.length>52 ? s.title.slice(0,49)+'…' : s.title);
      page.drawText(title, {x:textLeft, y:ty, size:12, font:bold, color:INK});
      const pillW = 56;
      page.drawRectangle({x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW, y:ty-3, width:pillW, height:15, color:pillBg});
      page.drawText(s.status.toUpperCase(), {x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW+8, y:ty+1, size:8, font:bold, color:pillColor});

        ty -= 14;
      }
      if(s.pdf_path){
        page.drawText('PDF attachment on file', {x:textLeft, y:ty, size:8.5, font:reg, color:SLATE});
      }

      if(hasPhoto){
        const photoPath = s.status==='closed' && s.closed_photo_path ? s.closed_photo_path : s.photo_path;
        const imgX = MARGIN+(PAGE_W-2*MARGIN)-16-imgSlot+8;
        const imgY = cardTop-blockH+14;
        const boxSize = 76;
        try{
          const bytes = await pdfFetchImageBytes(publicUrl('site-photos', photoPath));
          if(bytes){
            let img; try{ img = await pdfDoc.embedJpg(bytes); }catch(e){ img = await pdfDoc.embedPng(bytes); }
            const dim = img.scale(1);
            const s2 = boxSize/Math.max(dim.width, dim.height);
            const w = dim.width*s2, h = dim.height*s2;
            page.drawImage(img, {x:imgX+(boxSize-w)/2, y:imgY+(boxSize-h)/2, width:w, height:h});
          }
        }catch(e){ /* skip photo if it fails to embed */ }
      }

      y = cardTop - blockH - 14;
    }
    pdfDoc.getPages().forEach((p,idx)=>{ page = p; drawFooter((idx+1)+' of '+pdfDoc.getPageCount()); });

    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = site.name.replace(/[^a-z0-9]+/gi,'-') + '-snagging-' + scope + '.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not build the PDF.');
  }
};

/* ================= RAMS ================= */
let ramsPollTimer = null;
function ramsDocsHtml(siteId, docs, sigsByDoc, canAdd){
  return docs.map(r=>{
    const sigs = sigsByDoc[r.id]||[];
    const mine = sigs.find(s=>s.user_id===ME.id);
    return `
    <div class="ramsdoc">
      <div class="taskrowtop">
        <div class="name">${escapeHtml(r.name)}</div>
        ${canAdd ? `<div class="taskicons"><div class="taskicon danger" onclick="deleteRams('${r.id}','${jsAttr(r.storage_path)}')">🗑</div></div>` : ''}
      </div>
      <div class="meta">Uploaded by ${escapeHtml(nameOf(r.uploaded_by))} · ${new Date(r.uploaded_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</div>
      <a class="viewlink" href="${publicUrl('rams-docs', r.storage_path)}" target="_blank" rel="noopener">View document ↗</a>
      <div class="siglinebox ${mine?'signed':''}" onclick="${mine?'':`signRams('${siteId}','${r.id}')`}" style="${mine?'':'cursor:pointer;'}">
        ${mine ? (mine.signature_image_path ? `<img src="${publicUrl('signatures', mine.signature_image_path)}" style="height:34px;max-width:140px;object-fit:contain;">` : `<span class="name">${escapeHtml(ME.name)}</span>`) + `<span>Signed ${new Date(mine.signed_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</span>` : 'Tap to sign'}
      </div>
      ${sigs.length ? `<div class="signerlist">${sigs.map(s=>`<div style="display:flex;align-items:center;gap:8px;">✓ ${escapeHtml(nameOf(s.user_id))}${s.signature_image_path ? `<img src="${publicUrl('signatures', s.signature_image_path)}" style="height:20px;object-fit:contain;">` : ''} — ${new Date(s.signed_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</div>`).join('')}</div>
        ${canAdd ? `<button class="ghostbtn" style="margin-top:10px;" onclick="exportSignedRams('${r.id}')">Export PDF with all signatures</button>` : ''}` : ''}
    </div>`;
  }).join('') || `<div class="empty">No RAMS uploaded.</div>`;
}
async function fetchRamsData(siteId){
  const docs = await dbSelect('rams_docs', 'site_id=eq.'+siteId+'&order=uploaded_at.desc');
  let sigsByDoc = {};
  if(docs.length){
    const ids = docs.map(d=>d.id).join(',');
    const sigs = await dbSelect('rams_signatures', 'rams_id=in.('+ids+')');
    sigs.forEach(s=>{ (sigsByDoc[s.rams_id]=sigsByDoc[s.rams_id]||[]).push(s); });
  }
  return {docs, sigsByDoc};
}
async function renderRams(siteId){
  const site = SITES.find(s=>s.id===siteId);
  const canAdd = isManager(ME);
  const {docs, sigsByDoc} = await fetchRamsData(siteId);

  document.getElementById('app').innerHTML = shell(`
    <div id="ramsDocsList">${ramsDocsHtml(siteId, docs, sigsByDoc, canAdd)}</div>

    ${canAdd ? `
      <div class="card">
        <p class="sectiontitle" style="margin-top:0;">Upload RAMS</p>
        <div class="formfield"><input type="text" id="ramsName" placeholder="Document name, e.g. Working at Height"></div>
        <label class="ghostbtn" style="display:block;cursor:pointer;text-align:center;margin-bottom:10px;">Choose PDF
          <input type="file" accept="application/pdf" id="ramsFile" style="display:none" onchange="document.getElementById('ramsFileName').textContent=this.files[0]?this.files[0].name:''">
        </label>
        <p class="stub" id="ramsFileName" style="margin:-4px 0 10px;"></p>
        <button class="darkbtn" onclick="addRams('${siteId}')">Upload</button>
        <p class="stub">Original PDF is stored untouched. Each signature is recorded separately, so multiple operatives can sign without corrupting the file — see the note in chat.</p>
      </div>
    ` : ''}
  `, {title:'RAMS', subtitle:site.name, back:`#/site/${siteId}/hs`, siteId, activeTab:'more'});

  if(ramsPollTimer) clearInterval(ramsPollTimer);
  ramsPollTimer = setInterval(async ()=>{
    const el = document.getElementById('ramsDocsList');
    if(!el){ clearInterval(ramsPollTimer); ramsPollTimer = null; return; }
    const {docs, sigsByDoc} = await fetchRamsData(siteId);
    const freshEl = document.getElementById('ramsDocsList');
    if(freshEl) freshEl.innerHTML = ramsDocsHtml(siteId, docs, sigsByDoc, canAdd);
  }, 7000);
}
window.addRams = async function(siteId){
  const name = document.getElementById('ramsName').value.trim();
  const fileInput = document.getElementById('ramsFile');
  const file = fileInput.files && fileInput.files[0];

window.exportSignedRams = async function(ramsId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  toast('Building signed PDF…');
  const docs = await dbSelect('rams_docs', 'id=eq.'+ramsId+'&select=*');
  const doc = docs[0];
  if(!doc){ toast('Document not found.'); return; }
  const sigs = await dbSelect('rams_signatures', 'rams_id=eq.'+ramsId+'&order=signed_at.asc');
  if(!sigs.length){ toast('No signatures yet.'); return; }
  try{
    const srcBytes = await (await fetch(publicUrl('rams-docs', doc.storage_path))).arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(srcBytes);
    const disclaimer = `I have read and understood the contents of this RAMS document (${doc.name}). At all times employees must work in a safe manner both to prevent personal injury or injury/harm to others. Anything I did not understand has been explained to me to my satisfaction.`;
    const signers = sigs.map(s=>({
      name: nameOf(s.user_id),
      when: new Date(s.signed_at).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
      imagePath: s.signature_image_path,
    }));
    await drawSignatureTablePages(pdfDoc, {title: doc.name, disclaimer, signers});

    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = doc.name.replace(/[^a-z0-9]+/gi,'-') + '-signed.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('Signed PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not build the signed PDF — the source file may not be a valid PDF.');
  }
};

window.setToolboxTalkStatus = async function(siteId, tbtId, newStatus){
  if(newStatus==='live'){
    // Only one toolbox talk is ever "live" per site at a time — automatically
    // mark any other live talk at this site as completed first.
    const others = await dbSelect('toolbox_talks', 'site_id=eq.'+siteId+'&status=eq.live&select=id');
    for(const o of others){ await dbUpdate('toolbox_talks', o.id, {status:'completed'}); }

    // Issuing a Bank TBT for signing makes an independent live copy rather
    // than converting the bank item in place — that way the original stays
    // in Bank TBT, ready to reuse next time (e.g. next week's toolbox talk),
    // and signatures attach only to the live copy that was actually issued.
    const rows = await dbSelect('toolbox_talks', 'id=eq.'+tbtId+'&select=*');
    const source = rows && rows[0];
    if(!source){ toast('Toolbox talk not found.'); return; }
    if(source.status==='bank'){
      const created = await dbInsert('toolbox_talks', {site_id:siteId, org_id:source.org_id, title:source.title, storage_path:source.storage_path, status:'live', created_by:ME.id});
      if(created && created[0]){
        tbtFilter = 'live';
        toast('Issued for signing — original kept in Bank TBT for reuse');
        go(`#/site/${siteId}/hs/tbt/${created[0].id}`);
      }
      return;
    }
  }
  const row = await dbUpdate('toolbox_talks', tbtId, {status:newStatus});
  if(row){
    tbtFilter = newStatus;
    toast(newStatus==='live' ? 'Issued for signing' : 'Marked as completed');
    render();
  }
};
window.deleteToolboxTalk = async function(siteId, tbtId, storagePath){
  if(!confirm('Delete this toolbox talk and all its signatures? This can\'t be undone.')) return;
  const ok = await dbDelete('toolbox_talks', tbtId);
  if(ok){
    // The same PDF can be shared by several talks now — the Bank TBT
    // original, the live copy issued from it, and copies pre-loaded into
    // other sites all point at the same storage_path. Only remove the
    // actual file once nothing else references it, otherwise deleting one
    // copy would break the document link on every other copy.
    try{
      const stillUsed = await dbSelect('toolbox_talks', 'storage_path=eq.'+encodeURIComponent(storagePath)+'&select=id&limit=1');
      const stillUsedAsTemplate = await dbSelect('tbt_templates', 'storage_path=eq.'+encodeURIComponent(storagePath)+'&select=id&limit=1');
      if(!stillUsed.length && !stillUsedAsTemplate.length){
        await sbFetch('/storage/v1/object/rams-docs/'+storagePath, {method:'DELETE'});
      }
    }catch(e){ /* non-fatal — the file being left behind is harmless */ }
    toast('Toolbox talk deleted');
    go(`#/site/${siteId}/hs/tbt`);
  }
};

window.confirmSendMaterial = async function(siteId, matId){
  if(!sendingMaterial || sendingMaterial.matId !== matId) return;
  const supplierId = sendingMaterial.supplierId;
  const dateInput = document.getElementById('reqDeliveryDate_'+matId);
  const requiredForDelivery = dateInput ? dateInput.value : '';
  if(!requiredForDelivery){ toast('Required for delivery date is required before sending.'); return; }
  const suppliers = await dbSelect('suppliers', 'id=eq.'+supplierId+'&select=*');
  const supplier = suppliers && suppliers[0];
  if(!supplier){ toast('Could not find that supplier.'); return; }
  const material = (await dbSelect('materials', 'id=eq.'+matId+'&select=*'))[0];
  const row = await dbUpdate('materials', matId, {status:'sent', merchant:supplier.name, supplier_id:supplierId, sent_at:new Date().toISOString(), required_for_delivery:requiredForDelivery});
  if(!row){ return; }
  sendingMaterial = null;
  delete materialSupplierChoice[matId];
  toast('Order routed to '+supplier.name+' — emailing…');
  render();
  try{
    const res = await sbFetch('/functions/v1/send-material-order', {method:'POST', body: JSON.stringify({
      material_id: matId, supplier_email: supplier.email, supplier_name: supplier.name,
      item: material ? material.item : '', qty: material ? material.qty : '', site_id: siteId,
      required_for_delivery: requiredForDelivery,
    })});
    const d = await res.json();
    if(res.ok && !d.error){
      await dbUpdate('materials', matId, {email_sent_at:new Date().toISOString()});
      toast('Order emailed to '+supplier.name+' (you\'ve been CC\'d)');
    } else {
      console.error('send-material-order failed:', d.error || res.status);
      toast('Routed to '+supplier.name+', but the order email failed to send — '+(d.error ? String(d.error).slice(0,140) : 'check it manually.'));
    }
  }catch(e){
    console.error('send-material-order failed:', e);
    toast('Routed to '+supplier.name+', but the order email failed to send — check it manually.');
  }
  render();
};

window.uploadDrawingFile = async function(input, siteId, folderId){
  const files = input.files ? Array.from(input.files) : [];
  if(!files.length) return;
  const allowed = {'application/pdf':true, 'image/jpeg':true, 'image/png':true};
  const label = document.getElementById('drawingUploadLabel');
  let uploaded = 0, skipped = 0;
  for(let i=0; i<files.length; i++){
    const file = files[i];
    if(!allowed[file.type]){ skipped++; continue; }
    if(label) label.textContent = `Uploading ${i+1} of ${files.length}…`;
    const path = siteId+'/'+(folderId||'root')+'/'+uid()+'-'+file.name.replace(/[^a-z0-9.\-]+/gi,'_');
    const stored = await uploadToStorage('drawings', path, file, file.type);
    if(!stored) continue;
    const rows = await dbInsert('drawing_files', {site_id:siteId, folder_id:folderId||null, name:file.name, storage_path:stored, uploaded_by:ME.id});
    if(rows) uploaded++;
  }
  if(uploaded) toast(uploaded===1 ? 'Drawing uploaded' : `${uploaded} drawings uploaded`+(skipped?`, ${skipped} skipped (wrong file type)`:''));
  else if(skipped) toast('Please choose PDF, JPEG or PNG files.');
  render();
};

  if(!confirm('Delete this drawing? This can\'t be undone.')) return;
  const ok = await dbDelete('drawing_files', fileId);
  if(ok){

    toast('Drawing deleted');
    render();
  }
};

  const row = await dbUpdate('drawing_files', fileId, {name: trimmed});
  if(row){ toast('Drawing renamed'); render(); }
};

/* ================= router / render ================= */
async function render(){
  if(ramsPollTimer){ clearInterval(ramsPollTimer); ramsPollTimer = null; }
  const preParts = parseRoute();
  if(preParts[0]==='join' && preParts[1]){ return renderJoin(preParts[1]); }
  if(!SESSION || !ME){ renderLogin(); return; }
  if(ME.role==='superadmin'){ return renderAdmin(); }
  if(ME.role==='admin' && ORG && !ORG.logo_path){ renderCompanySetup(); return; }
  const parts = parseRoute();
  if(!parts.length || parts[0]==='sites'){ renderSites(); return; }
  if(parts[0]==='team'){
    // Web-app return leg of the OneDrive OAuth flow: the callback page
    // redirects here with ?onedrive=success|error so we can toast the
    // result, since there's no app to hand off to like the native flow has.
    const odStatus = routeQuery().get('onedrive');
    if(odStatus){
      toast(odStatus==='success' ? 'OneDrive connected' : 'OneDrive connection failed — try again.');
      history.replaceState(null, '', location.pathname + location.search + '#/team');
    }
    return renderTeam();
  }
  if(parts[0]==='signature'){ return renderSignaturePad(); }
  if(parts[0]==='site' && parts[1]){
    const siteId = parts[1];
    const page = parts[2] || 'home';
    // Keep the bottom tab bar's Messages badge fresh on every site-scoped
    // navigation, not just when visiting Messages itself.
    if(page!=='messages'){ currentUnreadMsgs = await unreadCountForSite(siteId); }
    if(page==='home') return renderSiteHome(siteId);
    if(page==='more') return renderMore(siteId);
    if(page==='checkin') return renderCheckin(siteId);
    if(page==='schedule') return renderSchedule(siteId);
    if(page==='snagging'){
      const sub = parts[3];
      if(!sub) return renderSnaggingFolder(siteId);
      if(sub==='list') return renderSnagging(siteId);
      if(sub==='variations') return renderVariations(siteId);
      return renderSnaggingFolder(siteId);
    }
    if(page==='drawings'){
      const folderId = parts[3] || null;
      return renderDrawings(siteId, folderId);
    }
    if(page==='hs'){
      const sub = parts[3];
      if(!sub) return renderHealthSafety(siteId);
      if(sub==='rams') return renderRams(siteId);
      if(sub==='tbt'){
        const tbtId = parts[4];
        if(tbtId) return renderToolboxTalkView(siteId, tbtId);
        return renderToolboxTalks(siteId);
      }
      return renderHealthSafety(siteId);
    }
    if(page==='materials') return renderMaterials(siteId);
    if(page==='messages') return renderMessages(siteId);
    if(page==='variations') return renderVariations(siteId);
    if(page==='team') return renderAssignTeam(siteId);
    if(page==='onedrive-folder') return renderOneDriveFolderPicker(siteId);
  }
  renderSites();
}

registerOneDriveDeepLinkHandler();
init();
</script>
</body>
</html>
