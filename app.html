<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OpHUB</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpHUB">
<meta name="theme-color" content="#101114">
<link rel="apple-touch-icon" href="assets/ophub-logo.png?v=2">
<link rel="icon" href="assets/ophub-logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand1:#4E8FD1;
    --brand2:#101114;
    --brand1-text:#fff;
    --red:#C8102E;
    --ink:#101114;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --line:#E4E1D8;
    --slate:#5B5F68;
    --slate-light:#9A9DA3;
    --ok:#2E6B3E;
    --ok-bg:#E4EFE4;
    --warn:#B0740F;
    --warn-bg:#F5EBD6;
    --blue:#2A4B7C;
    --blue-bg:#E7EDF5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  /* Lots of tiles/rows/buttons in this app are plain divs/spans with an
     onclick handler rather than real <button>/<a> elements, so the browser
     was showing its default text-select (I-beam) cursor over their text
     instead of a normal pointer — this catches all of them in one go. */
  [onclick]{cursor:pointer;}
  body{
    margin:0;background:#EFEDE6;
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
  }
  #app{
    max-width:460px;margin:0 auto;min-height:100vh;
    background:var(--paper);
    display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  /* Same app, same layout, same everything below this width — on a wide
     desktop browser window this just widens #app into a real page (like
     admin.html's topbar + wide content layout) instead of framing it as a
     phone card. Nothing inside #app is touched, so behavior is identical. */
  @media (min-width:760px){
    #app{
      max-width:1180px;box-shadow:none;
    }
    .appbar{padding:20px 32px;padding-top:calc(20px + env(safe-area-inset-top));}
    .scrollarea{padding:24px 32px 32px;}
    .tabbar{position:sticky;bottom:0;}
  }
  /* Phone-only header text scale-down (0.85x) — only applies below the
     desktop breakpoint above, so the wide-browser header stays full size. */
  @media (max-width:759px){
    .appbar .brandline{font-size:12.75px;}
    .appbar .brandline.lg{font-size:19.125px;}
    .appbar .brandline.orgname{font-size:15.9375px;}
    .appbar h2{font-size:20.4px;}
    .appbar h2.lg{font-size:22.95px;}
    .rolechip{font-size:6.63px;}
  }
  .stripe-edge{height:5px;width:100%;flex:0 0 auto;
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.14) 0 2px, transparent 2px 7px),
      linear-gradient(90deg, var(--brand1), var(--brand2));}

  .appbar{background:var(--brand1);color:var(--brand1-text);padding:21px 24px 18px;padding-top:calc(21px + env(safe-area-inset-top));flex:0 0 auto;}
  .appbar .row{display:flex;align-items:center;gap:15px;}
  .badge{background:var(--brand1);color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;padding:3px 7px;border-radius:4px;}
  .brandmark{width:72px;height:72px;border-radius:0;object-fit:contain;background:#fff;flex:0 0 72px;padding:4px;}
  .brandline{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--brand1-text);opacity:.8;margin-bottom:1.5px;}
  .brandline.lg{font-size:22.5px;opacity:1;}
  .brandline.orgname{font-size:18.75px;opacity:1;}
  .appbar h2{margin:0;font-size:24px;font-weight:800;color:var(--brand1-text);}
  .appbar h2.lg{font-size:27px;}
  .appbar .meta{font-size:clamp(9px, 3.3vw, 12.7px);color:var(--brand1-text);opacity:.8;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .homebtn{cursor:pointer;color:var(--brand1-text);font-size:19px;line-height:1;width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.16);}
  .img-viewer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;padding:20px;}
  .img-viewer-overlay img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .geo-modal-overlay{display:none;position:fixed;inset:0;background:rgba(16,17,20,0.55);z-index:9999;align-items:center;justify-content:center;padding:20px;}
  .geo-modal-card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.25);}
  .geo-modal-card h3{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--ink);}
  .geo-modal-card p.stub{margin:0 0 16px;}
  .geo-modal-btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer;}
  .geo-modal-btn .sub2{display:block;font-weight:600;font-size:11.5px;color:var(--slate);margin-top:2px;}
  .geo-modal-btn:hover{border-color:var(--slate-light);}
  .geo-modal-cancel{display:block;width:100%;text-align:center;background:none;border:none;padding:10px;margin-top:4px;
    font-weight:700;font-size:13px;color:var(--slate);cursor:pointer;}
  .backarrow{font-size:57px;font-weight:900;line-height:1;color:var(--brand1-text);opacity:.95;padding:6px 21px 6px 0;margin:-6px 0;display:flex;align-items:center;min-height:66px;min-width:54px;text-shadow:0 0 1px currentColor, 0.5px 0 0 currentColor;}
  .rolechip{margin-left:auto;background:#232323;color:#ccc;font-size:7.8px;font-weight:800;
    font-family:Calibri,'Open Sans',sans-serif;padding:3px 6.75px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;}

  .scrollarea{flex:1;overflow-y:auto;padding:14px;padding-bottom:26px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .sectiontitle{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin:4px 0 10px;}

  .primarybtn,.darkbtn,.ghostbtn{
    display:block;width:100%;padding:13px;border-radius:10px;border:none;
    font-weight:800;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;text-align:center;
  }
  .primarybtn{background:var(--brand1);color:#fff;}
  .exportbtn{padding:8.125px;font-size:8.4375px;}
  .darkbtn{background:var(--brand1);color:#fff;}
  .ghostbtn{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .primarybtn:disabled,.darkbtn:disabled{background:#d8d5cb;color:#9a978c;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea,select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14px;background:#fff;color:var(--ink);font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  label.field-label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--slate);margin:0 0 6px;}
  .formfield{margin-bottom:12px;}
  .row-gap{display:flex;gap:8px;}
  .row-gap > *{flex:1;}

  .rolepick{display:flex;gap:10px;margin-top:6px;}
  .rolebtn{
    flex:1;padding:18px 10px;border-radius:12px;border:2px solid var(--line);
    background:#fff;text-align:center;font-weight:800;font-size:13.5px;color:var(--slate);
  }
  .rolebtn .ic{font-size:24px;display:block;margin-bottom:6px;}
  .rolebtn.selected{border-color:var(--brand1);background:#E9F1FB;color:var(--brand1);}

  .authtabs{display:flex;gap:8px;margin-bottom:14px;}
  .authtab{flex:1;text-align:center;padding:10px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--slate);}
  .authtab.active{background:var(--brand1);border-color:var(--brand1);color:#fff;}

  .sitecard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:10px;position:relative;}
  .sitecard .swatch{width:44px;height:44px;border-radius:9px;flex:0 0 44px;
    background:linear-gradient(135deg,var(--brand1),var(--brand2));display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;}
  .sitecard .swatch.personswatch{width:55px;height:55px;border-radius:11px;flex:0 0 55px;font-size:18.75px;}
  .sitecard .info{flex:1;min-width:0;}
  .sitecard .info .name{font-weight:800;font-size:14.5px;}
  .sitecard .info .addr{font-size:12px;color:var(--slate);margin-top:1px;}
  .sitecard .status{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;flex:0 0 auto;}
  .sitecard .status.active{background:var(--ok-bg);color:var(--ok);}
  .sitecard .status.live{background:var(--ok-bg);color:var(--ok);}
  .sitecard .status.upcoming{background:var(--warn-bg);color:var(--warn);}
  .sitecard .status.closed{background:var(--line);color:var(--slate);}
  .statusmenu{position:absolute;top:calc(100% + 4px);right:12px;z-index:60;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);
    padding:6px;min-width:150px;}
  .statusmenu-item{padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--ink);border-radius:7px;cursor:pointer;}
  .statusmenu-item:hover{background:var(--paper);}
  .statusmenu-item.danger{color:var(--brand1);}
  .closedtoggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .closedtoggle .arrow{font-size:10px;}
  /* Shared "dropdown row" aesthetic — every collapsible row in the app
     (Team & Admin sections, Messages sections, Schedule sections/upload,
     Suppliers, site geofence, recent check-ins, closed material requests,
     the old closed-sites toggle, etc) renders with this one look: a bit
     thinner than the filter tab chips, stretched full-width, with a
     chevron, where clicking anywhere on the row toggles it open/closed. */
  .ddrow{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    width:100%;box-sizing:border-box;padding:9px 14px;margin:10px 0 0;
    border-radius:9px;border:1px solid var(--line);background:#fff;
    font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--ink);}
  .ddrow:first-child{margin-top:0;}
  .ddrow .arrow{font-size:10px;color:var(--slate);flex:0 0 auto;}

  .status-strip{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;padding:5px 9px;border-radius:999px;}
  .pill.on{background:var(--ok-bg);color:var(--ok);}
  .pill.off{background:var(--line);color:var(--slate);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile-wide{grid-column:1 / -1;flex-direction:row;justify-content:center;align-items:center;min-height:72px;}
  .tile-wide .icon{margin-bottom:0;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-height:112px;position:relative;}
  .tile .icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .tile .lbl{font-size:15.94px;font-weight:800;line-height:1.2;font-family:Calibri,'Open Sans',sans-serif;}
  .tile .sub{font-size:13.39px;color:var(--slate-light);font-family:Calibri,'Open Sans',sans-serif;}
  .tile .badge-count{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:10px;
    font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

  .task{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:12px;margin-bottom:8px;}
  .checkbox{width:22px;height:22px;border-radius:5px;flex:0 0 22px;margin-top:1px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900;}
  .checkbox.progress{border-color:var(--warn);background:var(--warn);}
  .checkbox.done{border-color:var(--ok);background:var(--ok);}
  .taskbody{flex:1;min-width:0;}
  .statusbtns{display:flex;gap:6px;margin-top:9px;}
  .statusbtn{flex:1;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    padding:8px 4px;border-radius:8px;border:1.5px solid var(--line);color:var(--slate);background:var(--paper);}
  .statusbtn.active-todo{border-color:var(--slate-light);color:var(--ink);background:#fff;}
  .statusbtn.active-progress{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);}
  .statusbtn.active-done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .taskname{font-size:13.5px;font-weight:700;}
  .taskname.done{color:var(--ink);}
  .taskname .donetick{color:var(--ok);font-weight:800;margin-left:6px;}
  .taskname-input{font-size:13.5px;font-weight:700;flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;background:#fff;color:var(--ink);}
  .taskmeta{font-size:11px;color:var(--slate);margin-top:3px;}
  .taskphoto{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .taskphoto img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .addphotobtn{margin-top:8px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--brand1);}
  .taskrowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .taskicons{display:flex;gap:4px;flex:0 0 auto;}
  .taskicon{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--slate);}
  .taskicon.danger{color:var(--brand1);}
  .taskicon.lg{width:39px;height:39px;flex:0 0 39px;font-size:18px;border-radius:8px;}
  .taskeditrow{display:flex;gap:6px;margin-bottom:4px;}
  .taskeditrow input{flex:1;padding:7px 9px;font-size:13px;}
  .taskeditrow button{flex:0 0 auto;padding:7px 10px;font-size:11px;border-radius:6px;border:none;font-weight:800;}

  .snag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .snag .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .snag .title{font-size:13px;font-weight:700;margin-top:2px;}
  .snag .loc{font-size:11px;color:var(--slate);margin-top:3px;}
  .statustag2{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex:0 0 auto;}
  .statustag2.open,.statustag2.live{background:var(--warn-bg);color:var(--warn);}
  .statustag2.closed{background:var(--ok-bg);color:var(--ok);}
  .statustag2.pending{background:#EAE6DC;color:#6B6F76;}
  .snagthumb{width:100%;max-width:160px;border-radius:8px;margin-top:8px;display:block;}
  .filterrow{display:flex;gap:8px;margin-bottom:12px;align-items:stretch;}
  .filterchip{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;min-height:34px;line-height:1.2;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--slate);}
  .filterchip.active{background:var(--brand1);border-color:var(--brand1);color:#fff;}
  .closurerow{display:flex;gap:10px;margin-top:10px;align-items:center;}
  .closurerow img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}

  .ramsdoc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
  .ramsdoc .name{font-size:13.5px;font-weight:800;}
  .ramsdoc .meta{font-size:11px;color:var(--slate);margin-top:3px;}
  .ramsdoc .viewlink{font-size:11.5px;color:var(--blue);font-weight:700;text-decoration:underline;}
  .siglinebox{margin-top:12px;border:1.5px dashed var(--line);border-radius:8px;min-height:56px;
    display:flex;align-items:center;justify-content:center;color:var(--slate-light);font-size:12px;font-weight:600;
    flex-direction:column;gap:2px;padding:8px;text-align:center;}
  .siglinebox.signed{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .siglinebox.signed .name{font-family:'Segoe Script','Brush Script MT',cursive;font-size:20px;}
  .signerlist{margin-top:10px;font-size:11px;color:var(--slate);}
  .signerlist div{padding:3px 0;}

  .matcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .matcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .matcard .name{font-size:13.5px;font-weight:700;}
  .matcard .qty{font-size:11.5px;color:var(--slate);margin-top:2px;}
  .statustag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;}
  .statustag.sent{background:var(--blue-bg);color:var(--blue);}
  .statustag.pending{background:var(--warn-bg);color:var(--warn);}
  .merchantrow{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--slate);}
  .merchantchip{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;
    font-weight:700;font-size:10.5px;}
  .merchantchip.pickable{cursor:pointer;}
  .merchantchip.pickable.active{background:var(--brand1);border-color:var(--brand1);color:#fff;}
  .merchantchip.sent{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}

  .varcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .varcard img{width:100%;border-radius:8px;margin-bottom:8px;}
  .varcard .desc{font-size:13px;}
  .varcard .meta{font-size:11px;color:var(--slate);margin-top:6px;}
  .photoupload{background:var(--card);border:1.5px dashed var(--slate-light);border-radius:10px;
    min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--slate);font-size:12px;font-weight:700;overflow:hidden;}
  .photoupload img{width:100%;height:100%;object-fit:cover;}

  .empty{text-align:center;color:var(--slate-light);font-size:13px;padding:26px 10px;}

  .tabbar{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 3px 12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid var(--line);}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-weight:700;
    color:var(--slate-light);padding:4px 5px;border-radius:10px;}
  .tb.active{color:var(--brand1);}
  .tabicon{font-size:15px;}
  .tb.tb-emph{border:1.5px solid var(--line);padding:6px 9px;margin:-4px 0;background:var(--paper);font-size:9.5px;}
  .tb.tb-emph .tabicon{font-size:19px;}
  .tb.tb-emph.active{border-color:var(--brand1);}

  .toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:13px 16px;
    border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:10px;max-width:428px;margin:0 auto;z-index:100;}
  .toast .stripe{width:5px;align-self:stretch;background:var(--brand1);border-radius:3px;}

  .stub{font-size:11px;color:var(--slate-light);font-style:italic;margin-top:6px;}
  .errbox{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function exportFilename(siteName, label, ext){

function compressImage(file, opts){
  // 1600px / 0.85 quality (the default) keeps photos sharp enough for
  // snagging reports and OneDrive exports while still compressing well
  // below the original camera file size (was 480px/0.6, which looked like
  // a thumbnail). That default is overkill for things that are never shown
  // bigger than a small icon (a company logo, for instance) — a full-size
  // modern phone photo (4000px+, several MB) run through the 1600px target
  // is real work for the JS-side canvas decode/redraw/encode, especially on
  // an older Android device, which is what made logo upload feel "frozen"
  // with no progress indicator shown while it churned. Pass {maxW, quality}
  // to use a smaller/faster target for cases like that.
  opts = opts || {};
  const maxW = opts.maxW || 1600;
  const quality = opts.quality != null ? opts.quality : 0.85;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('read failed'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('load failed'));
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const c=document.createElement('canvas'); c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function getGeo(){
  // In the native app, use Capacitor's Geolocation plugin — it drives Android's
  // runtime permission prompt properly. Bare navigator.geolocation inside an
  // embedded WebView often silently fails on Android because nothing ever
  // triggers the permission dialog.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation){
    try{
      const perm = await window.Capacitor.Plugins.Geolocation.checkPermissions();
      if(perm.location !== 'granted' && perm.coarseLocation !== 'granted'){
        const req = await window.Capacitor.Plugins.Geolocation.requestPermissions();
        if(req.location !== 'granted' && req.coarseLocation !== 'granted'){
          return {error:'Location permission denied. Enable it for this app in your phone\'s Settings.'};
        }
      }
      const pos = await window.Capacitor.Plugins.Geolocation.getCurrentPosition({enableHighAccuracy:true, timeout:12000});
      return {lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy};
    }catch(e){
      return {error: (e && e.message) || 'Could not get your location.'};
    }
  }
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve({error:'Location not supported.'}); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),
      e=>resolve({error:e.message||'Location permission denied.'}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  });
}
function distMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

        return await window.Capacitor.Plugins.Preferences.get({key});

  async set(key, value){
    try{
      if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences){
        await window.Capacitor.Plugins.Preferences.set({key, value});

      }
    }catch(e){ /* fall through to localStorage */ }
    try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
  },

// Web Share API — hands a file to the OS share sheet (Mail, WhatsApp,
// Messages, AirDrop, "Save to Files", etc.). Supported on iOS 15+ (our
// minimum target) inside both Safari and a Capacitor WKWebView. Returns
// true if the share sheet was actually shown.
async function shareFile(blob, filename, mimeType){
  try{
    const file = new File([blob], filename, {type: mimeType});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: filename});
      return true;
    }
  }catch(e){ /* user cancelled the share sheet, or it's unsupported — ignore */ }
  return false;
}
// Shared PDF delivery for every generated export (reports, RAMS, toolbox talks,
// snagging, schedule of works). On the website, this just triggers a normal
// browser download like before. Inside the native app, a plain <a download>
// silently does nothing — the WKWebView has no download manager — so instead
// we upload the finished PDF to Supabase Storage and open the public URL in
// the in-app browser (Safari's own PDF viewer — reliably scrolls through
// every page, and has a built-in Share button for emailing/WhatsApp/etc).
// The PDF's title metadata (set via pdfDoc.setTitle() before this is called)
// is what Safari shows in its title bar, so the long Supabase URL isn't
// what the user actually sees.
async function deliverPdf(bytes, filename){
  const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const blob = new Blob([bytes], {type:'application/pdf'});
  if(isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser){
    toast('Opening PDF…');
    const safeName = filename.replace(/[^a-z0-9.\-]+/gi,'-');
    const path = 'exports/'+uid()+'-'+safeName;
    try{
      const stored = await uploadToStorage('site-photos', path, blob, 'application/pdf');
      // Supabase Storage's `download` query param sets a Content-Disposition
      // filename header on the response — that's what Safari's built-in PDF
      // viewer actually reads for its title bar (setTitle() on the PDF's own
      // internal metadata is NOT read by SFSafariViewController, which is
      // why the raw supabase.co URL was showing up there instead). Android
      // Chrome reads that same header differently though — it silently
      // starts a background download instead of showing the PDF, leaving
      // the tab blank with just the raw URL visible (the same "long link"
      // bug reported for Drawings' View button) — so only add it on iOS.
      const isIos = window.Capacitor.getPlatform && window.Capacitor.getPlatform()==='ios';
      const openUrl = publicUrl('site-photos', stored) + (isIos ? '?download='+encodeURIComponent(filename) : '');
      if(stored){ await window.Capacitor.Plugins.Browser.open({url: openUrl}); return; }
    }catch(e){ /* fall through to the download-link fallback below */ }
  }
  // Non-native (web/PWA): open the PDF in a new tab so the browser's own PDF
  // viewer shows it straight away — that viewer already has its own
  // print/download/share icons built in, so nobody's asked to share a file
  // they haven't seen yet. Sharing used to fire automatically here via the
  // Web Share API before the PDF was ever shown — removed for exactly that
  // reason. Only fall back to a plain download if the tab was blocked.
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(!win){
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Pop-up blocked — PDF downloaded instead');
  } else {
    toast('PDF opened — use the viewer\'s own share/download button if you need it');
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
// Same problem as deliverPdf above (a plain download link does nothing inside
// the native app) but for Excel exports. There's no in-app spreadsheet
// viewer, so on native this uploads the file and hands it to the system —
// tapping it opens iOS's own document preview, from where it can be saved
// or shared like any other file.
async function deliverExcelFile(wb, filename){
  const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if(isNative){
    toast('Opening file…');
    try{
      const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
      const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const safeName = filename.replace(/[^a-z0-9.\-]+/gi,'-');
      const path = 'exports/'+uid()+'-'+safeName;
      const stored = await uploadToStorage('site-photos', path, blob, blob.type);
      if(stored && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser){
        await window.Capacitor.Plugins.Browser.open({url: publicUrl('site-photos', stored)+'?download='+encodeURIComponent(filename)});
        return;
      }
    }catch(e){ /* fall through to the direct-download fallback below */ }
  }
  XLSX.writeFile(wb, filename);
  toast('Excel file downloaded');
}

/* ================= push notifications ================= */
// Registers this device for push (native app only) and saves the FCM token
// against the signed-in user so server-side reminders (e.g. the 3pm sign-out
// nudge) know where to deliver. Silently no-ops on the plain website.
let pushRegistered = false;
async function registerPushNotifications(){
  try{
    if(pushRegistered) return;
    if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
    const PN = window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
    if(!PN) return;
    let perm = await PN.checkPermissions();
    if(perm.receive !== 'granted'){ perm = await PN.requestPermissions(); }
    if(perm.receive !== 'granted') return;
    pushRegistered = true;
    PN.addListener('registration', async (token)=>{
      if(!ME || !token || !token.value) return;
      try{
        await sbFetch('/rest/v1/push_tokens?on_conflict=token', {
          method:'POST',
          headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify({user_id: ME.id, token: token.value, platform: window.Capacitor.getPlatform(), updated_at: new Date().toISOString()})
        });
      }catch(e){ console.error('Could not save push token', e); }
    });
    PN.addListener('registrationError', (err)=>{ console.error('Push registration error', err); });
    // Tapping a push notification (message/material/variation/snag alert)
    // jumps straight to the relevant tab on the relevant site instead of
    // just opening the app to wherever it was last left.
    PN.addListener('pushNotificationActionPerformed', (action)=>{
      try{
        const data = (action && action.notification && action.notification.data) || {};
        if(!data.site_id) return;
        const routes = { material_request:'materials', variation:'variations', snag_closed:'snagging/list', message:'messages' };
        const dest = routes[data.kind] || 'messages';
        go(`#/site/${data.site_id}/${dest}`);
      }catch(e){ console.error('Push notification routing failed', e); }
    });
    await PN.register();
  }catch(e){ console.error('Push notification setup failed', e); }
}

/* ================= OneDrive OAuth deep-link handoff (native app only) =================
   The OneDrive "Connected"/"Connection failed" page (served from Supabase, in
   the system browser Browser.open() opened) redirects to ophub://onedrive-callback
   once it's done — iOS/Android route that straight back into this app and
   auto-dismiss the system browser, so nobody has to tap "Close Window"
   themselves. This just needs to catch that hand-off and refresh the screen. */
function registerOneDriveDeepLinkHandler(){
  if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
  const AppPlugin = window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(!AppPlugin) return;
  AppPlugin.addListener('appUrlOpen', async (data)=>{
    try{
      const openedUrl = new URL(data.url);
      if(openedUrl.protocol !== 'ophub:' || openedUrl.hostname !== 'onedrive-callback') return;
      if(window.Capacitor.Plugins.Browser){ try{ await window.Capacitor.Plugins.Browser.close(); }catch(e){} }
      const status = openedUrl.searchParams.get('status');
      toast(status==='success' ? 'OneDrive connected' : 'OneDrive connection failed — try again.');
      go('#/team');
    }catch(e){ console.error('OneDrive deep link handling failed', e); }
  });
}

function readableTextColor(hex){
  // Picks black or white text depending on how light the given colour is,
  // so a company that sets a near-white primary colour still gets legible
  // header text instead of white-on-white.
  if(!hex) return '#fff';
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if(!m) return '#fff';
  const r = parseInt(m[1],16), g = parseInt(m[2],16), b = parseInt(m[3],16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.72 ? '#101114' : '#fff';
}
function applyTheme(org){
  const root = document.documentElement.style;
  const brand1 = (org && org.color_primary) || DEFAULT_BRAND1;
  root.setProperty('--brand1', brand1);
  root.setProperty('--brand2', (org && org.color_secondary) || DEFAULT_BRAND2);
  // Header text colour: uses the company's chosen colour if they've set one,
  // otherwise falls back to auto black/white based on how light the primary
  // theme colour is (readableTextColor).
  root.setProperty('--brand1-text', (org && org.header_text_color) || readableTextColor(brand1));
}

  if(kind==='today_date') return todayISODate();
  if(kind==='inspector_name') return ME.name || '';

// Conditional logic: a question with showIf={qId, mode, values} only counts
// as "on the form" when the referenced earlier question's current answer
// satisfies the condition. Two modes:
//  - 'notblank' — trigger question just needs *any* answer at all (works for
//    every question type, including free text/number/photo — e.g. "if they
//    wrote anything in the notes field, ask a follow-up").
//  - 'equals' (default, for backwards compatibility with templates saved
//    before 'notblank' existed) — trigger question's answer must be one of
//    the listed values; mirrors SafetyCulture's "If answer is X then ask
//    questions" branching. Only offered for fixed-option question types
//    (Pass/Fail/N-A, choice, Yes/No). Checkbox answers are booleans in state
//    but compared as 'Yes'/'No' here since that's how their options are
//    offered.
function isAnswered(val){
  if(val===undefined || val===null) return false;
  if(typeof val==='string') return val.trim()!=='';
  if(Array.isArray(val)) return val.length>0;
  return true; // booleans (checkbox once tapped) and numbers always count as answered
}
function itemVisible(it, answers){
  if(!it.showIf || !it.showIf.qId) return true;
  const raw = answers ? answers[it.showIf.qId] : undefined;
  if(it.showIf.mode==='notblank') return isAnswered(raw);
  const val = typeof raw === 'boolean' ? (raw ? 'Yes' : 'No') : raw;
  return (it.showIf.values||[]).includes(val);
}
// Mirrors SafetyCulture-style scoring: a "Count towards score" question adds
// to a running earned/possible tally. Pass-fail: Pass=1pt, Fail=0pt, N/A is
// excluded from the denominator entirely. Checkbox: Yes=1pt, No=0pt (always
// counted, since a checkbox has no true "not applicable" state). Unanswered
// scored questions count as 0 earned but still add to the denominator, same
// as SafetyCulture showing a red bar and reducing the section's score.
// Questions hidden by conditional logic (their trigger condition isn't met)
// are skipped entirely — they were never asked, so they shouldn't count.
function scoreSections(sections, answers){
  const bySection = {};
  let overallEarned = 0, overallPossible = 0;
  (sections||[]).forEach(s=>{
    let earned = 0, possible = 0;
    (s.items||[]).forEach(it=>{
      if(!it.scored) return;
      if(!itemVisible(it, answers)) return;
      const val = answers ? answers[it.id] : undefined;
      if(it.type==='passfail'){
        if(val==='N/A') return; // excluded entirely
        possible += 1;
        if(val==='Pass') earned += 1;
      } else if(it.type==='checkbox'){
        possible += 1;
        if(val) earned += 1;
      }
    });
    if(possible>0){ bySection[s.id] = {earned, possible}; overallEarned += earned; overallPossible += possible; }
  });
  return {overall:{earned:overallEarned, possible:overallPossible}, bySection};
}
function scoreLabel(sc){
  if(!sc || sc.possible===0) return '';
  const pct = Math.round((sc.earned/sc.possible)*100);
  return `${sc.earned} / ${sc.possible} (${pct}%)`;
}
// Optional photo attachment on any answer (not just dedicated Photo
// questions) — every question offers this by default now, except ones that
// wouldn't make sense (photo/signature/instruction questions, and fields
// that auto-fill themselves like site address/date/inspector name). An
// admin can still switch it off per-question in the template builder.
function itemAllowsMedia(it){
  if(!it) return false;
  if(it.type==='photo' || it.type==='signature' || it.type==='instruction') return false;
  if(it.autofill) return false;
  if(it.allowMedia===false) return false;
  return true;
}
// The set of discrete values a question's own answer can take, used to build
// the "require the photo when the answer is…" picker. null means the answer
// is free-form (text/number/date), so there's nothing to branch on there.
function itemOwnValueOptions(it){
  if(it.type==='passfail') return ['Pass','Fail','N/A'];
  if(it.type==='checkbox') return [true,false];
  if(it.type==='choice' || it.type==='multichoice') return it.options||[];
  return null;
}
// Whether the attached photo is mandatory given the question's CURRENT
// answer — mediaRequiredWhen is a list of trigger values, or ['__always__']
// for free-form questions where "require it whenever answered" is the only
// option. A multichoice answer (an array) counts as a match if ANY ticked
// option is in the trigger list.
function mediaRequiredFor(it, answers){
  if(!itemAllowsMedia(it) || !it.mediaRequiredWhen || !it.mediaRequiredWhen.length) return false;
  if(it.mediaRequiredWhen.includes('__always__')) return true;
  const val = answers ? answers[it.id] : undefined;
  if(Array.isArray(val)) return val.some(v=>it.mediaRequiredWhen.includes(v));
  return it.mediaRequiredWhen.includes(val);
}

/* ================= routing ================= */
// SELF_NAV guards against a WebView quirk (seen on this Android build) where
// simply assigning location.hash — our own go() calls, i.e. every ordinary
// button/link tap that navigates anywhere — ALSO fires 'popstate', not just
// real back/forward traversal like the spec says it should. Without this
// guard, the popstate safety net below would misread that as a real
// back-navigation and immediately redirect to CURRENT_BACK_HASH, which is
// why tapping anything while inside a site was bouncing straight back out.
// Cleared on 'hashchange' (fires right after popstate for the same
// navigation) with a short timeout fallback for the case where go() is
// called with the hash unchanged, which never fires hashchange at all.
let SELF_NAV = false;
function go(hash){ SELF_NAV = true; setTimeout(function(){ SELF_NAV = false; }, 300); location.hash = hash; }
window.addEventListener('hashchange', function(){ SELF_NAV = false; render(); });
// Edge-swipe-to-go-back (left edge, swiping left→right), like the native iOS
// gesture. This deliberately goes up one folder level (whatever the current
// screen's own '‹' back arrow points to — CURRENT_BACK_HASH, kept in sync by
// shell()) rather than replaying raw browser history: history includes every
// hop taken to get here, so a plain history.back() could land somewhere
// sideways instead of "out" one level (e.g. RAMS → Health & Safety → site
// home → sites list), which is what this gesture is meant to feel like.
(function(){
  let startX = 0, startY = 0, tracking = false;
  const EDGE_PX = 24, SWIPE_PX = 80, MAX_VERTICAL = 60;
  document.addEventListener('touchstart', function(e){
    if(!e.touches || e.touches.length !== 1){ tracking = false; return; }
    const t = e.touches[0];
    tracking = t.clientX <= EDGE_PX;
    if(tracking){ startX = t.clientX; startY = t.clientY; }
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(dx > SWIPE_PX && Math.abs(dy) < MAX_VERTICAL && CURRENT_BACK_HASH) go(CURRENT_BACK_HASH);
  }, {passive:true});
})();
// Safety net for platforms where "swipe back" isn't caught by the manual
// touch handler above and instead triggers a REAL browser/WebView back
// navigation — Android's hardware/gesture back button (Capacitor's default
// Android bridge falls back to WebView.goBack() when nothing else handles
// it) or a native edge-swipe in a plain browser tab. That kind of back
// replays raw hash history, same problem the comment above describes.
// 'popstate' is supposed to only fire for a real history traversal, never
// for our own go()/location.hash= pushes — but see the SELF_NAV comment
// above for why that's not reliably true on every WebView, hence the guard.
// It fires before 'hashchange' for the same navigation, so CURRENT_BACK_HASH
// here still holds the screen we were just on — redirecting it here
// overrides wherever raw history landed us.
window.addEventListener('popstate', function(){
  if(SELF_NAV) return;
  if(CURRENT_BACK_HASH) go(CURRENT_BACK_HASH);
});
// Custom confirmation dialog, replacing the native window.confirm(). On this
// build's Android WebView, window.confirm() was returning immediately
// without ever showing anything — so every "Are you sure?" prompt (delete
// site, assign PM, etc.) silently cancelled itself and looked like the
// button just didn't work / got stuck. This reuses the same persistent-
// overlay pattern as the GPS options modal (openGeoOptions) below, which is
// known to render reliably, instead of relying on a native browser dialog.
// Usage: if(!await customConfirm('Are you sure?')) return;
let _confirmResolve = null;
function customConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    _confirmResolve = resolve;
    let ov = document.getElementById('confirmModalOverlay');
    if(!ov){
      ov = document.createElement('div');
      ov.id = 'confirmModalOverlay';
      ov.className = 'geo-modal-overlay';
      document.body.appendChild(ov);
    }
    ov.onclick = (e)=>{ if(e.target===ov) window._confirmAnswer(false); };
    ov.innerHTML = `
      <div class="geo-modal-card">
        <p class="stub" style="margin:0 0 18px;font-weight:600;color:var(--ink);">${escapeHtml(message)}</p>
        <button class="darkbtn" style="width:100%;margin-bottom:8px;${opts.danger?'background:var(--warn);':''}" onclick="window._confirmAnswer(true)">${escapeHtml(opts.confirmLabel||'Yes, continue')}</button>
        <button class="geo-modal-cancel" onclick="window._confirmAnswer(false)">${escapeHtml(opts.cancelLabel||'Cancel')}</button>
      </div>`;
    ov.style.display = 'flex';
  });
}
window._confirmAnswer = function(result){
  const ov = document.getElementById('confirmModalOverlay');
  if(ov) ov.style.display = 'none';
  const resolve = _confirmResolve;
  _confirmResolve = null;
  if(resolve) resolve(result);
};
function parseRoute(){

}
function routeQuery(){
  const q = location.hash.split('?')[1];
  return new URLSearchParams(q||'');
}

window.maybeAutoSignIn = function(ev){
  // Only Enter submits — a bare "fields look filled" trigger caused false
  // sign-ins whenever the browser's saved-password autofill populated the
  // form (e.g. switching accounts on a shared device), signing people in as
  // whoever was saved before they could change the email. Explicit Sign In
  // click or Enter key only, from here on.
  if(ev && ev.key === 'Enter'){ doSignIn(); }
};
// "Remember me" on the sign-in page — stored in localStorage, on-device
// only, and never sent anywhere except back into these two fields. Opt-in
// via the checkbox; unticking it (or a fresh sign-in without it checked)
// clears whatever was saved.
function rememberedAuth(){
  try{
    const raw = localStorage.getItem('ophub_remember');
    if(!raw) return {email:'', password:'', remember:false};
    const parsed = JSON.parse(raw);
    return {email: parsed.email||'', password: parsed.password||'', remember:true};
  }catch(e){ return {email:'', password:'', remember:false}; }
}
window.doSignIn = async function(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const remember = document.getElementById('authRemember') && document.getElementById('authRemember').checked;
  if(!email || !password){ authError='Enter your email and password.'; render(); return; }
  try{
    if(remember) localStorage.setItem('ophub_remember', JSON.stringify({email, password}));
    else localStorage.removeItem('ophub_remember');
  }catch(e){}
  authBusy = true; authError = null; render();
  const r = await signIn(email, password);
  authBusy = false;
  if(r.error){ authError = r.error; render(); return; }
  await loadProfile();
  if(!ME || (!ME.org_id && ME.role!=='superadmin')){
    authError = 'Your account isn\'t linked to a company yet. Contact your Project Manager for an invite.';
    await doSignOut();
    return;
  }
  if(ME.role==='superadmin'){ go('#/'); return; }
  if(ME.role==='operative'){
    const lock = await checkDeviceLock();
    if(!lock.ok){
      authError = lock.error==='device_locked'
        ? `This phone is already signed in to OpHUB as ${lock.locked_to_name || 'another team member'}. Each phone can only be used by one person — ask your admin to unlock it in Admin Centre if this is wrong.`
        : 'Could not verify this device — check your connection and try again.';
      await doSignOut();
      return;
    }
  }
  await loadOrg();
  await loadAllProfiles();
  SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  registerPushNotifications();
  go('#/sites');
};

let adminResetResult = null; // {email, new_password}
let adminExpandedOrg = null; // org id currently expanded to show its members
let newCompanyInvite = null; // {org_name, invite_link} after creating a company
let newCompanyBusy = false;
async function renderAdmin(){
  const app = document.getElementById('app');
  const [orgs, subs, allProfiles] = await Promise.all([
    dbSelect('organizations', 'select=*&order=created_at.desc'),
    dbSelect('subscriptions', 'select=*'),
    dbSelect('profiles', 'select=*&order=name.asc'),
  ]);
  const subByOrg = {}; subs.forEach(s=>{ subByOrg[s.org_id] = s; });
  const peopleByOrg = {};
  allProfiles.forEach(p=>{ if(!p.org_id) return; (peopleByOrg[p.org_id] = peopleByOrg[p.org_id]||[]).push(p); });

  app.innerHTML = shell(`
    <p class="sectiontitle">My Account</p>
    <div class="card">
      <div class="sitecard" style="margin:0;">
        <div class="info"><div class="name">${escapeHtml(ME.name)}${' (you)'}</div><div class="addr">${escapeHtml(ME.email)} · Super Admin</div></div>
        <button class="ghostbtn" style="width:auto;padding:8px 12px;" ${adminResetBusy===ME.email?'disabled':''} onclick="resetUserPassword('${escapeHtml(ME.email)}')">${adminResetBusy===ME.email?'…':'Reset My Password'}</button>
      </div>
    </div>
    ${adminResetResult ? `
      <div class="card" style="border-color:var(--ok);">
        <p class="stub" style="margin:0 0 6px;color:var(--ok);">New password for <b>${escapeHtml(adminResetResult.email)}</b> — share this with them securely, they should change it after signing in:</p>
        <input type="text" readonly value="${escapeHtml(adminResetResult.new_password)}" style="font-size:14px;font-weight:800;margin-bottom:8px;" onclick="this.select()">
        <button class="ghostbtn" onclick="adminResetResult=null;render()">Dismiss</button>
      </div>
    ` : ''}
    <p class="sectiontitle" style="margin-top:18px;">Invite a Company</p>
    <div class="card">
      ${newCompanyInvite ? `
        <p class="stub" style="margin:0 0 8px;color:var(--ok);">Company "<b>${escapeHtml(newCompanyInvite.org_name)}</b>" created — share this link with whoever should become their admin. It works once, for the next 14 days:</p>
        <input type="text" readonly value="${escapeHtml(newCompanyInvite.invite_link)}" style="font-size:11.5px;margin-bottom:8px;" onclick="this.select()">
        <div style="display:flex;gap:8px;">
          <button class="ghostbtn" style="width:auto;" onclick="copyNewCompanyInvite()">Copy Link</button>
          <button class="ghostbtn" style="width:auto;" onclick="newCompanyInvite=null;render()">Invite Another</button>
        </div>
      ` : `
        <div class="formfield"><input type="text" id="newCompanyName" placeholder="Company name"></div>
        <div class="formfield"><input type="email" id="newCompanyEmail" placeholder="Their email (optional)"></div>
        <button class="darkbtn" ${newCompanyBusy?'disabled':''} onclick="createCompanyInvite()">${newCompanyBusy?'Creating…':'Create Company & Invite'}</button>
        <p class="stub" style="margin:8px 0 0;">Sets up a new company outside of Stripe checkout and gives you a founding-admin invite link to send them directly.</p>
      `}
    </div>
    <p class="sectiontitle" style="margin-top:18px;">All Companies (${orgs.length})</p>
    ${orgs.map(o=>{
      const sub = subByOrg[o.id];
      const people = (peopleByOrg[o.id]||[]).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      const ROLES = ['operative','pm','admin'];
      const expanded = adminExpandedOrg === o.id;
      return `
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="toggleAdminOrg('${o.id}')">
          <img src="${orgLogoUrl(o)}" onerror="this.onerror=null;this.src='${OPHUB_LOGO_INLINE}'" style="width:36px;height:36px;border-radius:8px;object-fit:cover;">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:800;font-size:14.5px;">${escapeHtml(o.name)}</div>
            <div class="stub" style="margin:0;">${escapeHtml(PLAN_LABEL[o.plan_tier] || o.plan_tier)} · ${sub ? `${escapeHtml(sub.status)}` : 'no Stripe subscription'} · ${people.length} member${people.length===1?'':'s'}</div>
          </div>
          <span class="stub" style="margin:0;font-size:16px;">${expanded?'▲':'▼'}</span>
        </div>
        ${expanded ? `
          <div style="margin-top:10px;">
            <div class="formfield" style="margin-top:0;" onclick="event.stopPropagation();">
              <label class="field-label">Package</label>
              <select onchange="setOrgPlanTier('${o.id}', this.value)" onclick="event.stopPropagation();">
                <option value="starter" ${o.plan_tier==='starter'?'selected':''}>OpHUB Basic — no GPS check-in/geofencing</option>
                <option value="growth" ${o.plan_tier==='growth'?'selected':''}>OpHUB Pro — GPS check-in & geofencing</option>
                <option value="enterprise" ${o.plan_tier==='enterprise'?'selected':''}>OpHUB Enterprise — everything, priority support</option>
              </select>
            </div>
            <button class="ghostbtn" style="width:auto;padding:6px 10px;color:var(--warn);margin:10px 0 8px;" onclick="event.stopPropagation();deleteCompany('${o.id}','${escapeHtml(o.name)}')">Delete Company</button>
            ${people.map(p=>`
              <div class="sitecard" style="padding:8px 10px;flex-wrap:wrap;">
                <div class="info"><div class="name">${escapeHtml(p.name)}</div><div class="addr">${escapeHtml(p.email)} · ${roleLabel(p.role)}</div></div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${ROLES.filter(r=>r!==p.role).map(r=>`<button class="ghostbtn" style="width:132px;padding:6px 8px;font-size:10px;font-weight:400;text-transform:none;" onclick="setUserRole('${p.id}','${r}')">Make ${roleLabel(r)}</button>`).join('')}
                  <button class="ghostbtn" style="width:132px;padding:6px 8px;font-size:10px;font-weight:400;text-transform:none;" ${adminResetBusy===p.email?'disabled':''} onclick="resetUserPassword('${escapeHtml(p.email)}')">${adminResetBusy===p.email?'…':'Reset Password'}</button>
                  <button class="ghostbtn" style="width:132px;padding:6px 8px;font-size:10px;font-weight:800;text-transform:none;color:var(--warn);" onclick="deleteUserPlatform('${p.id}','${jsAttr(p.name)}')">Delete User</button>
                </div>
              </div>
            `).join('') || `<div class="empty" style="padding:10px;">No members yet.</div>`}
          </div>
        ` : ''}
      </div>
    `;}).join('') || `<div class="empty">No companies registered yet.</div>`}
    <p style="text-align:center;margin-top:8px;">
      <span class="stub" style="cursor:pointer;text-decoration:underline;" onclick="doSignOut()">Sign out</span>
    </p>
  `, {title:'Platform Admin', subtitle:'OpHUB · all companies', tabs:false});
}
window.setOrgPlanTier = async function(orgId, tier){
  const row = await dbUpdate('organizations', orgId, {plan_tier: tier});
  if(row){ toast('Package updated — '+(PLAN_LABEL[tier]||tier)); render(); }
};
window.createCompanyInvite = async function(){
  const company_name = document.getElementById('newCompanyName').value.trim();
  const email = document.getElementById('newCompanyEmail').value.trim();
  if(!company_name){ toast('Enter a company name.'); return; }
  newCompanyBusy = true; render();
  try{
    const res = await sbFetch('/functions/v1/admin-create-company', {method:'POST', body: JSON.stringify({company_name, email: email||undefined})});
    const d = await res.json();
    newCompanyBusy = false;
    if(!res.ok || d.error){ toast('Could not create company — '+(d.error||res.status)); render(); return; }
    newCompanyInvite = {org_name: company_name, invite_link: location.origin + location.pathname + '#/join/' + d.invite_id};
    toast('Company created');
    render();
  }catch(e){ newCompanyBusy=false; toast('Could not reach the server.'); render(); }
};
window.copyNewCompanyInvite = async function(){
  if(!newCompanyInvite) return;
  try{ await navigator.clipboard.writeText(newCompanyInvite.invite_link); toast('Link copied'); }
  catch(e){ toast('Could not copy — select and copy the link manually.'); }
};
window.toggleAdminOrg = function(orgId){
  adminExpandedOrg = adminExpandedOrg === orgId ? null : orgId;
  render();
};
window.setUserRole = async function(userId, role){
  if(!await customConfirm(`Change this person's role to ${roleLabel(role)}?`)) return;
  const row = await dbUpdate('profiles', userId, {role});
  if(row){ toast(`Role changed to ${roleLabel(role)}`); render(); }
};
window.resetUserPassword = async function(email){
  const custom = prompt(`Set a new password for ${email}.\n\nType a password (min 8 characters), or leave this blank and press OK for a random one to be generated instead.`);
  if(custom === null) return; // cancelled
  const newPassword = custom.trim();
  if(newPassword && newPassword.length < 8){ toast('Password must be at least 8 characters.'); return; }
  adminResetBusy = email; adminResetResult = null; render();
  try{
    const res = await sbFetch('/functions/v1/admin-reset-password', {method:'POST', body: JSON.stringify({target_email: email, new_password: newPassword || undefined})});
    const d = await res.json();
    adminResetBusy = null;
    if(!res.ok || d.error){ toast('Reset failed — '+(d.error||res.status)); render(); return; }
    adminResetResult = {email: d.email, new_password: d.new_password};
    render();
  }catch(e){
    adminResetBusy = null;
    toast('Reset failed — could not reach the server.');
    render();
  }
};
window.deleteUserPlatform = async function(userId, name){
  if(userId===ME.id){ toast("You can't delete your own account this way."); return; }
  if(!await customConfirm(`Permanently delete ${name||'this user'}? This removes their login completely — they will not be able to sign in again. This cannot be undone.`)) return;
  try{
    const res = await sbFetch('/functions/v1/admin-delete-user', {method:'POST', body: JSON.stringify({user_id: userId})});
    const d = await res.json();
    if(!res.ok || d.error){ toast('Delete failed — '+(d.error||res.status)); return; }
    toast(`${d.deleted||name||'User'} deleted`);
    render();
  }catch(e){
    toast('Delete failed — could not reach the server.');
  }
};
window.deleteCompany = async function(orgId, name){
  if(!await customConfirm(`Permanently delete "${name}"? This removes the company, all its sites, and all its team members' access. This cannot be undone.`)) return;
  if(prompt(`Type the company name to confirm deleting "${name}":`) !== name) { toast("Names didn't match — nothing deleted."); return; }
  try{
    const res = await sbFetch('/functions/v1/admin-delete-company', {method:'POST', body: JSON.stringify({org_id: orgId})});
    const d = await res.json();
    if(!res.ok || d.error){ toast('Delete failed — '+(d.error||res.status)); return; }
    toast(`Deleted ${d.deleted}`);
    render();
  }catch(e){
    toast('Delete failed — could not reach the server.');
  }
};

/* ================= SITES LIST ================= */
// Everything (org theme/package, team, sites, responsible PMs, etc.) is
// loaded once at sign-in and only patched locally when an action on this
// device changes it — so a change made by someone else in Admin Centre
// doesn't show up here until this device re-fetches it. This gives
// operatives/PMs a manual "pull the latest" button rather than waiting on
// their next full sign-in.
let refreshingAppData = false;
window.refreshAppData = async function(){
  if(refreshingAppData) return;
  addSiteFormOpen = false; // close the collapsed add-site form back up on refresh
  refreshingAppData = true; render();
  await loadProfile();
  if(ME){
    await loadOrg();
    await loadAllProfiles();
    SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  }
  refreshingAppData = false;
  toast('Up to date');
  render();
};
function fullSiteAddress(s){
  return [s.address, s.postcode].map(v=>(v||'').trim()).filter(Boolean).join(', ') || null;
}
const SITE_STATUS_LABEL = {live:'Active', upcoming:'Upcoming', closed:'Closed'};
function siteCardHtml(s, canAdd, pmOptions){
  const statusKey = s.status==='active' ? 'live' : (SITE_STATUS_LABEL[s.status] ? s.status : 'upcoming');
  const pmLocked = !!s.responsible_pm_id;
  const canChangePm = ME.role==='admin' || ME.role==='superadmin';
  const canSetPm = canAdd && (!pmLocked || canChangePm);
  const pmInitials = pmLocked ? (nameOf(s.responsible_pm_id)||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase() : '–';
  return `
    <div class="sitecard" onclick="go('#/site/${s.id}/home')">
      <div class="swatch">${escapeHtml(s.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase())}</div>
      <div class="info">
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="addr">${escapeHtml(fullSiteAddress(s)||'—')}</div>
      </div>
      ${canAdd ? `
        <span class="rolechip" title="${pmLocked?'Responsible PM: '+escapeHtml(nameOf(s.responsible_pm_id))+(canChangePm?' — tap to change':''):'No project manager assigned yet — tap to choose (locks once set)'}"
          style="margin-left:4px;${pmLocked?'background:var(--brand1);color:#fff;':'background:var(--line);color:var(--slate);'}${canSetPm?'cursor:pointer;':''}"
          onclick="event.stopPropagation();${canSetPm?`openPmPicker('${s.id}')`:''}">${pmInitials}</span>
      ` : (pmLocked ? `<span class="rolechip" style="margin-left:4px;background:var(--brand1);color:#fff;" title="Responsible PM: ${escapeHtml(nameOf(s.responsible_pm_id))}">${pmInitials}</span>` : '')}
      <span class="status ${statusKey}" ${canAdd?`style="cursor:pointer;" onclick="event.stopPropagation();toggleSiteStatusMenu('${s.id}')"`:''}>${SITE_STATUS_LABEL[statusKey]}${canAdd?' ▾':''}</span>
      ${canAdd && siteStatusMenuOpenId===s.id ? `
        <div class="statusmenu" onclick="event.stopPropagation()">
          ${statusKey!=='live' ? `<div class="statusmenu-item" onclick="setSiteStatus('${s.id}','live')">Set Active</div>` : ''}
          ${statusKey!=='upcoming' ? `<div class="statusmenu-item" onclick="setSiteStatus('${s.id}','upcoming')">Set Upcoming</div>` : ''}
          ${statusKey!=='closed' ? `<div class="statusmenu-item" onclick="setSiteStatus('${s.id}','closed')">Close</div>` : ''}
          <div class="statusmenu-item danger" onclick="deleteSite('${s.id}','${jsAttr(s.name)}')">Delete permanently</div>
        </div>
      ` : ''}
      ${canSetPm && sitePmPickerOpenId===s.id ? `
        <div class="statusmenu" onclick="event.stopPropagation()">
          ${pmOptions.length ? pmOptions.map(p=>`<div class="statusmenu-item" onclick="confirmSetResponsiblePm('${s.id}','${p.id}','${jsAttr(p.name)}')">${escapeHtml(p.name)}${p.role==='admin'?' (Admin)':''}</div>`).join('') : `<div class="statusmenu-item" style="cursor:default;color:var(--slate);">No project managers yet</div>`}
        </div>
      ` : ''}
    </div>
  `;
}
let siteFilterPmIds = []; // multi-select — empty = all PMs
let pmFilterOpen = false;
let addSiteFormOpen = false;
let siteStatusMenuOpenId = null;
let sitePmPickerOpenId = null;
let siteSectionOpen = {live:true, upcoming:true, closed:true};

  sitePmPickerOpenId = null;

};
window.openPmPicker = function(siteId){

window.confirmSetResponsiblePm = async function(siteId, pmId, pmName){
  sitePmPickerOpenId = null;
  if(!await customConfirm(`Set ${pmName} as the responsible project manager for this site? A project manager can only be selected once — are you sure?`)){ render(); return; }
  await setResponsiblePM(siteId, pmId);

window.setSiteStatus = async function(siteId, status){
  siteStatusMenuOpenId = null;
  const row = await dbUpdate('sites', siteId, {status});
  if(row){
    const idx = SITES.findIndex(s=>s.id===siteId);
    if(idx>-1) SITES[idx] = row;
    toast('Status updated');
  }
  render();
};
window.toggleSiteSection = function(key){ siteSectionOpen[key] = !siteSectionOpen[key]; render(); };
async function renderSites(){
  const app = document.getElementById('app');
  const canAdd = isManager(ME);
  await loadAllProfiles(); // so nameOf() can resolve each site's responsible_pm_id for the initials badge
  const pmOptions = Object.values(PROFILES).filter(p=>p.role==='pm'||p.role==='admin').sort((a,b)=>a.name.localeCompare(b.name));
  const filtered = (canAdd && siteFilterPmIds.length) ? SITES.filter(s=>siteFilterPmIds.includes(s.responsible_pm_id)) : SITES;
  const statusOf = s => s.status==='active' ? 'live' : (SITE_STATUS_LABEL[s.status] ? s.status : 'upcoming');
  const liveSites = filtered.filter(s=>statusOf(s)==='live');
  const upcomingSites = filtered.filter(s=>statusOf(s)==='upcoming');
  const closedSites = filtered.filter(s=>statusOf(s)==='closed');
  const siteSection = (key, label, list, isFirst) => canAdd ? `
      <div class="ddrow" style="margin-top:${isFirst?'0':'18px'};" onclick="toggleSiteSection('${key}')">
        <span class="arrow">${siteSectionOpen[key]?'▼':'▶'}</span> ${label} (${list.length})
      </div>
      ${siteSectionOpen[key] ? `<div style="margin-top:10px;">${list.map(s=>siteCardHtml(s,canAdd,pmOptions)).join('') || `<div class="empty">No ${label.toLowerCase()}.</div>`}</div>` : ''}
    ` : '';
  app.innerHTML = shell(`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <p class="sectiontitle" style="margin:4px 0 10px;">Your Sites</p>
      ${canAdd && pmOptions.length ? `
        <div style="position:relative;margin-top:-9px;">
          <button type="button" onclick="togglePmFilterOpen()" title="Filter by project manager" style="width:auto;flex:none;min-width:96px;padding:4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;border:1px solid var(--line);background:${siteFilterPmIds.length?'var(--brand1)':'#fff'};color:${siteFilterPmIds.length?'#fff':'var(--slate)'};cursor:pointer;">
            ${siteFilterPmIds.length ? (siteFilterPmIds.length===1 ? escapeHtml((nameOf(siteFilterPmIds[0])||'1 selected')) : siteFilterPmIds.length+' selected') : 'Select PM'} ${pmFilterOpen?'▲':'▼'}
          </button>
          ${pmFilterOpen ? `
            <div style="position:absolute;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px;min-width:170px;">
              ${pmOptions.map(p=>`
                <label style="display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:normal;color:var(--ink);cursor:pointer;">
                  <input type="checkbox" ${siteFilterPmIds.includes(p.id)?'checked':''} onchange="togglePmFilterId('${p.id}')">
                  ${escapeHtml(p.name)}
                </label>
              `).join('')}
              ${siteFilterPmIds.length ? `<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px;text-align:center;"><span style="font-size:11.5px;color:var(--brand1);cursor:pointer;text-decoration:underline;" onclick="setSiteFilterPm([])">Clear</span></div>` : ''}
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>
    ${canAdd ? `
      ${siteSection('live','Live Jobs',liveSites,true)}
      ${siteSection('upcoming','Upcoming Jobs',upcomingSites)}
      ${siteSection('closed','Closed Jobs',closedSites)}
    ` : `
      ${filtered.filter(s=>statusOf(s)!=='closed').map(s=>siteCardHtml(s,canAdd,pmOptions)).join('') || `<div class="empty">No active sites.</div>`}
    `}
    ${canAdd ? `
      <div class="card" style="margin-top:6px;background:var(--paper);">
        <p class="sectiontitle" style="margin-top:0;">Add a site</p>
        ${addSiteFormOpen ? `
          <div class="formfield"><input type="text" id="newSiteName" placeholder="Site name"></div>
          <div class="formfield"><input type="text" id="newSiteAddr" placeholder="Address"></div>
          <div class="formfield"><input type="text" id="newSitePostcode" placeholder="Postcode"></div>
        ` : ''}
        <button class="darkbtn" onclick="${addSiteFormOpen ? 'addSite()' : 'toggleAddSiteForm()'}">Create Site</button>
      </div>
      <button class="ghostbtn" onclick="go('#/team')">Admin Centre</button>
    ` : ''}
    <p style="text-align:center;margin-top:8px;">
      <span class="stub">${escapeHtml(ME.name)} · ${escapeHtml(ME.email)}</span><br>
      <span class="stub" style="cursor:pointer;text-decoration:underline;" onclick="go('#/signature')">${ME.signature_path?'My signature':'Adopt your signature'}</span><br>
      <span class="stub" style="cursor:pointer;text-decoration:underline;" onclick="doSignOut()">Sign out</span>
    </p>
  `, {tabs:false, centerHeader:true, showRefresh:true});
}
window.setSiteFilterPm = function(pmIds){ siteFilterPmIds = pmIds || []; render(); };
window.togglePmFilterOpen = function(){ pmFilterOpen = !pmFilterOpen; render(); };
window.togglePmFilterId = function(id){
  siteFilterPmIds = siteFilterPmIds.includes(id) ? siteFilterPmIds.filter(x=>x!==id) : [...siteFilterPmIds, id];
  render();
};
window.toggleAddSiteForm = function(){ addSiteFormOpen = !addSiteFormOpen; render(); };
window.addSite = async function(){
  const name = document.getElementById('newSiteName').value.trim();
  const addr = document.getElementById('newSiteAddr').value.trim();
  const postcode = document.getElementById('newSitePostcode').value.trim();
  if(!name){ toast('Enter a site name.'); return; }
  // Deliberately not asking PostgREST for the row back here (no
  // Prefer: return=representation) — Postgres has a known quirk where a
  // table's own SELECT policy, if it re-queries that same table (as sites'
  // does via has_site_access()), can't reliably see a row that's still
  // mid-insert within the same statement, which makes any "insert and
  // return the new row" call get rejected even though the insert itself
  // is fully allowed. Inserting plain, then re-fetching the list, sidesteps
  // it without weakening the security policy.
  const res = await sbFetch('/rest/v1/sites', {method:'POST', body: JSON.stringify({name, address:addr||null, postcode:postcode||null, status:'upcoming', created_by:ME.id, org_id:ME.org_id})});
  if(!res.ok){ toast('Save failed — '+(await safeErr(res))); return; }
  SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  const newSite = SITES.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  await preloadTbtBankForSite(newSite);
  addSiteFormOpen = false;
  toast('Site created');
  render();
};
// Pre-loads every company-wide Toolbox Talk template into this new site's
// Bank TBT, so standard talks are already there without a PM re-uploading
// them on every job.
async function preloadTbtBankForSite(site){
  if(!site) return;
  try{
    const templates = await dbSelect('tbt_templates', 'org_id=eq.'+ME.org_id);
    if(!templates.length) return;
    const rows = templates.map(t=>({site_id:site.id, org_id:ME.org_id, title:t.title, storage_path:t.storage_path, status:'bank', created_by:ME.id}));
    await dbInsert('toolbox_talks', rows);
  }catch(e){ console.error('Could not preload TBT bank for new site', e); }
}
window.deleteSite = async function(siteId, name){
  if(!await customConfirm(`Delete "${name}"? This permanently removes the site along with its schedule, RAMS, snags, materials, variations and check-in history. This can't be undone.`)) return;
  siteStatusMenuOpenId = null;
  const ok = await dbDelete('sites', siteId);
  if(ok){
    SITES = SITES.filter(s=>s.id!==siteId);
    toast('Site deleted');
  } else {
    toast('Could not delete — try again.');
  }
  // Deleting always happens from the sites list itself, so go('#/sites') was
  // a same-hash no-op — no hashchange event fires for that, and render() is
  // only ever wired up as a hashchange listener, so the screen never
  // reflected the deletion (or the closed dropdown) even though it had
  // already succeeded. Call render() directly instead of relying on go().
  render();
};

      </div>
    </div>
  `, {title:'My Signature', subtitle:ME.name, back:'#/sites', tabs:false});
  attachSignatureCanvas();

let sigCtx = null;
function attachSignatureCanvas(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#101114';
  sigCtx = ctx;
  sigHasDrawn = false;
  let drawing = false, lastX = 0, lastY = 0;
  function posFromEvent(e){
    const r = canvas.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  canvas.onpointerdown = (e)=>{ drawing = true; const p = posFromEvent(e); lastX = p.x; lastY = p.y; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = (e)=>{
    if(!drawing) return;
    const p = posFromEvent(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
    sigHasDrawn = true;
  };
  canvas.onpointerup = ()=>{ drawing = false; };
  canvas.onpointerleave = ()=>{ drawing = false; };
}
window.clearSignaturePad = function(){
  const canvas = document.getElementById('sigCanvas');
  if(canvas && sigCtx){ sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHasDrawn = false; }
};
window.saveSignaturePad = async function(){
  if(!sigHasDrawn){ toast('Draw your signature first.'); return; }
  const canvas = document.getElementById('sigCanvas');
  const dataUrl = canvas.toDataURL('image/png');
  const path = ME.id+'/signature.png';
  const stored = await uploadDataUrl('signatures', path, dataUrl);
  if(!stored) return;
  const row = await dbUpdate('profiles', ME.id, {signature_path: path});
  if(row){
    ME.signature_path = path;
    toast('Signature saved');
    // Plain history.back() would now get caught by the popstate "go up one
    // level" safety net below anyway (see edge-swipe-to-go-back), so just go
    // there directly rather than round-tripping through a real back-nav.
    go(CURRENT_BACK_HASH || '#/sites');
  }
};

window.connectOneDrive = async function(){
  odBusy = true; render();
  try{
    const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    const res = await sbFetch('/functions/v1/onedrive-oauth-start', {method:'POST', body: JSON.stringify({native:isNative, origin: isNative ? null : location.origin})});
    const d = await res.json();
    odBusy = false;
    if(!res.ok || d.error){ toast(d.error || 'Could not start OneDrive connection.'); render(); return; }
    // Microsoft's sign-in screen refuses to load inside an app's embedded
    // webview (a security measure most OAuth providers enforce) — open it in
    // the system browser instead when running as the native app. On the
    // plain website, a normal same-tab redirect works fine. On native, the
    // callback page hands straight back to the app via a custom URL scheme
    // (see the appUrlOpen listener below), so the browser closes itself.
    if(isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser){
      window.Capacitor.Plugins.Browser.open({url: d.url});
    } else {
      location.href = d.url;
    }
  }catch(e){ odBusy=false; toast('Could not reach the server.'); render(); }
};

/* ================= ONEDRIVE FOLDER PICKER (link a site to its real, existing project folder) =================
   A folder can either live in the connected account's own OneDrive (driveId
   null — addressed via /me/drive/...) or in a DIFFERENT drive that's been
   shared with them — another person's OneDrive, or a SharePoint document
   library (driveId set — addressed via /drives/{driveId}/...).

   There are two separate ways a folder can be "not really mine" and they
   need different Graph calls to find:
     - Someone individually shared it with this account → /me/drive/sharedWithMe
       (the "🔗 Shared with me" virtual entry).
     - It's visible because this account is a member of a SharePoint team
       site (e.g. everyone at the company can see the org's shared folder,
       nobody explicitly "shared" it with any one person) → /sites then
       /sites/{id}/drives (the "🏢 Company Sites" virtual entry, which lists
       sites and then that site's document libraries).
   Both virtual entries only exist client-side to get the picker into that
   mode — they're not real Graph items. */
const SHARED_ROOT_ID = '__SHARED__';
const SITES_ROOT_ID = '__SITES__';
let odPickerStack = null; // array of {id, name, driveId, isSite} — first entry is always the OneDrive root
let odPickerFolders = [];
let odPickerError = null;
window.onedriveFolderAction = function(siteId, action){
  if(action==='change') startOneDriveFolderPicker(siteId);
  else if(action==='unlink') unlinkOneDriveFolder(siteId);
};
window.startOneDriveFolderPicker = function(siteId){
  odPickerStack = [{id:null, name:'OneDrive', driveId:null}];
  odPickerFolders = [];
  odPickerError = null;
  go(`#/site/${siteId}/onedrive-folder`);
};
async function loadOdPickerFolders(){
  const current = odPickerStack[odPickerStack.length-1];
  try{
    const body = current.id===SHARED_ROOT_ID
      ? {shared:true}
      : current.id===SITES_ROOT_ID
        ? {companySites:true}
        : current.isSite
          ? {company_site_id: current.id}
          : current.driveId
            ? {parent_id: current.id, drive_id: current.driveId}
            : {parent_id: current.id};
    const res = await sbFetch('/functions/v1/onedrive-list-folders', {method:'POST', body: JSON.stringify(body)});
    const d = await res.json();
    if(!res.ok || d.error){ odPickerError = d.error || 'Could not load OneDrive folders.'; odPickerFolders = []; }
    else {
      odPickerFolders = d.folders || [];
      odPickerError = null;
      // At the true root of the user's own OneDrive, also offer the two
      // ways into folders that aren't in their own drive at all — see the
      // comment above.
      if(current.id===null && !current.driveId){
        odPickerFolders = [
          {id:SHARED_ROOT_ID, name:'🔗 Shared with me', driveId:null, virtual:true},
          {id:SITES_ROOT_ID, name:'🏢 Company Sites', driveId:null, virtual:true},
          ...odPickerFolders,
        ];
      }
    }
  }catch(e){ odPickerError = 'Could not reach OneDrive.'; odPickerFolders = []; }
}
async function renderOneDriveFolderPicker(siteId){
  const site = SITES.find(s=>s.id===siteId);
  if(!odPickerStack) odPickerStack = [{id:null, name:'OneDrive', driveId:null}];
  await loadOdPickerFolders();
  const current = odPickerStack[odPickerStack.length-1];
  const canUseCurrent = current.id && current.id!==SHARED_ROOT_ID && current.id!==SITES_ROOT_ID && !current.isSite;
  const emptyMsg = current.id===SHARED_ROOT_ID ? 'Nothing has been shared with this account yet.'
    : current.id===SITES_ROOT_ID ? 'No SharePoint sites found for this account.'
    : current.isSite ? 'No document libraries in this site.'
    : 'No subfolders here.';
  document.getElementById('app').innerHTML = shell(`
    <p class="stub" style="margin:0 0 10px;">${odPickerStack.map(s=>escapeHtml(s.name)).join(' / ')}</p>
    ${odPickerStack.length>1 ? `<button class="ghostbtn" style="margin-bottom:14px;" onclick="odPickerUp()">‹ Back a folder</button>` : ''}
    ${odPickerError ? `
      <div class="card"><p class="stub" style="color:var(--warn);margin:0;">${escapeHtml(odPickerError)}</p></div>
    ` : `
      ${canUseCurrent ? `<button class="darkbtn" style="margin-bottom:14px;" onclick="selectOneDriveFolder('${siteId}','${current.id}','${jsAttr(current.name)}','${current.driveId||''}')">Use "${escapeHtml(current.name)}" as this site's folder</button>` : `<p class="stub" style="margin:0 0 14px;">Open a folder below, then tap "Use this folder" once you're inside the right one.</p>`}
      ${odPickerFolders.map(f=>`
        <div class="sitecard" onclick="odPickerInto('${f.id}','${jsAttr(f.name)}','${f.driveId||''}',${f.isSite?'true':'false'})">
          <div class="swatch">${f.isSite?'🏢':f.virtual?'🔗':'📁'}</div>
          <div class="info"><div class="name">${escapeHtml(f.name)}</div></div>
        </div>
      `).join('') || `<div class="empty">${emptyMsg}</div>`}

  `, {title:'Choose OneDrive Folder', subtitle:site.name, back:`#/site/${siteId}/team`, siteId, tabs:false});
