window.addTodo = async function(siteId){
  const text = (newTodoDraft||'').trim();
  if(!text){ toast('Enter what needs doing first.'); return; }
  const row = await dbInsert('todos', {site_id:siteId, text, assigned_to: newTodoAssigneeDraft||null, date_required_by: newTodoDateDraft||null, created_by:ME.id});
  if(row){
    const comment = (newTodoCommentDraft||'').trim();
    if(comment) await dbInsert('todo_comments', {todo_id:row.id, body:comment, created_by:ME.id});
    if(newTodoAssigneeDraft){
      const site = SITES.find(s=>s.id===siteId);
      postSystemMessage(siteId, 'todo_assigned', (site?site.name+': ':'')+'New to-do assigned to '+nameOf(newTodoAssigneeDraft)+': '+text);
    }
    newTodoDraft = '';
    newTodoAssigneeDraft = '';
    newTodoDateDraft = '';
    newTodoCommentDraft = '';
    todoAddOpen = false; // collapse the Add To Do dropdown once a to-do has been created
    toast('Added to the to-do list');
    render();
  }
};

// Converts one co-ordinate token to decimal degrees. Accepts plain decimal
// ("51.51828", "-0.15139"), decimal with a hemisphere letter ("0.15139 W"),
// and degrees/minutes/seconds as copied straight out of Google Maps/Google
// Search ("51°31'05.8"N", "0°09'05.0"W", also tolerates straight quotes,
// curly quotes, "deg"/"min"/"sec" words, and missing seconds).
function parseCoordToken(raw){
  if(raw==null) return NaN;
  let str = String(raw).trim();
  if(!str) return NaN;
  str = str.replace(/[’′]/g,"'").replace(/[”″]/g,'"');
  // Plain decimal, optionally with a trailing/leading hemisphere letter.
  let m = str.match(/^([NSEW])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSEW])?$/i);
  if(m){
    let val = parseFloat(m[2]);
    const hem = (m[1]||m[3]||'').toUpperCase();
    if(hem==='S'||hem==='W') val = -Math.abs(val);
    else if(hem==='N'||hem==='E') val = Math.abs(val);
    return val;
  }
  // Degrees° minutes' seconds" [hemisphere]
  m = str.match(/^(-?\d+(?:\.\d+)?)\s*(?:°|deg)\s*(\d+(?:\.\d+)?)?\s*(?:'|min)?\s*(\d+(?:\.\d+)?)?\s*(?:"|sec)?\s*([NSEW])?$/i);
  if(m && (m[2]!=null || m[4]!=null)){
    const deg = parseFloat(m[1]);
    const min = m[2]!=null ? parseFloat(m[2]) : 0;
    const sec = m[3]!=null ? parseFloat(m[3]) : 0;
    let val = Math.abs(deg) + min/60 + sec/3600;
    const hem = (m[4]||'').toUpperCase();
    if(hem==='S'||hem==='W' || deg<0) val = -val;
    return val;
  }
  return NaN;
}
// If someone pastes a full "lat, lon" pair (either decimal or DMS) into a
// single box, split it into the two halves so each can be parsed on its own.
function splitCoordPair(str){
  if(!str) return null;
  const s = String(str).trim();
  // DMS pair: two chunks each ending in a hemisphere letter.
  const dmsMatches = s.match(/-?\d+(?:\.\d+)?\s*(?:°|deg)\s*\d*(?:\.\d+)?\s*(?:'|min)?\s*\d*(?:\.\d+)?\s*(?:"|sec)?\s*[NSEW]/gi);
  if(dmsMatches && dmsMatches.length===2) return [dmsMatches[0].trim(), dmsMatches[1].trim()];
  // Decimal pair separated by comma and/or whitespace, e.g. "51.51828, -0.15139".
  const m = s.match(/^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(m) return [m[1], m[2]];
  return null;
}
window.updateGeoMapLink = function(){
  const latEl = document.getElementById('geoManualLat');
  const lonEl = document.getElementById('geoManualLon');
  if(!latEl || !lonEl) return;
  // Auto-split a full pair pasted into either single box.
  const pastedInLat = splitCoordPair(latEl.value);
  if(pastedInLat && !lonEl.value.trim()){ latEl.value = pastedInLat[0]; lonEl.value = pastedInLat[1]; }
  else {
    const pastedInLon = splitCoordPair(lonEl.value);
    if(pastedInLon && !latEl.value.trim()){ latEl.value = pastedInLon[0]; lonEl.value = pastedInLon[1]; }
  }
  const lat = parseCoordToken(latEl.value);
  const lon = parseCoordToken(lonEl.value);
  const link = document.getElementById('geoManualMapLink');
  const preview = document.getElementById('geoManualPreview');
  const valid = isFinite(lat) && isFinite(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180;
  if(link) link.style.display = valid ? 'block' : 'none';
  if(valid) link.href = `https://www.google.com/maps?q=${lat},${lon}`;
  if(preview){
    if(valid){ preview.textContent = 'Interpreted as: '+lat.toFixed(5)+', '+lon.toFixed(5); preview.style.display='block'; }
    else { preview.style.display = 'none'; }
  }
};
window.saveManualGeo = async function(siteId){
  const lat = parseCoordToken(document.getElementById('geoManualLat').value);

    toast('Could not read that as a co-ordinate — use decimal (51.51828) or degrees/minutes/seconds (51°31\'05.8"N).');

  }
  closeGeoModal();
  await saveGeofenceCoords(siteId, lat, lon);
};

window.uploadPriceFiles = async function(siteId, input){

  let uploaded = 0;
  for(const file of files){
    const path = siteId+'/price/'+uid()+'-'+file.name.replace(/[^a-z0-9.\-_]/gi,'_');
    const stored = await uploadToStorage('price-files', path, file, file.type);
    if(!stored) continue;
    const rows = await dbInsert('price_files', {site_id:siteId, filename:file.name, storage_path:stored, content_type:file.type||null, uploaded_by:ME.id});
    if(rows) uploaded++;

window.viewPriceFile = async function(siteId, storagePath, filename){
  const isSheet = /\.(xlsx|xls|csv)$/i.test(filename);
  if(!isSheet){
    const res = await sbFetch('/functions/v1/price-file-access', {method:'POST', body:JSON.stringify({site_id:siteId, storage_path:storagePath})});
    const d = await res.json();
    if(!res.ok || d.error || !d.url){ toast(d.error || 'Could not open file.'); return; }
    window.open(d.url, '_blank');
    return;
  }
  priceFilePreview = {path:storagePath, filename, loading:true, error:null, sheetHtml:null};
  render();
  try{
    const res = await sbFetch('/functions/v1/price-file-access', {method:'POST', body:JSON.stringify({site_id:siteId, storage_path:storagePath})});
    const d = await res.json();
    if(!res.ok || d.error || !d.url){ priceFilePreview = {path:storagePath, filename, loading:false, error: d.error || 'Could not load the file.', sheetHtml:null}; render(); return; }
    if(typeof XLSX==='undefined'){ priceFilePreview = {path:storagePath, filename, loading:false, error:'Excel library failed to load — check connection.', sheetHtml:null}; render(); return; }
    const buf = await (await fetch(d.url)).arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const firstSheet = wb.Sheets[wb.SheetNames[0]];
    const html = XLSX.utils.sheet_to_html(firstSheet, {id:'priceSheetTable'});
    priceFilePreview = {path:storagePath, filename, loading:false, error:null, sheetHtml:html};
  }catch(e){
    priceFilePreview = {path:storagePath, filename, loading:false, error:'Could not open the file.', sheetHtml:null};
  }
  render();
};

  if(canManage) checkPriceOverbookedNotification(siteId, balance);

async function checkPriceOverbookedNotification(siteId, balance){
  const site = SITES.find(s=>s.id===siteId);
  if(!site) return;
  const isOverbooked = balance <= -50;
  if(isOverbooked && !site.overbooked_notified){
    const row = await dbUpdate('sites', siteId, {overbooked_notified:true});
    if(row){ const idx=SITES.findIndex(s=>s.id===siteId); if(idx>-1) SITES[idx]=row; }
    const fmt = n => '£' + Math.abs(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
    postSystemMessage(siteId, 'price_overbooked', `${site.name}: Price is overbooked by ${fmt(balance)} — please review as soon as possible.`);
  } else if(!isOverbooked && site.overbooked_notified){
    const row = await dbUpdate('sites', siteId, {overbooked_notified:false});
    if(row){ const idx=SITES.findIndex(s=>s.id===siteId); if(idx>-1) SITES[idx]=row; }
  }
}

/* ================= LABOUR INVOICES ================= */
// Lives as a dropdown at the bottom of the Price tile — visible to managers
// always, and to an operative only once a PM ticks them on in the "Who can
// see it" list below (a distinct grant from price access, kept separate
// even though it now shares the Price page).

window.uploadLabourInvoices = async function(siteId, input){
  const files = input.files ? Array.from(input.files) : [];
  if(!files.length) return;
  let uploaded = 0;
  for(const file of files){
    const path = siteId+'/invoices/'+uid()+'-'+file.name.replace(/[^a-z0-9.\-_]/gi,'_');
    const stored = await uploadToStorage('labour-invoices', path, file, file.type);
    if(!stored) continue;
    const rows = await dbInsert('labour_invoices', {site_id:siteId, filename:file.name, storage_path:stored, content_type:file.type||null, uploaded_by:ME.id});
    if(rows) uploaded++;
  }
  input.value = '';
  if(uploaded){ toast(uploaded===1 ? 'File uploaded' : uploaded+' files uploaded'); render(); }
};
window.deleteLabourInvoice = async function(siteId, fileId, storagePath){
  if(!await customConfirm('Delete this invoice? This can\'t be undone.')) return;
  try{ await sbFetch('/storage/v1/object/labour-invoices/'+storagePath, {method:'DELETE'}); }catch(e){}
  const ok = await dbDelete('labour_invoices', fileId);
  if(ok){
    toast('Invoice deleted');
    if(labourInvoicePreview.path===storagePath) labourInvoicePreview = {path:null, filename:null, loading:false, error:null, sheetHtml:null};
    render();
  }
};
window.viewLabourInvoice = async function(siteId, storagePath, filename){
  const isSheet = /\.(xlsx|xls|csv)$/i.test(filename);
  if(!isSheet){
    const res = await sbFetch('/functions/v1/labour-invoice-access', {method:'POST', body:JSON.stringify({site_id:siteId, storage_path:storagePath})});
    const d = await res.json();
    if(!res.ok || d.error || !d.url){ toast(d.error || 'Could not open file.'); return; }
    window.open(d.url, '_blank');
    return;
  }
  labourInvoicePreview = {path:storagePath, filename, loading:true, error:null, sheetHtml:null};
  render();
  try{
    const res = await sbFetch('/functions/v1/labour-invoice-access', {method:'POST', body:JSON.stringify({site_id:siteId, storage_path:storagePath})});
    const d = await res.json();
    if(!res.ok || d.error || !d.url){ labourInvoicePreview = {path:storagePath, filename, loading:false, error: d.error || 'Could not load the file.', sheetHtml:null}; render(); return; }
    if(typeof XLSX==='undefined'){ labourInvoicePreview = {path:storagePath, filename, loading:false, error:'Excel library failed to load — check connection.', sheetHtml:null}; render(); return; }
    const buf = await (await fetch(d.url)).arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const firstSheet = wb.Sheets[wb.SheetNames[0]];
    const html = XLSX.utils.sheet_to_html(firstSheet, {id:'labourInvoiceSheetTable'});
    labourInvoicePreview = {path:storagePath, filename, loading:false, error:null, sheetHtml:html};
  }catch(e){
    labourInvoicePreview = {path:storagePath, filename, loading:false, error:'Could not open the file.', sheetHtml:null};
  }
  render();
};
window.closeLabourInvoicePreview = function(){ labourInvoicePreview = {path:null, filename:null, loading:false, error:null, sheetHtml:null}; render(); };
window.toggleLabourInvoiceAccess = async function(siteId, userId, hasAccess){
  if(hasAccess){
    const res = await sbFetch('/rest/v1/site_labour_invoice_access?site_id=eq.'+siteId+'&user_id=eq.'+userId, {method:'DELETE'});
    if(!res.ok){ toast('Could not remove — '+(await safeErr(res))); return; }
    toast('Access removed');
  } else {
    const rows = await dbInsert('site_labour_invoice_access', {site_id:siteId, user_id:userId, granted_by:ME.id});
    if(!rows) return;
    toast('Access granted');
  }

// Trigger candidates for conditional logic: any earlier question in the SAME
// section that can actually be answered (everything except instruction text)
// — mirrors how SafetyCulture nests a conditional question directly under
// the question that triggers it. Fixed-option questions (Pass/Fail/N-A,
// choice, Yes/No) can trigger on "equals a specific answer" as well as "has
// any answer"; every other type (text, number, date, photo, signature,
// multichoice) can only trigger on "has any answer" since there's no fixed
// list of possible values to pick from.
function possibleTriggerItems(si, ii){
  const items = editingTemplate.sections[si].items;
  const out = [];
  items.forEach((cand,idx)=>{
    if(idx>=ii) return;
    if(cand.type==='instruction') return;
    out.push(cand);
  });
  return out;
}
function itemHasFixedOptions(it){
  return it.type==='passfail' || it.type==='choice' || it.type==='checkbox';
}
function triggerOptionsFor(qId){
  for(const s of editingTemplate.sections){
    for(const cand of (s.items||[])){
      if(cand.id===qId){
        if(cand.type==='passfail') return ['Pass','Fail','N/A'];
        if(cand.type==='checkbox') return ['Yes','No'];
        if(cand.type==='choice') return cand.options||[];
      }
    }
  }
  return [];
}
function renderTemplateItemLogicEditor(si, ii, it){
  const candidates = possibleTriggerItems(si, ii);
  if(!candidates.length && !it.showIf) return '';
  const triggerItem = it.showIf ? candidates.find(c=>c.id===it.showIf.qId) : null;
  const fixedOptions = triggerItem ? itemHasFixedOptions(triggerItem) : false;
  const isEquals = !!it.showIf && it.showIf.mode !== 'notblank';
  return `
    <div style="margin-top:6px;">
      <label class="field-label" style="margin-bottom:2px;">Only show this question if…</label>
      <select onchange="setItemLogicTrigger(${si},${ii},this.value)">
        <option value="">Always show</option>
        ${candidates.map(cand=>`<option value="${cand.id}" ${it.showIf && it.showIf.qId===cand.id?'selected':''}>${escapeHtml(cand.label||'(untitled question)')}</option>`).join('')}
      </select>
      ${it.showIf ? `
        <select style="margin-top:6px;" onchange="setItemLogicMode(${si},${ii},this.value)">
          <option value="notblank" ${!isEquals?'selected':''}>…isn't left blank (any answer given)</option>
          ${fixedOptions ? `<option value="equals" ${isEquals?'selected':''}>…equals a specific answer</option>` : ''}
        </select>
        ${(isEquals && fixedOptions) ? `
          <div class="row-gap" style="margin-top:6px;flex-wrap:wrap;">
            ${triggerOptionsFor(it.showIf.qId).map(o=>`<label class="stub" style="display:flex;align-items:center;gap:4px;"><input type="checkbox" style="width:auto;" ${(it.showIf.values||[]).includes(o)?'checked':''} onchange="toggleItemLogicValue(${si},${ii},'${o.replace(/'/g,"\\'")}',this.checked)">${escapeHtml(PASSFAIL_LABEL[o]||o)}</label>`).join('')}
          </div>
        ` : ''}
      ` : ''}
    </div>
  `;
}
window.setItemLogicTrigger = function(si, ii, val){
  const it = editingTemplate.sections[si].items[ii];
  if(!val){ it.showIf = null; render(); return; }
  const cand = editingTemplate.sections[si].items.find(c=>c.id===val);
  const fixedOptions = cand ? itemHasFixedOptions(cand) : false;
  it.showIf = {qId: val, mode: fixedOptions ? 'equals' : 'notblank', values: []};
  render();
};
window.setItemLogicMode = function(si, ii, mode){
  const it = editingTemplate.sections[si].items[ii];
  if(!it.showIf) return;
  it.showIf.mode = mode;
  if(mode==='notblank') it.showIf.values = [];
  render();
};
window.toggleItemLogicValue = function(si, ii, value, checked){
  const it = editingTemplate.sections[si].items[ii];
  if(!it.showIf) return;
  const set = new Set(it.showIf.values||[]);
  if(checked) set.add(value); else set.delete(value);
  it.showIf.values = Array.from(set);
  render();
};

window.addTemplateItem = function(si){

window.exportSelectedReports = async function(siteId){
  if(!selectedReportIds.size) return;
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  bulkExportBusy = true; render();
  toast('Building PDF…');
  try{
    const ids = Array.from(selectedReportIds);
    const merged = await PDFLib.PDFDocument.create();
    let any = false;
    for(const id of ids){
      const built = await buildReportPdf(id);
      if(!built) continue;
      const src = await PDFLib.PDFDocument.load(built.bytes);
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach(p=>merged.addPage(p));
      any = true;
    }
    if(!any){ toast('Could not build any of the selected reports.'); bulkExportBusy=false; render(); return; }
    const site = SITES.find(s=>s.id===siteId);
    const filename = exportFilename(site?site.name:'', `Reports (${ids.length})`, 'pdf');
    merged.setTitle(filename.replace(/\.pdf$/i,''));
    const outBytes = await merged.save();
    await deliverPdf(outBytes, filename);
    selectedReportIds = new Set();
  }catch(e){ console.error(e); toast('Could not build the combined PDF.'); }
  bulkExportBusy = false; render();
};
window.emailSelectedReports = async function(){
  if(!selectedReportIds.size) return;
  bulkEmailBusy = true; render();
  toast('Building PDFs…');
  try{
    const ids = Array.from(selectedReportIds);
    const attachments = [];
    for(const id of ids){
      const built = await buildReportPdf(id);
      if(built) attachments.push({submission_id:id, filename:built.filename, content_base64:built.base64});
    }
    if(!attachments.length){ toast('Could not build any of the selected reports.'); bulkEmailBusy=false; render(); return; }
    const res = await sbFetch('/functions/v1/send-report-email', {method:'POST', body: JSON.stringify({attachments})});
    const d = await res.json();
    if(!res.ok || d.error){ toast('Email failed — '+(d.error||res.status)); }
    else { toast(`${attachments.length} report(s) emailed to ${ME.email}`); selectedReportIds = new Set(); }
  }catch(e){ toast('Email failed — could not reach the server.'); }
  bulkEmailBusy = false; render();
};
window.deleteSelectedReports = async function(siteId){
  if(!selectedReportIds.size) return;
  const n = selectedReportIds.size;
  if(!await customConfirm(`Delete ${n} report${n>1?'s':''}? This can't be undone.`)) return;

async function ensureReportOperativesDefault(itemId, siteId){

window.submitReport = async function(siteId){

  for(const s of (sections||[])){
    for(const it of (s.items||[])){
      if(it.type==='instruction') continue;
      if(!itemVisible(it, reportFillDraft.answers)) continue;
      if(it.required){
        const v = reportFillDraft.answers[it.id];
        if(it.type==='photo' || it.type==='multichoice'){
          if(!Array.isArray(v) || !v.length){ toast(`"${it.label}" is required.`); return; }
        } else if(it.type==='operatives'){
          if(!Array.isArray(v) || !v.some(r=>r.included)){ toast(`"${it.label}" needs at least one operative on site.`); return; }
        } else if(it.type==='signature'){
          if(!ME.signature_path){ toast('Adopt your signature before submitting.'); return; }
          if(!v){ toast(`Tap to sign "${it.label}" before submitting.`); return; }
        } else if(v===undefined || v===null || v===''){ toast(`"${it.label}" is required.`); return; }
      }
      if(mediaRequiredFor(it, reportFillDraft.answers)){
        const media = reportFillDraft.answers[it.id+'__media'];
        if(!Array.isArray(media) || !media.length){ toast(`A photo is required for "${it.label}" based on your answer.`); return; }
      }

function renderReportViewItem(it, val, answers){

  if(it.type==='operatives'){

  }

  if(it.type==='checkbox') display = val===true ? 'Yes' : (val===false ? 'No' : '—');
  else if(it.type==='passfail' && val) display = PASSFAIL_LABEL[val]||val;

async function buildReportPdf(submissionId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return null; }

    const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const WHITE = PDFLib.rgb(1,1,1);
    const INK = PDFLib.rgb(0.06,0.06,0.07);

    const LINE = PDFLib.rgb(0.88,0.88,0.90);
    const FAINT = PDFLib.rgb(0.85,0.84,0.80);
    const HEADBAR = PDFLib.rgb(0.933,0.941,0.961);
    const GREEN = PDFLib.rgb(0.122,0.573,0.322);
    const RED = PDFLib.rgb(0.757,0.231,0.231);
    const GRAY = PDFLib.rgb(0.463,0.463,0.478);
    const BLUE = PDFLib.rgb(0.231,0.435,0.851);
    const GREENTXT = PDFLib.rgb(0.122,0.573,0.322);
    const BRAND = pdfHexToRgb((ORG && ORG.color_primary) || DEFAULT_BRAND1);
    const PAGE_W = 595.28, PAGE_H = 841.89;
    const MARGIN = 44;
    const CONTENT_W = PAGE_W - 2*MARGIN;
    const BAR_X = MARGIN + CONTENT_W*0.46; // colour bars start ~46% across, like the reference PDFs

    function drawHeaderBand(){

        const s = 40/Math.max(dim.width, dim.height);

      }
      const textX = logoImg ? MARGIN+52 : MARGIN;
      page.drawText('INSPECTION REPORT', {x:textX, y:PAGE_H-40, size:9, font:bold, color:WHITE, opacity:0.85});

        const vw = bold.widthOfTextAtSize(valueText, 10.5);

              const when = new Date(sub.submitted_at).toLocaleString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'}).replace(',', '');

            }
          }catch(e){ y -= 16; }

        }

        // freeform text — plain paragraph, no colour bar (matches how
        // free-text answers like "any other issues" read in the reference)
        if(it.type==='text' || it.type==='textarea' || it.type==='number' || it.type==='date'){
          const display = (val!=null && val!=='') ? String(val) : '—';
          drawParagraphAnswer(it.label, display);
        } else {
          let display = '—', color = GRAY;
          if(it.type==='checkbox'){
            display = val===true ? 'Yes' : (val===false ? 'No' : '—');
            color = val===true ? GREEN : (val===false ? RED : GRAY);
          } else if(it.type==='passfail' && val){
            display = PASSFAIL_LABEL[val]||val;
            color = val==='Pass' ? GREEN : (val==='Fail' ? RED : GRAY);
          } else if(it.type==='multichoice'){
            display = (Array.isArray(val) && val.length) ? val.join(', ') : '—';

          } else if(it.type==='choice' && val){

          }
          drawAnswerRow(it.label, display, color);
        }

        // an optional photo attached to this specific answer
        const extraMedia = itemAllowsMedia(it) && Array.isArray(sub.answers[it.id+'__media']) ? sub.answers[it.id+'__media'] : [];

    }

    /* ---------- Media summary appendix — same photos, same numbers ---------- */
    if(allPhotos.length){
      newPage();
      drawHeadingBar('Media summary', null, 12.5);

    }

    const total = pdfDoc.getPageCount();
    pdfDoc.getPages().forEach((p,idx)=>{
      p.drawText((idx+1)+'/'+total, {x:PAGE_W-MARGIN-26, y:26, size:8.5, font:reg, color:SLATE});

    let binary=''; const chunk=0x8000;
    for(let i=0;i<outBytes.length;i+=chunk) binary += String.fromCharCode.apply(null, outBytes.subarray(i,i+chunk));

  }catch(e){
    console.error(e);
    toast('Could not build the PDF.');
    return null;
  }
}
window.exportReportPDF = async function(submissionId){
  toast('Building PDF…');
  const built = await buildReportPdf(submissionId);
  if(!built) return;
  await deliverPdf(built.bytes, built.filename);

  // Best-effort OneDrive sync — same silent-fail pattern as photo sync.
  try{
    await sbFetch('/functions/v1/onedrive-upload', {method:'POST', body: JSON.stringify({filename: built.filename, content_base64: built.base64, site_id: built.sub.site_id})});
  }catch(e){ /* silent — OneDrive sync is opportunistic */ }
};
window.emailReportPDF = async function(submissionId){
  reportEmailBusy = submissionId; render();
  toast('Building PDF…');
  const built = await buildReportPdf(submissionId);
  if(!built){ reportEmailBusy = null; render(); return; }
  try{
    const res = await sbFetch('/functions/v1/send-report-email', {method:'POST', body: JSON.stringify({
      submission_id: submissionId, filename: built.filename, content_base64: built.base64,
    })});
    const d = await res.json();
    if(!res.ok || d.error){ toast('Email failed — '+(d.error||res.status)); }
    else toast('Report emailed to '+ME.email);
  }catch(e){ toast('Email failed — could not reach the server.'); }
  reportEmailBusy = null; render();
};

// Pairs up each operative's raw in/out log (chronological, ascending) into
// sessions of {user_id, in, out} — out:null means still on site. An "in"
// with no prior open session starts a new one; a stray "out" with nothing
// open is kept as its own row (in:null) so nothing silently disappears.
function buildCheckinSessions(rowsAsc){
  const byUser = {};
  rowsAsc.forEach(c=>{ (byUser[c.user_id] = byUser[c.user_id] || []).push(c); });
  const sessions = [];
  Object.keys(byUser).forEach(uid=>{
    let open = null;
    byUser[uid].forEach(c=>{
      if(c.type==='in'){
        if(open) sessions.push({user_id:uid, in:open, out:null});
        open = c;
      } else {
        if(open){ sessions.push({user_id:uid, in:open, out:c}); open = null; }
        else sessions.push({user_id:uid, in:null, out:c});
      }
    });
    if(open) sessions.push({user_id:uid, in:open, out:null});
  });
  return sessions;
}
function checkinDayLabel(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if(d.getTime()===today.getTime()) return 'Today';
  if(d.getTime()===yest.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}

window.doCheckAction = async function(siteId, type){
  checkinError = null;
  checkinBusy = true;
  render();

  // OpHUB Basic doesn't include GPS check-in & geofencing — just log the
  // timestamp with no location and skip the distance check entirely. PMs
  // and admins get the same no-GPS path regardless of tier — they don't
  // need to be physically on site to check themselves in/out.
  if(!orgAllowsGps() || isManager(ME)){
    const rows = await dbInsert('checkins', {site_id:siteId, user_id:ME.id, type});
    checkinBusy = false;
    if(rows){
      toast((type==='in'?'Checked in':'Checked out')+' · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
    }
    render();
    return;
  }

  const g = await getGeo();
  if(g.error){
    checkinBusy = false; checkinError = g.error; render(); return;
  }
  const site = SITES.find(s=>s.id===siteId);
  if(site.geofence_lat){
    const dist = Math.round(distMeters(g.lat, g.lon, site.geofence_lat, site.geofence_lon));
    const allowedRadius = site.geofence_radius_m || 100;
    if(dist > allowedRadius){
      checkinBusy = false;
      checkinError = `${dist}m from site — must be within ${allowedRadius}m to ${type==='in'?'check in':'check out'}. Move closer and try again.`;
      render();
      return;
    }
  }
  const rows = await dbInsert('checkins', {site_id:siteId, user_id:ME.id, type, lat:g.lat, lon:g.lon, accuracy_m:Math.round(g.accuracy||0)});
  checkinBusy = false;
  if(rows){
    toast((type==='in'?'Checked in':'Checked out')+' · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
  }
  render();
};
window.exportCheckins = async function(siteId, scope){

window.importScheduleExcel = async function(input, siteId){
  const file = input.files && input.files[0]; if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel library failed to load — check connection.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const names = rows.slice(1).map(r=>r[0]).filter(v=>v!=null && String(v).trim()!=='');
    if(!names.length){ toast('No task names found in column A.'); return; }
    const startPos = await nextTaskPosition(siteId);
    const newRows = names.map((n,i)=>({site_id:siteId, name:String(n).trim(), status:'todo', position:startPos+i}));
    const inserted = await dbInsert('schedule_tasks', newRows);
    if(inserted){ toast(`${names.length} task(s) imported`); render(); }
  }catch(e){ toast('Could not read that file — check it\'s a valid .xlsx or .csv.'); }
};
window.importSchedulePdf = async function(input, siteId){
  const file = input.files && input.files[0]; if(!file) return;
  if(typeof pdfjsLib==='undefined'){ toast('PDF reader failed to load — check connection.'); return; }
  const manual = !!(document.getElementById('pdfManualMode') && document.getElementById('pdfManualMode').checked);
  toast('Reading PDF…');
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let lines = [];
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      // Group text fragments into lines by their vertical position, since
      // pdf.js returns individual text runs rather than whole lines.
      let lineMap = {};
      content.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        (lineMap[y] = lineMap[y] || []).push(it.str);
      });
      Object.keys(lineMap).map(Number).sort((a,b)=>b-a).forEach(y=>{
        const text = lineMap[y].join(' ').replace(/\s+/g,' ').trim();
        if(text) lines.push(text);
      });
    }
    if(!lines.length){ toast('No readable text found in that PDF — try ticking manual entry and paste the list yourself.'); pdfImportSiteId=siteId; pdfImportText=''; render(); return; }
    let prefill;
    if(manual){
      // Manual mode: hand back everything we could read so the person can
      // trim it down themselves, rather than guessing what's a task line.
      prefill = lines.join('\n');
    } else {
      // Best-effort auto-pull: drop obvious non-task lines (page numbers,
      // headers, very short fragments) and hope the rest are task rows —
      // still reviewed and editable before anything is actually imported.
      const skip = /^(page\s*\d+|schedule of works|item|description|task|ref\.?|no\.?|date|status|notes?)$/i;
      prefill = lines.filter(l=>{
        const t = l.trim();
        if(t.length<3) return false;
        if(/^\d+$/.test(t)) return false;
        if(skip.test(t)) return false;
        return true;
      }).join('\n');
    }
    pdfImportSiteId = siteId;
    pdfImportText = prefill;
    render();
  }catch(e){ console.error(e); toast('Could not read that PDF — try ticking manual entry and paste the list yourself.'); }
  input.value = '';
};

function pdfHexToRgb(hex){
  const h = (hex||'').replace('#','');
  if(h.length!==6) return PDFLib.rgb(0.306,0.561,0.820);
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  return PDFLib.rgb(r,g,b);
}
async function pdfFetchImageBytes(url){
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    return new Uint8Array(await res.arrayBuffer());
  }catch(e){ return null; }
}
// Shared "Media summary" appendix for exports that only ever embed ONE
// representative photo per row/card (Snagging, Schedule of Works) even when
// several exist — appends dedicated pages at the end showing every photo,
// fixed 2x2 grid, exactly 4 per page (each tile roughly a quarter of the
// page). Call this BEFORE any final page-numbering/footer pass so the
// appendix pages pick up the same footer as the rest of the document.
// `photoRefs` is an array of {path, bucket} — bucket lets callers mix
// buckets if they ever need to (site-photos etc).
async function appendMediaSummaryPages(pdfDoc, photoRefs){
  if(!photoRefs || !photoRefs.length) return;
  const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const INK = PDFLib.rgb(0.06,0.06,0.07);
  const SLATE = PDFLib.rgb(0.36,0.37,0.41);
  const HEADBAR = PDFLib.rgb(0.925,0.91,0.87);
  const PAGE_W = 595.28, PAGE_H = 841.89, MARGIN = 42;
  const CONTENT_W = PAGE_W - 2*MARGIN;
  const cols = 2, rows = 2, gutter = 14, capH = 16, headingH = 40;
  const cellW = (CONTENT_W - gutter) / cols;
  const cellH = (PAGE_H - 2*MARGIN - headingH - gutter - capH*rows) / rows;
  let num = 0;
  for(let i=0; i<photoRefs.length; i+=cols*rows){
    const page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    let y = PAGE_H - MARGIN;
    if(i===0){
      page.drawRectangle({x:MARGIN, y:y-26, width:CONTENT_W, height:26, color:HEADBAR});
      page.drawText('Media summary', {x:MARGIN+10, y:y-26+8, size:11.5, font:bold, color:INK});
      y -= 26+10;
    } else {
      y -= headingH; // keep every page's grid starting position consistent
    }
    const startY = y;
    const group = photoRefs.slice(i, i+cols*rows);
    for(let r=0; r<rows; r++){
      const rowItems = group.slice(r*cols, r*cols+cols);
      if(!rowItems.length) break;
      const rowTop = startY - r*(cellH+capH+gutter);
      for(let c=0; c<rowItems.length; c++){
        num++;
        const ref = rowItems[c];
        const cx = MARGIN + c*(cellW+gutter);
        try{
          const bytes = await pdfFetchImageBytes(publicUrl(ref.bucket||'site-photos', ref.path));
          if(bytes){
            let img; try{ img = await pdfDoc.embedJpg(bytes); }catch(e){ img = await pdfDoc.embedPng(bytes); }
            const dim = img.scale(1);
            const sc = Math.min(cellW/dim.width, cellH/dim.height, 1);
            const w = dim.width*sc, h = dim.height*sc;
            page.drawImage(img, {x:cx+(cellW-w)/2, y:rowTop-cellH+(cellH-h)/2, width:w, height:h});
            page.drawText('Photo '+num, {x:cx, y:rowTop-cellH-13, size:8.5, font:reg, color:SLATE});
          }
        }catch(e){ /* skip photo if it fails to embed */ }
      }
    }
  }
}
// Shared "Signature Record" pages used by both the RAMS and Toolbox Talk
// signed-PDF exports: a disclaimer paragraph followed by a clean
// Name / Signature / Date table (one row per signer), paginating cleanly if
// the signer list runs past a page.
async function drawSignatureTablePages(pdfDoc, opts){
  const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const RED = PDFLib.rgb(0.784,0.063,0.180);
  const INK = PDFLib.rgb(0.06,0.06,0.07);
  const SLATE = PDFLib.rgb(0.36,0.37,0.41);
  const LINE = PDFLib.rgb(0.85,0.85,0.85);
  const HEADBG = PDFLib.rgb(0.95,0.94,0.91);
  const PAGE_W = 595.28, PAGE_H = 841.89;
  const MARGIN = 50;
  const TABLE_W = PAGE_W - 2*MARGIN;
  const COL_NAME = 160, COL_SIG = 205, COL_DATE = TABLE_W - COL_NAME - COL_SIG;
  const ROW_H = 46, HEADER_H = 24;

  function wrapText(text, font, size, maxWidth){
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(font.widthOfTextAtSize(test, size) > maxWidth && cur){ lines.push(cur); cur = w; }
      else cur = test;
    }
    if(cur) lines.push(cur);
    return lines;
  }

  let page, y;
  function drawTableHeader(){
    page.drawRectangle({x:MARGIN, y:y-HEADER_H, width:TABLE_W, height:HEADER_H, color:HEADBG});
    page.drawText('Name', {x:MARGIN+10, y:y-HEADER_H+7, size:9.5, font:bold, color:INK});
    page.drawText('Signature', {x:MARGIN+COL_NAME+10, y:y-HEADER_H+7, size:9.5, font:bold, color:INK});
    page.drawText('Date', {x:MARGIN+COL_NAME+COL_SIG+10, y:y-HEADER_H+7, size:9.5, font:bold, color:INK});
    page.drawLine({start:{x:MARGIN,y:y-HEADER_H}, end:{x:MARGIN+TABLE_W,y:y-HEADER_H}, thickness:1, color:INK});
    page.drawLine({start:{x:MARGIN+COL_NAME,y:y}, end:{x:MARGIN+COL_NAME,y:y-HEADER_H}, thickness:0.5, color:LINE});
    page.drawLine({start:{x:MARGIN+COL_NAME+COL_SIG,y:y}, end:{x:MARGIN+COL_NAME+COL_SIG,y:y-HEADER_H}, thickness:0.5, color:LINE});
    y -= HEADER_H;
  }
  function newPage(continued){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    y = PAGE_H - 60;
    page.drawText('Signature Record' + (continued ? ' (continued)' : ''), {x:MARGIN, y, size:18, font:bold, color:RED});
    y -= 8;
    page.drawLine({start:{x:MARGIN,y}, end:{x:PAGE_W-MARGIN,y}, thickness:1.5, color:INK});
    y -= 24;
    page.drawText(opts.title, {x:MARGIN, y, size:12, font:bold, color:INK});
    y -= 20;
    if(!continued){
      wrapText(opts.disclaimer, reg, 9.5, TABLE_W).forEach(line=>{
        page.drawText(line, {x:MARGIN, y, size:9.5, font:reg, color:SLATE});
        y -= 13;
      });
      y -= 12;
    }
    drawTableHeader();
  }
  newPage(false);
  for(const s of opts.signers){
    if(y - ROW_H < 70) newPage(true);
    const rowTop = y;
    page.drawLine({start:{x:MARGIN,y:rowTop-ROW_H}, end:{x:MARGIN+TABLE_W,y:rowTop-ROW_H}, thickness:0.5, color:LINE});
    page.drawLine({start:{x:MARGIN+COL_NAME,y:rowTop}, end:{x:MARGIN+COL_NAME,y:rowTop-ROW_H}, thickness:0.5, color:LINE});
    page.drawLine({start:{x:MARGIN+COL_NAME+COL_SIG,y:rowTop}, end:{x:MARGIN+COL_NAME+COL_SIG,y:rowTop-ROW_H}, thickness:0.5, color:LINE});
    page.drawText(s.name, {x:MARGIN+10, y:rowTop-ROW_H/2-4, size:10, font:reg, color:INK});
    if(s.imagePath){
      try{
        const bytes = await pdfFetchImageBytes(publicUrl('signatures', s.imagePath));
        if(bytes){
          let img; try{ img = await pdfDoc.embedPng(bytes); }catch(e){ img = await pdfDoc.embedJpg(bytes); }
          const dim = img.scale(1);
          const boxH = 30, boxW = COL_SIG-20;
          const s2 = Math.min(boxW/dim.width, boxH/dim.height);
          const w = dim.width*s2, h = dim.height*s2;
          page.drawImage(img, {x:MARGIN+COL_NAME+10, y:rowTop-ROW_H/2-h/2, width:w, height:h});
        }
      }catch(e){ /* fall back to blank signature cell */ }
    }
    page.drawText(s.when, {x:MARGIN+COL_NAME+COL_SIG+10, y:rowTop-ROW_H/2-4, size:9.5, font:reg, color:SLATE});
    y = rowTop - ROW_H;
  }
  y -= 16;
  if(y < 60) newPage(true);
  page.drawText('Generated ' + new Date().toLocaleString('en-GB') + ' — original document pages are unmodified above.', {x:MARGIN, y, size:8.5, font:reg, color:SLATE});
}
window.exportSnaggingPDF = async function(siteId, scope){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  const site = SITES.find(s=>s.id===siteId);
  let qs = 'site_id=eq.'+siteId+'&order=created_at.asc';
  if(scope==='live') qs += '&status=eq.open';
  else if(scope==='closed') qs += '&status=eq.closed';
  else qs += '&status=in.(open,closed)';
  const snags = await dbSelect('snags', qs);
  if(!snags.length){ toast('No snags to export for that filter.'); return; }
  await loadAllProfiles();
  toast('Building PDF…');
  try{
    const pdfDoc = await PDFLib.PDFDocument.create();
    const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const BRAND = pdfHexToRgb((ORG && ORG.color_primary) || DEFAULT_BRAND1);
    const WHITE = PDFLib.rgb(1,1,1);
    const INK = PDFLib.rgb(0.06,0.06,0.07);
    const SLATE = PDFLib.rgb(0.36,0.37,0.41);
    const FAINT = PDFLib.rgb(0.85,0.84,0.80);
    const CARDBG = PDFLib.rgb(0.976,0.969,0.949);
    const OK = PDFLib.rgb(0.2,0.55,0.35);
    const OKBG = PDFLib.rgb(0.90,0.95,0.91);
    const WARN = PDFLib.rgb(0.69,0.45,0.06);
    const WARNBG = PDFLib.rgb(0.97,0.92,0.83);
    const PAGE_W = 595.28, PAGE_H = 841.89;
    const MARGIN = 42;
    const scopeLabel = scope==='live' ? 'Live' : scope==='closed' ? 'Closed' : 'All';
    const companyName = (ORG && ORG.name) || 'OpHUB';
    const openCount = snags.filter(s=>s.status==='open').length;
    const closedCount = snags.filter(s=>s.status==='closed').length;

    // Embed the company logo once (falls back to nothing if it can't be fetched/decoded).
    let logoImg = null;
    const logoUrl = ORG && ORG.logo_path ? publicUrl('org-logos', ORG.logo_path) : null;
    if(logoUrl){
      const bytes = await pdfFetchImageBytes(logoUrl);
      if(bytes){ try{ logoImg = await pdfDoc.embedJpg(bytes); }catch(e){ try{ logoImg = await pdfDoc.embedPng(bytes); }catch(e2){} } }
    }

    let page, y;
    function drawHeaderBand(){
      page.drawRectangle({x:0, y:PAGE_H-92, width:PAGE_W, height:92, color:BRAND});
      if(logoImg){
        const dim = logoImg.scale(1);
        const s = 40/Math.max(dim.width, dim.height);
        const w = dim.width*s, h = dim.height*s;
        page.drawRectangle({x:MARGIN, y:PAGE_H-66, width:40, height:40, color:WHITE});
        page.drawImage(logoImg, {x:MARGIN+(40-w)/2, y:PAGE_H-66+(40-h)/2, width:w, height:h});
      }
      const textX = logoImg ? MARGIN+52 : MARGIN;
      page.drawText('SNAGGING REPORT', {x:textX, y:PAGE_H-40, size:9, font:bold, color:WHITE, opacity:0.85});
      page.drawText(site.name, {x:textX, y:PAGE_H-60, size:16, font:bold, color:WHITE});
      page.drawText(companyName + ' · ' + scopeLabel + ' snags', {x:textX, y:PAGE_H-76, size:9.5, font:reg, color:WHITE, opacity:0.9});
    }
    function drawFooter(pageNum){
      page.drawLine({start:{x:MARGIN,y:34}, end:{x:PAGE_W-MARGIN,y:34}, thickness:0.75, color:FAINT});
      page.drawText('Generated via OpHUB · ' + new Date().toLocaleString('en-GB'), {x:MARGIN, y:20, size:8, font:reg, color:SLATE});
      page.drawText('Page ' + pageNum, {x:PAGE_W-MARGIN-40, y:20, size:8, font:reg, color:SLATE});
    }
    let pageNum = 0;
    function newPage(){
      page = pdfDoc.addPage([PAGE_W, PAGE_H]);
      pageNum++;
      drawHeaderBand();
      y = PAGE_H - 118;
    }
    newPage();
    // Summary strip on the first page only.
    const chipW = 150, chipGap = 14, chipY = y - 34;
    [
      {label:'Total snags', value:String(snags.length), bg:CARDBG, fg:INK},
      {label:'Open', value:String(openCount), bg:WARNBG, fg:WARN},
      {label:'Closed', value:String(closedCount), bg:OKBG, fg:OK},
    ].forEach((c,i)=>{
      const x = MARGIN + i*(chipW+chipGap);
      page.drawRectangle({x, y:chipY, width:chipW, height:44, color:c.bg});
      page.drawText(c.value, {x:x+12, y:chipY+22, size:16, font:bold, color:c.fg});
      page.drawText(c.label.toUpperCase(), {x:x+12, y:chipY+8, size:7.5, font:bold, color:c.fg, opacity:0.8});
    });
    y = chipY - 26;

    for(let i=0;i<snags.length;i++){
      const s = snags[i];
      const hasPhoto = !!((s.photo_paths && s.photo_paths.length) || s.photo_path || (s.status==='closed' && s.closed_photo_path));
      const blockH = hasPhoto ? 130 : 78;
      if(y - blockH < 50){ newPage(); }

      const cardTop = y;
      page.drawRectangle({x:MARGIN, y:cardTop-blockH, width:PAGE_W-2*MARGIN, height:blockH, color:CARDBG});
      const pillColor = s.status==='closed' ? OK : WARN;
      const pillBg = s.status==='closed' ? OKBG : WARNBG;
      const textLeft = MARGIN + 16;
      const imgSlot = 84;
      const textWidth = hasPhoto ? (PAGE_W-2*MARGIN) - imgSlot - 32 : (PAGE_W-2*MARGIN) - 32;
      let ty = cardTop - 22;
      const title = (i+1)+'. '+(s.title.length>52 ? s.title.slice(0,49)+'…' : s.title);
      page.drawText(title, {x:textLeft, y:ty, size:12, font:bold, color:INK});
      const pillW = 56;
      page.drawRectangle({x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW, y:ty-3, width:pillW, height:15, color:pillBg});
      page.drawText(s.status.toUpperCase(), {x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW+8, y:ty+1, size:8, font:bold, color:pillColor});
      ty -= 18;
      page.drawText('Location: '+(s.location||'—'), {x:textLeft, y:ty, size:9.5, font:reg, color:SLATE});
      ty -= 14;
      page.drawText('Raised by '+nameOf(s.created_by)+' · '+new Date(s.created_at).toLocaleDateString('en-GB'), {x:textLeft, y:ty, size:9, font:reg, color:SLATE});
      ty -= 14;
      if(s.status==='closed'){
        page.drawText('Closed by '+nameOf(s.closed_by)+(s.closed_at?' · '+new Date(s.closed_at).toLocaleDateString('en-GB'):''), {x:textLeft, y:ty, size:9, font:reg, color:SLATE});
        ty -= 14;
      }
      if(s.pdf_path){
        page.drawText('PDF attachment on file', {x:textLeft, y:ty, size:8.5, font:reg, color:SLATE});
      }

      if(hasPhoto){
        const photoPath = s.status==='closed' && s.closed_photo_path ? s.closed_photo_path : ((s.photo_paths && s.photo_paths[0]) || s.photo_path);
        const imgX = MARGIN+(PAGE_W-2*MARGIN)-16-imgSlot+8;
        const imgY = cardTop-blockH+14;
        const boxSize = 76;
        try{
          const bytes = await pdfFetchImageBytes(publicUrl('site-photos', photoPath));
          if(bytes){
            let img; try{ img = await pdfDoc.embedJpg(bytes); }catch(e){ img = await pdfDoc.embedPng(bytes); }
            const dim = img.scale(1);
            const s2 = boxSize/Math.max(dim.width, dim.height);
            const w = dim.width*s2, h = dim.height*s2;
            page.drawImage(img, {x:imgX+(boxSize-w)/2, y:imgY+(boxSize-h)/2, width:w, height:h});
          }
        }catch(e){ /* skip photo if it fails to embed */ }
      }

      y = cardTop - blockH - 14;
    }

    // Media summary appendix — every photo on every snag, not just the one
    // shown on its card above (a snag can have several via photo_paths).
    const snagPhotoRefs = [];
    snags.forEach(s=>{
      (s.photo_paths||[]).forEach(p=>snagPhotoRefs.push({path:p, bucket:'site-photos'}));
      if(!((s.photo_paths||[]).length) && s.photo_path) snagPhotoRefs.push({path:s.photo_path, bucket:'site-photos'});
      if(s.closed_photo_path) snagPhotoRefs.push({path:s.closed_photo_path, bucket:'site-photos'});
    });
    await appendMediaSummaryPages(pdfDoc, snagPhotoRefs);

    pdfDoc.getPages().forEach((p,idx)=>{ page = p; drawFooter((idx+1)+' of '+pdfDoc.getPageCount()); });

    const exportLabel = scope==='live' ? 'Snagging Report (Live)' : scope==='closed' ? 'Snagging Report (Closed)' : 'Snagging Report (All)';
    const filename = exportFilename(site.name, exportLabel, 'pdf');
    pdfDoc.setTitle(filename.replace(/\.pdf$/i,''));
    const outBytes = await pdfDoc.save();
    await deliverPdf(outBytes, filename);
  }catch(e){
    console.error(e);
    toast('Could not build the PDF.');
  }
};

window.exportSchedulePDF = async function(siteId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  const site = SITES.find(s=>s.id===siteId);
  const allTasks = await dbSelect('schedule_tasks', 'site_id=eq.'+siteId+'&order=position.asc.nullslast,created_at.asc');
  if(!allTasks.length){ toast('No tasks to export yet.'); return; }
  let photosByTask = {};
  const ids = allTasks.map(t=>t.id).join(',');
  const photos = await dbSelect('schedule_photos', 'task_id=in.('+ids+')&order=uploaded_at.asc');
  photos.forEach(p=>{ (photosByTask[p.task_id]=photosByTask[p.task_id]||[]).push(p); });
  toast('Building PDF…');
  try{
    const pdfDoc = await PDFLib.PDFDocument.create();
    const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const BRAND = pdfHexToRgb((ORG && ORG.color_primary) || DEFAULT_BRAND1);
    const WHITE = PDFLib.rgb(1,1,1);
    const INK = PDFLib.rgb(0.06,0.06,0.07);
    const SLATE = PDFLib.rgb(0.36,0.37,0.41);
    const FAINT = PDFLib.rgb(0.85,0.84,0.80);
    const CARDBG = PDFLib.rgb(0.976,0.969,0.949);
    const OK = PDFLib.rgb(0.2,0.55,0.35);
    const OKBG = PDFLib.rgb(0.90,0.95,0.91);
    const PROG = PDFLib.rgb(0.16,0.40,0.70);
    const PROGBG = PDFLib.rgb(0.87,0.92,0.98);
    const TODO = PDFLib.rgb(0.38,0.39,0.44);
    const TODOBG = PDFLib.rgb(0.90,0.90,0.92);
    const PAGE_W = 595.28, PAGE_H = 841.89;
    const MARGIN = 42;
    const companyName = (ORG && ORG.name) || 'OpHUB';
    const todoTasks = allTasks.filter(t=>t.status==='todo');
    const progTasks = allTasks.filter(t=>t.status==='progress');
    const doneTasks = allTasks.filter(t=>t.status==='done');

    let logoImg = null;
    const logoUrl = ORG && ORG.logo_path ? publicUrl('org-logos', ORG.logo_path) : null;
    if(logoUrl){
      const bytes = await pdfFetchImageBytes(logoUrl);
      if(bytes){ try{ logoImg = await pdfDoc.embedJpg(bytes); }catch(e){ try{ logoImg = await pdfDoc.embedPng(bytes); }catch(e2){} } }
    }

    let page, y;
    function drawHeaderBand(){
      page.drawRectangle({x:0, y:PAGE_H-92, width:PAGE_W, height:92, color:BRAND});
      if(logoImg){
        const dim = logoImg.scale(1);
        const s = 40/Math.max(dim.width, dim.height);
        const w = dim.width*s, h = dim.height*s;
        page.drawRectangle({x:MARGIN, y:PAGE_H-66, width:40, height:40, color:WHITE});
        page.drawImage(logoImg, {x:MARGIN+(40-w)/2, y:PAGE_H-66+(40-h)/2, width:w, height:h});
      }
      const textX = logoImg ? MARGIN+52 : MARGIN;
      page.drawText('SCHEDULE OF WORKS — PROGRESS REPORT', {x:textX, y:PAGE_H-40, size:9, font:bold, color:WHITE, opacity:0.85});
      page.drawText(site.name, {x:textX, y:PAGE_H-60, size:16, font:bold, color:WHITE});
      page.drawText(companyName + ' · as of ' + new Date().toLocaleDateString('en-GB'), {x:textX, y:PAGE_H-76, size:9.5, font:reg, color:WHITE, opacity:0.9});
    }
    function drawFooter(pageNum){
      page.drawLine({start:{x:MARGIN,y:34}, end:{x:PAGE_W-MARGIN,y:34}, thickness:0.75, color:FAINT});
      page.drawText('Generated via OpHUB · ' + new Date().toLocaleString('en-GB'), {x:MARGIN, y:20, size:8, font:reg, color:SLATE});
      page.drawText('Page ' + pageNum, {x:PAGE_W-MARGIN-40, y:20, size:8, font:reg, color:SLATE});
    }
    let pageNum = 0;
    // Tracks whichever section (To Do / In Progress / Complete) is currently
    // being drawn, so that when a section's task rows spill onto a new page
    // the section header gets repeated at the top of it. Without this, a
    // page break mid-section left rows with no heading at all — which is
    // what made In Progress photos look like they'd landed inside the
    // Complete section on the next page.
    let currentSection = null;
    function drawSectionHeaderText(label, color){
      page.drawText(label, {x:MARGIN, y, size:11.5, font:bold, color});
      y -= 6;
      page.drawLine({start:{x:MARGIN,y:y-2}, end:{x:PAGE_W-MARGIN,y:y-2}, thickness:1, color:FAINT});
      y -= 16;
    }
    function newPage(){
      page = pdfDoc.addPage([PAGE_W, PAGE_H]);
      pageNum++;
      drawHeaderBand();
      y = PAGE_H - 118;
      if(currentSection) drawSectionHeaderText(currentSection.label, currentSection.color);
    }
    newPage();

    // Summary strip on the first page only.
    const chipW = 112, chipGap = 10, chipY = y - 34;
    [
      {label:'Total tasks', value:String(allTasks.length), bg:CARDBG, fg:INK},
      {label:'To do', value:String(todoTasks.length), bg:TODOBG, fg:TODO},
      {label:'In progress', value:String(progTasks.length), bg:PROGBG, fg:PROG},
      {label:'Complete', value:String(doneTasks.length), bg:OKBG, fg:OK},
    ].forEach((c,i)=>{
      const x = MARGIN + i*(chipW+chipGap);
      page.drawRectangle({x, y:chipY, width:chipW, height:44, color:c.bg});
      page.drawText(c.value, {x:x+12, y:chipY+22, size:16, font:bold, color:c.fg});
      page.drawText(c.label.toUpperCase(), {x:x+12, y:chipY+8, size:7, font:bold, color:c.fg, opacity:0.85});
    });
    // Overall progress bar.
    y = chipY - 22;
    const pct = allTasks.length ? Math.round((doneTasks.length/allTasks.length)*100) : 0;
    const barW = PAGE_W - 2*MARGIN;
    page.drawText('Overall progress: ' + pct + '%', {x:MARGIN, y, size:9, font:bold, color:INK});
    y -= 10;
    page.drawRectangle({x:MARGIN, y:y-8, width:barW, height:8, color:TODOBG});
    page.drawRectangle({x:MARGIN, y:y-8, width:barW*(pct/100), height:8, color:OK});
    y -= 28;

    function sectionHeader(label, color){
      currentSection = {label, color};
      if(y - 24 < 60) newPage(); // newPage() draws the header itself via currentSection
      else drawSectionHeaderText(label, color);
    }

    async function drawTaskRow(t, pillColor, pillBg){
      const taskPhotos = photosByTask[t.id] || [];
      const hasPhoto = taskPhotos.length>0;
      const blockH = hasPhoto ? 88 : 42;
      if(y - blockH < 60) newPage();
      const cardTop = y;
      page.drawRectangle({x:MARGIN, y:cardTop-blockH, width:PAGE_W-2*MARGIN, height:blockH, color:CARDBG});
      const textLeft = MARGIN + 14;
      const imgSlot = 76;
      let ty = cardTop - 20;
      const name = t.name.length>60 ? t.name.slice(0,57)+'…' : t.name;
      page.drawText(name, {x:textLeft, y:ty, size:11, font:bold, color:INK});
      const pillW = 76;
      page.drawRectangle({x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW, y:ty-3, width:pillW, height:15, color:pillBg});
      const pillLabel = t.status==='todo' ? 'TO DO' : t.status==='progress' ? 'IN PROGRESS' : 'COMPLETE';
      page.drawText(pillLabel, {x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW+8, y:ty+1, size:7.5, font:bold, color:pillColor});
      if(hasPhoto){
        ty -= 16;
        page.drawText(taskPhotos.length + ' progress photo' + (taskPhotos.length===1?'':'s') + ' on file', {x:textLeft, y:ty, size:8.5, font:reg, color:SLATE});
        const imgX = MARGIN+(PAGE_W-2*MARGIN)-16-imgSlot+8;
        const imgY = cardTop-blockH+12;
        const boxSize = 60;
        try{
          const latest = taskPhotos[taskPhotos.length-1];
          const bytes = await pdfFetchImageBytes(publicUrl('site-photos', latest.storage_path));
          if(bytes){
            let img; try{ img = await pdfDoc.embedJpg(bytes); }catch(e){ img = await pdfDoc.embedPng(bytes); }
            const dim = img.scale(1);
            const s2 = boxSize/Math.max(dim.width, dim.height);
            const w = dim.width*s2, h = dim.height*s2;
            page.drawImage(img, {x:imgX+(boxSize-w)/2, y:imgY+(boxSize-h)/2, width:w, height:h});
          }
        }catch(e){ /* skip photo if it fails to embed */ }
      }
      y = cardTop - blockH - 10;
    }

    if(todoTasks.length){
      sectionHeader('TO DO (' + todoTasks.length + ')', TODO);
      for(const t of todoTasks) await drawTaskRow(t, TODO, TODOBG);
      y -= 6;
    }
    if(progTasks.length){
      sectionHeader('IN PROGRESS (' + progTasks.length + ')', PROG);
      for(const t of progTasks) await drawTaskRow(t, PROG, PROGBG);
      y -= 6;
    }
    if(doneTasks.length){
      sectionHeader('COMPLETE (' + doneTasks.length + ')', OK);
      for(const t of doneTasks) await drawTaskRow(t, OK, OKBG);
    }

    // Media summary appendix — every progress photo on every task, not just
    // the single latest one shown on each task's row above.
    const schedulePhotoRefs = [];
    allTasks.forEach(t=>{ (photosByTask[t.id]||[]).forEach(p=>schedulePhotoRefs.push({path:p.storage_path, bucket:'site-photos'})); });
    await appendMediaSummaryPages(pdfDoc, schedulePhotoRefs);

    pdfDoc.getPages().forEach((p,idx)=>{ page = p; drawFooter((idx+1)+' of '+pdfDoc.getPageCount()); });

    const filename = exportFilename(site.name, 'Schedule of Works', 'pdf');
    pdfDoc.setTitle(filename.replace(/\.pdf$/i,''));
    const outBytes = await pdfDoc.save();
    await deliverPdf(outBytes, filename);
  }catch(e){
    console.error(e);
    toast('Could not build the PDF.');
  }
};

window.exportSignedRams = async function(ramsId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  toast('Building signed PDF…');
  const docs = await dbSelect('rams_docs', 'id=eq.'+ramsId+'&select=*');
  const doc = docs[0];
  if(!doc){ toast('Document not found.'); return; }
  const sigs = await dbSelect('rams_signatures', 'rams_id=eq.'+ramsId+'&order=signed_at.asc');
  if(!sigs.length){ toast('No signatures yet.'); return; }
  try{
    const srcBytes = await (await fetch(publicUrl('rams-docs', doc.storage_path))).arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(srcBytes, {ignoreEncryption:true});
    const disclaimer = `I have read and understood the contents of this RAMS document (${doc.name}). At all times employees must work in a safe manner both to prevent personal injury or injury/harm to others. Anything I did not understand has been explained to me to my satisfaction.`;
    const signers = sigs.map(s=>({
      name: nameOf(s.user_id),
      when: new Date(s.signed_at).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
      imagePath: s.signature_image_path,
    }));
    await drawSignatureTablePages(pdfDoc, {title: doc.name, disclaimer, signers});

    const ramsSite = SITES.find(s=>s.id===doc.site_id);
    const filename = exportFilename(ramsSite?ramsSite.name:'', doc.name+' (Signed)', 'pdf');
    pdfDoc.setTitle(filename.replace(/\.pdf$/i,''));
    const outBytes = await pdfDoc.save();
    await deliverPdf(outBytes, filename);
  }catch(e){
    console.error(e);
    toast('Could not build the signed PDF — the source file may not be a valid PDF.');
  }
};

// PM/admin-only: pushes a "please sign" notification to every operative on
// this site who is still missing a signature on at least one current RAMS
// document — nobody who has already signed everything gets pinged. The
// eligible list is worked out fresh here (not from a stale render) and the
// edge function re-checks it server-side too.
window.sendRamsSignReminder = async function(siteId){
  const {docs, sigsByDoc, assignedIds} = await fetchRamsData(siteId);
  if(!docs.length){ toast('No RAMS documents to sign.'); return; }
  const roster = assignedIds||[];
  const outstanding = roster.filter(uid => docs.some(d => !(sigsByDoc[d.id]||[]).some(s=>s.user_id===uid)));
  if(!outstanding.length){ toast('Everyone on this site has signed all RAMS documents.'); return; }
  if(!await customConfirm(`Send a sign-reminder notification to ${outstanding.length} operative${outstanding.length===1?'':'s'} who still have RAMS to sign?`)) return;
  try{
    const res = await sbFetch('/functions/v1/send-sign-reminder', {method:'POST', body: JSON.stringify({site_id:siteId, doc_type:'rams', user_ids: outstanding})});
    const d = await res.json();
    if(!res.ok || d.error){ toast('Could not send reminder — '+(d.error||res.status)); return; }
    toast(d.sent ? `Reminder sent to ${d.sent} device${d.sent===1?'':'s'}.` : 'No registered devices to notify yet.');
  }catch(e){ console.error(e); toast('Could not send reminder.'); }

/* ================= HAVS (Hand-Arm Vibration exposure) =================
   Real HSE formula (matches the government HAVS calculator, not the old
   spreadsheet's ambiguous multiplier): for a tool with vibration magnitude
   D (m/s²) used for M minutes, partial daily exposure A(8) = D x
   sqrt(M/480) (480 minutes = a full 8-hour reference day), and that
   converts to "points" as A(8)^2 x 100/6.25 — 100 points = the 2.5 m/s²
   Exposure Action Value (EAV), 400 points = the 5 m/s² Exposure Limit
   Value (ELV). Multiple tools/sessions in the same day combine by simply
   summing their points (equivalent to root-sum-squaring the A(8) values,
   the HSE-approved combination method). An operative can only log entries
   against himself; a PM/Admin can log for any operative assigned to the
   site, one after another, same as the old spreadsheet's multi-operative
   weekly grid — just with a real tool picker and a real per-day duration
   instead of a flat multiplier. */
// Capitalises the first letter of every word in a tool name (e.g. "circular
// saw" -> "Circular Saw") without touching the rest of each word, so
// existing acronyms like "SDS" are left alone. Applied whenever a tool
// name is saved, and again at display time as a safety net for any older
// data that predates this.
function titleCaseWords(str){ return String(str||'').replace(/\b\w/g, c=>c.toUpperCase()); }
function havsA8(magnitude, minutes){ return magnitude * Math.sqrt(minutes/480); }
function havsPoints(magnitude, minutes){ const a8 = havsA8(magnitude, minutes); return (a8*a8)*100/6.25; }
const HAVS_DAY_LABELS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
// Shared logo geometry for every HAVS PDF page header — fixed to the
// original (narrower) page width so the logo lands at the same horizontal
// position on every page even where a page (e.g. the calculator page) has
// been widened for its own table.
const HAVS_LOGO_SIZE = 46; // 1.2x the previous 38pt box
const HAVS_LOGO_RIGHT_X = 595.28 - 44 - HAVS_LOGO_SIZE;
let havsWeekOffset = 0;
// Days default to expanded — a manager can collapse one as they finish it,
// but that's a per-day choice they make, not something we start closed.
let havsDayOpen = {};
window.toggleHavsDay = function(di){ havsDayOpen[di] = !havsDayOpen[di]; render(); };
// Entry drafts are keyed per day+tool (each relevant tool is a preset box
// on every day). Every operative assigned to the site is listed under the
// tool automatically — a manager just tabs through and types minutes for
// whoever actually used it that day, no dropdown/ticking required — plus
// an "extraUserIds" list for the rare operative who isn't assigned to the
// site but still needs logging here. Typing a whole number and
// tabbing/blurring out of a field commits that one entry immediately —
// there is no separate "Add" step. An operative just types his own minutes
// the same way. Key = `${dayIdx}|${toolId}`.
let havsDraft2 = {};
// Starts open so a PM/operative can pick tools straight away.
let havsSiteToolPickerOpen = true;
let havsNewToolFormOpen = false;
let havsNewToolDraft = {name:'', magnitude:''};
// Inline editing of an already-logged entry's minutes.
let havsEntryEditingId = null;
let havsEntryEditDraft = {};
// Which operatives are ticked for the "Export Selected" button up top.
let havsExportSelectedIds = [];
// 'weekly' = the normal editable current/past-week view, 'completed' = the
// read-only list of weeks a manager has marked done.
let havsActiveTab = 'weekly';
window.setHavsTab = function(tab){ havsActiveTab = tab; render(); };
// Weekly Summary is a dropdown now — auto-expanded only the first time a
// given week is viewed AND it actually has entries logged; keyed by the
// week's Monday date so it re-evaluates correctly as the user pages weeks.
let havsWeeklySummaryOpenByWeek = {};
window.toggleHavsWeeklySummary = function(weekKey){ havsWeeklySummaryOpenByWeek[weekKey] = !havsWeeklySummaryOpenByWeek[weekKey]; render(); };
let havsMarkCompleteBusy = false;
let havsExportAllBusy = false;
let havsEmailAllBusy = false;
window.shiftHavsWeek = function(dir){ havsWeekOffset += dir; render(); };
function havsWeekDates(offset){
  const weekStart = startOfWeek(Date.now()) + offset*7*24*60*60*1000;
  return [0,1,2,3,4].map(i => new Date(weekStart + i*86400000));
}
// Same as havsWeekDates but from an explicit Monday (YYYY-MM-DD) rather than
// an offset from today — used by the Completed HAVS tab to re-export/email
// an arbitrary past week regardless of where havsWeekOffset currently is.
function havsWeekDatesFromStart(weekStartISO){
  const ms = new Date(weekStartISO+'T00:00:00').getTime();
  return [0,1,2,3,4].map(i => new Date(ms + i*86400000));
}
function havsWeekLabelFor(days){
  return `${days[0].toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} – ${days[4].toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`;
}
function havsDraft2For(dayIdx, toolId){
  const key = dayIdx+'|'+toolId;
  if(!havsDraft2[key]) havsDraft2[key] = {extraUserIds:[], minutesByUser:{}, addPickerOpen:false};
  return havsDraft2[key];
}
function havsWholeMinutes(raw){
  const s = (raw==null?'':String(raw)).trim();
  if(!s) return {ok:false, empty:true};
  if(!/^\d+$/.test(s)){ toast('Whole numbers only.'); return {ok:false}; }
  const n = parseInt(s, 10);
  if(n<=0 || n>480){ toast('Enter minutes between 1 and 480.'); return {ok:false}; }
  return {ok:true, minutes:n};
}
window.toggleHavsAddPicker = function(dayIdx, toolId){

};

};

};
// Best-effort: if this entry pushed the operative's total for the day past
// the EAV (100pts) or ELV (400pts) for the first time, post an automatic
// message up to the site's PM/admin — never blocks entry logging on
// failure. Only fires on the commit that actually crosses the line, not on
// every entry once already over.
async function notifyIfHavsThresholdCrossed(siteId, userId, entryDate, justToolId, justMinutes){
  try{
    const [dayEntries, tools] = await Promise.all([
      dbSelect('havs_entries', `site_id=eq.${siteId}&user_id=eq.${userId}&entry_date=eq.${entryDate}&select=tool_id,minutes`),
      dbSelect('havs_tools', 'org_id=eq.'+ME.org_id+'&select=id,vibration_magnitude'),
    ]);
    const magById = {}; tools.forEach(t=>magById[t.id]=Number(t.vibration_magnitude)||0);
    const totalPts = dayEntries.reduce((s,e)=>s+havsPoints(magById[e.tool_id]||0, e.minutes), 0);
    const justAddedPts = havsPoints(magById[justToolId]||0, justMinutes);
    const beforePts = totalPts - justAddedPts;
    const site = SITES.find(s=>s.id===siteId);
    const label = site ? site.name+': ' : '';
    const opName = nameOf(userId);
    const dateLabel = new Date(entryDate+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    if(beforePts<400 && totalPts>=400){
      await postSystemMessage(siteId, 'havs_elv_exceeded', `${label}${opName} has exceeded the daily HAVS Exposure Limit Value (ELV) on ${dateLabel} — ${totalPts.toFixed(0)} pts. Immediate action required.`);
    } else if(beforePts<100 && totalPts>=100){
      await postSystemMessage(siteId, 'havs_eav_exceeded', `${label}${opName} has passed the daily HAVS Exposure Action Value (EAV) on ${dateLabel} — ${totalPts.toFixed(0)} pts.`);
    }
  }catch(e){ /* best-effort — never blocks entry logging */ }
}
// Commits one operative's entry the moment a valid whole-number minutes
// value is tabbed/blurred out of — no "Add" button. If this entry pushed
// the operative over the EAV/ELV threshold for the day, a message is
// auto-posted to the PM/admin.
window.commitHavsDraftEntry = async function(siteId, dayIdx, toolId, userId){
  const d = havsDraft2For(dayIdx, toolId);
  const check = havsWholeMinutes(d.minutesByUser[userId]);
  if(check.empty) return;
  if(!check.ok) return;
  const date = havsWeekDates(havsWeekOffset)[dayIdx];
  const entry_date = date.toISOString().slice(0,10);
  const rows = await dbInsert('havs_entries', {org_id:ME.org_id, site_id:siteId, user_id:userId, entry_date, tool_id:toolId, minutes:check.minutes, created_by:ME.id});
  if(rows){
    delete d.minutesByUser[userId];
    toast('Entry added');
    notifyIfHavsThresholdCrossed(siteId, userId, entry_date, toolId, check.minutes);
    render();
  }
};

async function renderHavs(siteId){
  const __gen = RENDER_GEN;
  const site = SITES.find(s=>s.id===siteId);
  const canManage = isManager(ME);
  const days = havsWeekDates(havsWeekOffset);
  const weekLabel = havsWeekLabelFor(days);
  const dateFrom = days[0].toISOString().slice(0,10);
  const dateTo = days[4].toISOString().slice(0,10);

  if(havsActiveTab==='completed'){
    await renderHavsCompletedTab(siteId, site, canManage, __gen);
    return;
  }

  const [allTools, assignedRows, siteToolRows, weekCompletionRows] = await Promise.all([
    dbSelect('havs_tools', 'org_id=eq.'+ME.org_id+'&active=eq.true&order=sort_order.asc'),
    canManage ? dbSelect('site_assignments', 'site_id=eq.'+siteId+'&select=user_id') : Promise.resolve([]),
    dbSelect('site_havs_tools', 'site_id=eq.'+siteId+'&select=tool_id'),
    dbSelect('havs_weekly_completions', `site_id=eq.${siteId}&week_start=eq.${dateFrom}&select=id,completed_at,completed_by`),
  ]);
  const weekCompletion = weekCompletionRows[0] || null;
  const siteToolIds = new Set(siteToolRows.map(r=>r.tool_id));
  // Only the tools this site has been set up to use appear as boxes — an
  // org might have a dozen HAVS tools registered but only two or three are
  // relevant to any one job.
  const tools = allTools.filter(t=>siteToolIds.has(t.id));

  const operativeIds = canManage
    ? assignedRows.map(r=>r.user_id).filter(id => PROFILES[id] && PROFILES[id].role==='operative')

  const operatives = operativeIds.map(id=>PROFILES[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));

  // to cover the rare case of someone not assigned to this site.
  const allOrgOperatives = Object.values(PROFILES).filter(p=>p.role==='operative').sort((a,b)=>a.name.localeCompare(b.name));

  // Managers can see everyone's entries; an operative only ever sees (and
  // can only ever log against) himself — enforced here, not just in the UI.

    const pts = havsPoints(tool.vibration_magnitude, e.minutes);

      ${canManage ? (havsNewToolFormOpen ? `
