/* ---- HAVS PDF export — a real calculator table (Tool / Magnitude / Time /
   Partial A(8) / Points) per day, matching the government HAVS calculator's
   own layout, not just a bare log. Shared by both the individual export and
   the collective one — collective just calls the same page-drawing routine
   once per operative into the SAME document, so everyone lands in one PDF
   one after another, exactly like the old spreadsheet's single-file export. */
function pdfWrapText(font, size, text, maxWidth){
  const words = String(text==null?'':text).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(cur && font.widthOfTextAtSize(test, size) > maxWidth){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}
async function drawHavsOperativePages(pdfDoc, fonts, siteName, weekLabel, days, op, tools, toolById, entries, logoImg){
  const {bold, reg, italic, INK, SLATE, LINE, HEADBG, RED, AMBER, GREEN, BRAND, WHITE} = fonts;
  const PAGE_W = 595.28, PAGE_H = 841.89;
  const MARGIN = 44;
  const TABLE_W = PAGE_W - 2*MARGIN;
  // Widened Tool column (and shortened header labels) — long tool names
  // like "4in battery grinder (Dewalt or Makita)" were overrunning into the
  // Magnitude column at the old 148pt width and overlapping the numbers.
  // Rows now also wrap and grow in height instead of letting text run on.
  const COLS = [ // [label, width]
    ['Day', 56], ['Tool', 168], ['Mag (m/s²)', 74], ['Mins', 48], ['Partial A(8)', 84], ['Points', TABLE_W-56-168-74-48-84]
  ];
  const ROW_H = 16, HEADER_H = 20, LINE_H = 10.5;
  let page, y;
  function colX(i){ let x = MARGIN; for(let j=0;j<i;j++) x += COLS[j][1]; return x; }
  function drawHeaderBand(){
    page.drawRectangle({x:0, y:PAGE_H-80, width:PAGE_W, height:80, color:BRAND});
    if(logoImg){
      const dim = logoImg.scale(1);
      const s = HAVS_LOGO_SIZE/Math.max(dim.width, dim.height);
      const w = dim.width*s, h = dim.height*s;
      page.drawRectangle({x:HAVS_LOGO_RIGHT_X, y:PAGE_H-72, width:HAVS_LOGO_SIZE, height:HAVS_LOGO_SIZE, color:WHITE});
      page.drawImage(logoImg, {x:HAVS_LOGO_RIGHT_X+(HAVS_LOGO_SIZE-w)/2, y:PAGE_H-72+(HAVS_LOGO_SIZE-h)/2, width:w, height:h});
    }
    page.drawText('HAVS EXPOSURE REPORT', {x:MARGIN, y:PAGE_H-34, size:9, font:bold, color:WHITE, opacity:0.85});
    page.drawText(op.name, {x:MARGIN, y:PAGE_H-54, size:16, font:bold, color:WHITE, maxWidth:PAGE_W-2*MARGIN-(logoImg?HAVS_LOGO_SIZE+8:0)});
    page.drawText(siteName + ' · Week ' + weekLabel, {x:MARGIN, y:PAGE_H-70, size:9.5, font:reg, color:WHITE, opacity:0.9, maxWidth:PAGE_W-2*MARGIN-(logoImg?HAVS_LOGO_SIZE+8:0)});
  }
  function drawFooter(){
    page.drawLine({start:{x:MARGIN,y:34}, end:{x:PAGE_W-MARGIN,y:34}, thickness:0.75, color:LINE});
    page.drawText('Generated via OpHUB · ' + new Date().toLocaleString('en-GB'), {x:MARGIN, y:20, size:8, font:reg, color:SLATE});
    page.drawText('EAV (action) = 100 pts/day · ELV (limit) = 400 pts/day', {x:PAGE_W-MARGIN-220, y:20, size:8, font:reg, color:SLATE});
  }
  function drawTableHeader(){
    page.drawRectangle({x:MARGIN, y:y-HEADER_H, width:TABLE_W, height:HEADER_H, color:HEADBG});
    COLS.forEach((c,i)=>{
      const centered = i>=2;
      const tw = centered ? bold.widthOfTextAtSize(c[0], 7.5) : 0;
      const x = centered ? colX(i) + (COLS[i][1]-tw)/2 : colX(i)+6;
      page.drawText(c[0], {x, y:y-HEADER_H+6, size:7.5, font:bold, color:INK});
    });
    page.drawLine({start:{x:MARGIN,y:y-HEADER_H}, end:{x:MARGIN+TABLE_W,y:y-HEADER_H}, thickness:1, color:INK});
    y -= HEADER_H;
  }
  function newPage(){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    drawHeaderBand();
    drawFooter();
    y = PAGE_H - 100;
    drawTableHeader();
  }
  function ensureRoom(h){ if(y - h < 60){ newPage(); } }
  function drawRow(cells, opts){
    opts = opts || {};
    const size = opts.size || 8.5;
    const font = opts.bold ? bold : reg;
    const wrapped = cells.map((txt,i)=>pdfWrapText(font, size, txt, COLS[i][1]-12));
    const nLines = Math.max(1, ...wrapped.map(w=>w.length));
    const rh = Math.max(ROW_H, nLines*LINE_H + 7);
    ensureRoom(rh);
    const top = y;
    if(opts.fill) page.drawRectangle({x:MARGIN, y:top-rh, width:TABLE_W, height:rh, color:opts.fill});
    wrapped.forEach((lines,i)=>{
      // Every column is centre-aligned except Day (0) and Tool (1), which
      // stay left-aligned since they carry the longer, wrapped text.
      const centered = i>=2;
      lines.forEach((ln,li)=>{
        const tw = centered ? font.widthOfTextAtSize(ln, size) : 0;
        const x = centered ? colX(i) + (COLS[i][1]-tw)/2 : colX(i)+6;
        page.drawText(ln, {x, y:top-12-li*LINE_H, size, font, color:opts.color||INK});
      });
    });
    page.drawLine({start:{x:MARGIN,y:top-rh}, end:{x:MARGIN+TABLE_W,y:top-rh}, thickness:0.5, color:LINE});
    y = top - rh;
  }

  newPage();
  let weeklyPoints = 0;
  for(let di=0; di<days.length; di++){
    const d = days[di];
    const dateStr = d.toISOString().slice(0,10);
    const sessions = entries.filter(e=>e.user_id===op.id && e.entry_date===dateStr);
    const dayLabel = HAVS_DAY_LABELS[di] + ' ' + d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    if(!sessions.length){
      drawRow([dayLabel, 'No tool use logged', '—', '—', '—', '—'], {color:SLATE});
      continue;
    }
    let dayPoints = 0;
    sessions.forEach((e,i)=>{
      const tool = toolById[e.tool_id];
      const mag = tool ? (Number(tool.vibration_magnitude) || 0) : 0;
      const a8 = havsA8(mag, e.minutes);
      const pts = havsPoints(mag, e.minutes);
      dayPoints += pts;
      drawRow([i===0?dayLabel:'', tool?titleCaseWords(tool.name):'(removed tool)', mag.toFixed(1), e.minutes, a8.toFixed(2), pts.toFixed(1)]);
    });
    weeklyPoints += dayPoints;
    const dayColor = dayPoints>=400 ? RED : dayPoints>=100 ? AMBER : GREEN;
    drawRow(['', '', '', '', 'Daily total:', dayPoints.toFixed(1)+' pts'], {bold:true, color:dayColor});
  }
  ensureRoom(ROW_H+6);
  y -= 6;
  page.drawLine({start:{x:MARGIN,y}, end:{x:MARGIN+TABLE_W,y}, thickness:1, color:INK});
  y -= 4;
  drawRow(['', '', '', '', 'Weekly Total:', weeklyPoints.toFixed(1)+' pts'], {bold:true});
  // Note is drawn at half the normal row text size, in italics, directly
  // under the weekly total.
  ensureRoom(12);
  page.drawText('(informational — limits are daily)', {x:colX(4)+6, y:y-6, size:4.25, font:italic, color:SLATE});
  y -= 12;
  if(weeklyPoints < 500){
    ensureRoom(20);
    const boxH = 18;
    page.drawRectangle({x:MARGIN, y:y-boxH, width:TABLE_W, height:boxH, color:PDFLib.rgb(0.91,0.97,0.93)});
    page.drawText('Exposure likely to be below 2.5m/s²A(8) EAV (100 points daily)', {x:MARGIN+8, y:y-boxH+6, size:8.5, font:bold, color:GREEN, maxWidth:TABLE_W-16});
    y -= boxH;
  }
}
/* HSE HAND-ARM VIBRATION CALCULATOR reference page — a single page,
   prepended to every export, that shows the government trigger-time
   calculation for each tool currently set up in Admin Centre → HAVS Tools.
   Derived straight from the HSE exposure-points formula so it always
   tallies with the same magnitudes used to score the log itself: points
   per hour = A(8)^2 x 100/6.25 at M=60 = 2 x magnitude^2, so trigger time
   to reach N points = N / (2 x magnitude^2) hours. */
async function drawHavsCalculatorPage(pdfDoc, fonts, tools, logoImg){
  const {bold, reg, italic, INK, SLATE, LINE, HEADBG, BRAND, WHITE} = fonts;
  // Widened slightly versus the other HAVS pages — the "(100pts)"/"(400pts)"
  // note text was pushing the Time to EAV/ELV columns too tight to fit.
  const PAGE_W = 660.28, PAGE_H = 841.89;
  const MARGIN = 44;
  const TABLE_W = PAGE_W - 2*MARGIN;
  const TIME_COL_W = (TABLE_W - 210 - 80 - 75) / 2;
  const COLS = [ // [label, width, note]
    ['Tool', 210, null], ['Mag (m/s²)', 80, null], ['Pts / hour', 75, null],
    ['Time to EAV', TIME_COL_W, '(100pts)'], ['Time to ELV', TIME_COL_W, '(400pts)']
  ];
  const ROW_H = 18, HEADER_H = 22, LINE_H = 10.5;
  function colX(i){ let x = MARGIN; for(let j=0;j<i;j++) x += COLS[j][1]; return x; }
  function fmtHrs(h){
    if(!isFinite(h) || h<=0) return '—';
    const totalMin = Math.round(h*60);
    const hh = Math.floor(totalMin/60), mm = totalMin%60;
    return (hh?hh+'h ':'') + mm+'m';
  }
  // Header cells are centred (except Tool) and, where a column has a note
  // (the "(100pts)"/"(400pts)" qualifiers), the note is drawn smaller and
  // in italics right after the main label — both centred as one unit.
  function drawHeaderCell(i, headerY){
    const [label, w, note] = COLS[i];
    const mainW = bold.widthOfTextAtSize(label, 7.5);
    const noteSize = 7.5*0.85;
    const noteW = note ? italic.widthOfTextAtSize(' '+note, noteSize) : 0;
    if(i===0){
      page.drawText(label, {x:colX(i)+6, y:headerY, size:7.5, font:bold, color:INK});
      return;
    }
    const x0 = colX(i) + (w-mainW-noteW)/2;
    page.drawText(label, {x:x0, y:headerY, size:7.5, font:bold, color:INK});
    if(note) page.drawText(' '+note, {x:x0+mainW, y:headerY, size:noteSize, font:italic, color:SLATE});
  }
  let page = pdfDoc.addPage([PAGE_W, PAGE_H]);
  page.drawRectangle({x:0, y:PAGE_H-80, width:PAGE_W, height:80, color:BRAND});
  if(logoImg){
    const dim = logoImg.scale(1);
    const s = HAVS_LOGO_SIZE/Math.max(dim.width, dim.height);
    const w = dim.width*s, h = dim.height*s;
    page.drawRectangle({x:HAVS_LOGO_RIGHT_X, y:PAGE_H-72, width:HAVS_LOGO_SIZE, height:HAVS_LOGO_SIZE, color:WHITE});
    page.drawImage(logoImg, {x:HAVS_LOGO_RIGHT_X+(HAVS_LOGO_SIZE-w)/2, y:PAGE_H-72+(HAVS_LOGO_SIZE-h)/2, width:w, height:h});
  }
  page.drawText('HSE HAND-ARM VIBRATION CALCULATOR', {x:MARGIN, y:PAGE_H-34, size:9, font:bold, color:WHITE, opacity:0.85});
  page.drawText('Tool Exposure Reference', {x:MARGIN, y:PAGE_H-54, size:16, font:bold, color:WHITE});
  page.drawText('Trigger times to the Exposure Action Value (EAV) and Exposure Limit Value (ELV), per HSE methodology', {x:MARGIN, y:PAGE_H-70, size:8.5, font:reg, color:WHITE, opacity:0.9, maxWidth:PAGE_W-2*MARGIN-(logoImg?HAVS_LOGO_SIZE+8:0)});
  let y = PAGE_H - 100;
  page.drawRectangle({x:MARGIN, y:y-HEADER_H, width:TABLE_W, height:HEADER_H, color:HEADBG});
  COLS.forEach((c,i)=>drawHeaderCell(i, y-HEADER_H+7));
  page.drawLine({start:{x:MARGIN,y:y-HEADER_H}, end:{x:MARGIN+TABLE_W,y:y-HEADER_H}, thickness:1, color:INK});
  y -= HEADER_H;
  function ensureRoom(h){ if(y - h < 90){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    page.drawRectangle({x:0, y:PAGE_H-50, width:PAGE_W, height:50, color:BRAND});
    page.drawText('HSE HAND-ARM VIBRATION CALCULATOR (cont.)', {x:MARGIN, y:PAGE_H-30, size:11, font:bold, color:WHITE});
    y = PAGE_H - 70;
    page.drawRectangle({x:MARGIN, y:y-HEADER_H, width:TABLE_W, height:HEADER_H, color:HEADBG});
    COLS.forEach((c,i)=>drawHeaderCell(i, y-HEADER_H+7));
    page.drawLine({start:{x:MARGIN,y:y-HEADER_H}, end:{x:MARGIN+TABLE_W,y:y-HEADER_H}, thickness:1, color:INK});
    y -= HEADER_H;
  } }
  if(!tools.length){
    ensureRoom(ROW_H);
    page.drawText('No HAVS tools set up yet.', {x:MARGIN+6, y:y-13, size:9, font:reg, color:SLATE});
    y -= ROW_H;
  }
  // Every data column is centred except Tool, which stays left-aligned
  // since it carries the longer, wrapped tool name.
  function drawCentered(text, i, ty, size){
    const w = reg.widthOfTextAtSize(text, size);
    page.drawText(text, {x:colX(i)+(COLS[i][1]-w)/2, y:ty, size, font:reg, color:INK});
  }
  tools.forEach(t=>{
    const mag = Number(t.vibration_magnitude) || 0;
    const ptsPerHour = 2 * mag * mag;
    const eavHours = ptsPerHour>0 ? 100/ptsPerHour : Infinity;
    const elvHours = ptsPerHour>0 ? 400/ptsPerHour : Infinity;
    const nameLines = pdfWrapText(reg, 8.5, titleCaseWords(t.name), COLS[0][1]-12);
    const rh = Math.max(ROW_H, nameLines.length*LINE_H + 7);
    ensureRoom(rh);
    const top = y;
    nameLines.forEach((ln,li)=>page.drawText(ln, {x:colX(0)+6, y:top-12-li*LINE_H, size:8.5, font:reg, color:INK}));
    drawCentered(mag.toFixed(1), 1, top-12, 8.5);
    drawCentered(ptsPerHour.toFixed(1), 2, top-12, 8.5);
    drawCentered(fmtHrs(eavHours), 3, top-12, 8.5);
    drawCentered(fmtHrs(elvHours), 4, top-12, 8.5);
    page.drawLine({start:{x:MARGIN,y:top-rh}, end:{x:MARGIN+TABLE_W,y:top-rh}, thickness:0.5, color:LINE});
    y = top - rh;
  });
  ensureRoom(48);
  y -= 10;
  const note = 'Points/hour and trigger times are calculated from each tool\'s recorded vibration magnitude using the HSE exposure-points method: A(8) = magnitude x sqrt(minutes / 480); points = A(8)^2 x 100 / 6.25. Update a tool\'s magnitude in Admin Centre - HAVS Tools and this page updates to match.';
  page.drawText(note, {x:MARGIN, y, size:7.5, font:reg, color:SLATE, maxWidth:TABLE_W, lineHeight:10});
}
// Fetches the org logo once per export and embeds it into the given
// PDFDocument — every HAVS page header draws it top-right (per RTB's
// request; the app's other exports put it top-left).
async function havsFetchLogoImg(pdfDoc){
  try{
    const logoUrl = ORG && ORG.logo_path ? publicUrl('org-logos', ORG.logo_path) : null;
    if(!logoUrl) return null;
    const bytes = await pdfFetchImageBytes(logoUrl);
    if(!bytes) return null;
    try{ return await pdfDoc.embedJpg(bytes); }catch(e){ try{ return await pdfDoc.embedPng(bytes); }catch(e2){ return null; } }
  }catch(e){ return null; }
}
// Builds one HAVS PDF for an explicit week (days[0..4]) and operative list:
// Register page (matching the client's required Excel layout) first, then
// each operative's day-by-day detail pages, then the HSE calculator
// reference page last. Shared by every export/email path — current-week
// buttons pass havsWeekDates(havsWeekOffset); the Completed HAVS tab passes
// the stored week's dates instead so a past week can be re-exported exactly
// as it was.
async function buildHavsPdf(siteId, days, weekLabel, operatives, labelForFilename){
  const site = SITES.find(s=>s.id===siteId);
  const dateFrom = days[0].toISOString().slice(0,10), dateTo = days[4].toISOString().slice(0,10);
  const [tools, entries] = await Promise.all([
    dbSelect('havs_tools', 'org_id=eq.'+ME.org_id+'&select=*'),
    dbSelect('havs_entries', `site_id=eq.${siteId}&entry_date=gte.${dateFrom}&entry_date=lte.${dateTo}&order=entry_date.asc`),
  ]);
  const toolById = {}; tools.forEach(t=>toolById[t.id]=t);
  const pdfDoc = await PDFLib.PDFDocument.create();
  const fonts = await havsPdfFonts(pdfDoc);
  const logoImg = await havsFetchLogoImg(pdfDoc);
  // Per-operative day-by-day pages first (the original report design),
  // HSE Tool Exposure Reference last — the register-grid page tried in an
  // earlier revision has been dropped per feedback.
  for(const op of operatives){
    await drawHavsOperativePages(pdfDoc, fonts, site.name, weekLabel, days, op, tools, toolById, entries, logoImg);
  }
  await drawHavsCalculatorPage(pdfDoc, fonts, tools, logoImg);
  const bytes = await pdfDoc.save();
  const filename = exportFilename(site.name, 'HAVS - '+labelForFilename+' - '+weekLabel, 'pdf');
  return {bytes, filename};
}
function havsBytesToBase64(bytes){
  let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return btoa(binary);
}

async function renderMyTools(siteId){

/* ================= PUWER TOOL INSPECTION =================
   Weekly, per-operative record mirroring the HAVS week-based cadence: pick
   an operative, the matrix auto-populates one column per tool from their
   Operative Tools log, the five PUWER pass/fail questions as rows. Ticking
   defaults to UNTICKED when an operative fills their own (they must
   actively confirm each pass) and TICKED when a PM/Admin fills it on
   someone else's behalf. Un-ticking any box pops a warning that the tool
   can't be used until brought back in line with PUWER; a tool with every
   box ticked shows a green "acceptable" line. Exports as a PDF in the same
   house style as HAVS/RAMS, with a tool photo summary (photo + serial
   "Item ID") at the end. */
const PUWER_QUESTIONS = [
  {key:'q_suitability', label:'Suitability', text:'Is the tool or machine right for the specific job you are using it for?'},
  {key:'q_guarding', label:'Guarding', text:'Are all safety guards, interlocks, and protective devices present, secure, and working properly?'},
  {key:'q_controls', label:'Controls', text:'Do the start, stop, and speed controls function correctly, and are emergency stop buttons easy to reach?'},
  {key:'q_maintenance', label:'Maintenance & Condition', text:'Is there any sign of damage, excessive wear, corrosion, leaks, or electrical faults?'},
  {key:'q_markings', label:'Markings & Warnings', text:'Are all safety signs, operational instructions, and warning labels clear and easy to read?'},
];
let puwerWeekOffset = 0;
window.shiftPuwerWeek = function(dir){ puwerWeekOffset += dir; render(); };
function puwerWeekStartDate(offset){ return new Date(startOfWeek(Date.now()) + offset*7*24*60*60*1000); }
function puwerWeekStartISO(offset){ return puwerWeekStartDate(offset).toISOString().slice(0,10); }
function puwerWeekLabel(offset){
  const start = puwerWeekStartDate(offset);
  const end = new Date(start.getTime() + 4*86400000);
  return start.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' – ' + end.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

let puwerFillDraft = null; // {siteId, userId, weekStart, inspectionId, comments, tools:[{dbId, toolId, name, serial_number, photo_path, q_suitability,...}]}
let puwerFillSaving = false;
async function loadPuwerFillDraft(siteId, userId, weekStart){
  const insp = (await dbSelect('puwer_inspections', 'site_id=eq.'+siteId+'&user_id=eq.'+userId+'&week_start=eq.'+weekStart+'&select=*'))[0] || null;
  let existingTools = [];
  if(insp) existingTools = await dbSelect('puwer_inspection_tools', 'inspection_id=eq.'+insp.id+'&order=sort_order.asc');
  const ownedTools = await dbSelect('operative_tools', 'user_id=eq.'+userId+'&order=created_at.asc');
  const defaultChecked = isManager(ME);
  const existingByToolId = {};
  existingTools.forEach(t=>{ if(t.tool_id) existingByToolId[t.tool_id] = t; });
  const tools = [];
  // Keep every already-answered row, even for a tool since removed from the
  // operative's log — the inspection is a historical record, not a live view.
  existingTools.forEach(t=>{
    tools.push({dbId:t.id, toolId:t.tool_id, name:t.name, serial_number:t.serial_number, photo_path:t.photo_path,
      q_suitability:t.q_suitability, q_guarding:t.q_guarding, q_controls:t.q_controls, q_maintenance:t.q_maintenance, q_markings:t.q_markings});
  });
  // Append any tool logged since that isn't in the inspection yet.
  ownedTools.forEach(ot=>{
    if(existingByToolId[ot.id]) return;
    tools.push({dbId:null, toolId:ot.id, name:ot.name, serial_number:ot.serial_number, photo_path:ot.photo_path,
      q_suitability:defaultChecked, q_guarding:defaultChecked, q_controls:defaultChecked, q_maintenance:defaultChecked, q_markings:defaultChecked});
  });
  puwerFillDraft = {siteId, userId, weekStart, inspectionId: insp?insp.id:null, comments: insp?(insp.comments||''):'', tools};
}

window.savePuwerInspection = async function(){
  if(!puwerFillDraft) return;
  puwerFillSaving = true; render();
  const {siteId, userId, weekStart, tools, comments} = puwerFillDraft;
  let inspectionId = puwerFillDraft.inspectionId;
  if(!inspectionId){
    const rows = await dbInsert('puwer_inspections', {org_id:ME.org_id, site_id:siteId, user_id:userId, week_start:weekStart, inspected_by:ME.id, comments:comments||null});
    if(!rows){ puwerFillSaving=false; render(); return; }
    inspectionId = rows[0].id;
    puwerFillDraft.inspectionId = inspectionId;
  } else {
    await dbUpdate('puwer_inspections', inspectionId, {comments:comments||null, inspected_by:ME.id, updated_at:new Date().toISOString()});
  }
  for(let i=0;i<tools.length;i++){
    const t = tools[i];
    const payload = {q_suitability:t.q_suitability, q_guarding:t.q_guarding, q_controls:t.q_controls, q_maintenance:t.q_maintenance, q_markings:t.q_markings, sort_order:i};
    if(t.dbId){
      await dbUpdate('puwer_inspection_tools', t.dbId, payload);
    } else {
      const rows = await dbInsert('puwer_inspection_tools', Object.assign({inspection_id:inspectionId, tool_id:t.toolId, name:t.name, serial_number:t.serial_number, photo_path:t.photo_path}, payload));
      if(rows) t.dbId = rows[0].id;
    }
  }
  toast('Inspection saved');
  puwerFillSaving = false;
  render();
};
let puwerEmailBusy = false;
// Shared by Export PDF and Email PUWER Report — both build the exact same
// PDF, just differ in what happens to the bytes afterwards.
async function buildPuwerPdf(siteId, userId){
  await loadAllProfiles();
  const op = PROFILES[userId];
  const site = SITES.find(s=>s.id===siteId);
  const pdfDoc = await PDFLib.PDFDocument.create();
  const fonts = await havsPdfFonts(pdfDoc);
  const logoImg = await havsFetchLogoImg(pdfDoc);
  const weekLabel = puwerWeekLabel(puwerWeekOffset);
  await drawPuwerInspectionPage(pdfDoc, fonts, site.name, weekLabel, op, puwerFillDraft.tools, puwerFillDraft.comments, ME.name, logoImg);
  const bytes = await pdfDoc.save();
  const filename = exportFilename(site.name, 'PUWER - '+op.name+' - '+weekLabel, 'pdf');

}
window.exportPuwerInspection = async function(siteId, userId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  if(!puwerFillDraft || !puwerFillDraft.inspectionId){ toast('Save the inspection first.'); return; }
  toast('Building PDF…');

    await deliverPdf(bytes, filename);
  }catch(err){
    console.error('PUWER export failed', err);
    toast('Export failed — '+(err && err.message ? err.message : 'unknown error'));
  }
};
window.emailPuwerInspection = async function(siteId, userId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  if(!puwerFillDraft || !puwerFillDraft.inspectionId){ toast('Save the inspection first.'); return; }
  puwerEmailBusy = true; render();
  toast('Building PDF…');
  try{
    const {bytes, filename, site, op, weekLabel} = await buildPuwerPdf(siteId, userId);
    let binary=''; const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
    const content_base64 = btoa(binary);
    const res = await sbFetch('/functions/v1/send-puwer-email', {method:'POST', body: JSON.stringify({site_id:siteId, filename, content_base64, week_label:weekLabel, operative_name:op.name})});
    const d = await res.json();
    if(!res.ok || d.error){ toast('Email failed — '+(d.error||res.status)); }
    else toast('PUWER report emailed to '+ME.email);
  }catch(err){
    console.error('PUWER email failed', err);
    toast('Email failed — '+(err && err.message ? err.message : 'unknown error'));
  }
  puwerEmailBusy = false; render();
};
// Read-only fetch of one operative's saved inspection for a given week —
// used by the multi-operative exports below, which build straight from the
// database rather than from puwerFillDraft (which only ever holds one
// operative at a time).
async function loadPuwerInspectionForExport(siteId, userId, weekStart){
  const insp = (await dbSelect('puwer_inspections', 'site_id=eq.'+siteId+'&user_id=eq.'+userId+'&week_start=eq.'+weekStart+'&select=*'))[0] || null;
  if(!insp) return {tools:[], comments:'', hasInspection:false};
  const tools = await dbSelect('puwer_inspection_tools', 'inspection_id=eq.'+insp.id+'&order=sort_order.asc');
  return {tools, comments: insp.comments||'', hasInspection:true};
}
// Shared by "Export All", "Export Selected" and per-row Export — builds one
// PDF with one operative's inspection page-set per operative, mirroring
// buildHavsPdf's multi-operative loop.
async function buildPuwerCollectivePdf(siteId, operatives, labelForFilename){
  const site = SITES.find(s=>s.id===siteId);
  const weekStart = puwerWeekStartISO(puwerWeekOffset);
  const weekLabel = puwerWeekLabel(puwerWeekOffset);
  const pdfDoc = await PDFLib.PDFDocument.create();
  const fonts = await havsPdfFonts(pdfDoc);
  const logoImg = await havsFetchLogoImg(pdfDoc);
  for(const op of operatives){
    const {tools, comments, hasInspection} = await loadPuwerInspectionForExport(siteId, op.id, weekStart);
    await drawPuwerInspectionPage(pdfDoc, fonts, site.name, weekLabel, op, tools, comments, ME.name, logoImg, hasInspection);
  }
  const bytes = await pdfDoc.save();
  const filename = exportFilename(site.name, 'PUWER - '+labelForFilename+' - '+weekLabel, 'pdf');
  return {bytes, filename, weekLabel};
}
async function puwerResolveAllOperatives(siteId){
  await loadAllProfiles();

}

window.emailPuwerCollective = async function(siteId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  puwerEmailAllBusy = true; render();
  try{
    const operatives = await puwerResolveAllOperatives(siteId);
    if(!operatives.length){ toast('No operatives to email.'); }
    else{
      const {bytes, filename, weekLabel} = await buildPuwerCollectivePdf(siteId, operatives, 'All Operatives');
      let binary=''; const chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
      const content_base64 = btoa(binary);
      const res = await sbFetch('/functions/v1/send-puwer-email', {method:'POST', body: JSON.stringify({site_id:siteId, filename, content_base64, week_label:weekLabel})});
      const d = await res.json();
      if(!res.ok || d.error){ toast('Email failed — '+(d.error||res.status)); }
      else toast('PUWER register emailed to '+ME.email);
    }
  }catch(err){
    console.error('PUWER collective email failed', err);
    toast('Email failed — '+(err && err.message ? err.message : 'unknown error'));
  }
  puwerEmailAllBusy = false; render();
};

// House-style PDF page — header band + logo top-right like HAVS/RAMS, a
// question x tool matrix, comments, then a Tool Photo Summary (photo +
// serial "Item ID") per tool at the end, mirroring the layout of RTB's
// existing PUWER export.
async function drawPuwerInspectionPage(pdfDoc, fonts, siteName, weekLabel, op, tools, comments, inspectedByName, logoImg, hasInspection){
  if(hasInspection === undefined) hasInspection = true;
  const {bold, reg, italic, INK, SLATE, LINE, HEADBG, RED, GREEN, BRAND, WHITE} = fonts;
  const PAGE_W = 595.28, PAGE_H = 841.89;
  const MARGIN = 44;
  const TABLE_W = PAGE_W - 2*MARGIN;
  let page, y;
  function drawHeaderBand(){
    page.drawRectangle({x:0, y:PAGE_H-80, width:PAGE_W, height:80, color:BRAND});
    if(logoImg){
      const dim = logoImg.scale(1);
      const s = HAVS_LOGO_SIZE/Math.max(dim.width, dim.height);
      const w = dim.width*s, h = dim.height*s;
      page.drawRectangle({x:HAVS_LOGO_RIGHT_X, y:PAGE_H-72, width:HAVS_LOGO_SIZE, height:HAVS_LOGO_SIZE, color:WHITE});
      page.drawImage(logoImg, {x:HAVS_LOGO_RIGHT_X+(HAVS_LOGO_SIZE-w)/2, y:PAGE_H-72+(HAVS_LOGO_SIZE-h)/2, width:w, height:h});
    }
    page.drawText('PUWER TOOL INSPECTION', {x:MARGIN, y:PAGE_H-34, size:9, font:bold, color:WHITE, opacity:0.85});
    page.drawText(op.name, {x:MARGIN, y:PAGE_H-54, size:16, font:bold, color:WHITE, maxWidth:PAGE_W-2*MARGIN-(logoImg?HAVS_LOGO_SIZE+8:0)});
    page.drawText(siteName + ' · Week ' + weekLabel, {x:MARGIN, y:PAGE_H-70, size:9.5, font:reg, color:WHITE, opacity:0.9, maxWidth:PAGE_W-2*MARGIN-(logoImg?HAVS_LOGO_SIZE+8:0)});
  }
  function drawFooter(){
    page.drawLine({start:{x:MARGIN,y:34}, end:{x:PAGE_W-MARGIN,y:34}, thickness:0.75, color:LINE});
    page.drawText('Generated via OpHUB · ' + new Date().toLocaleString('en-GB'), {x:MARGIN, y:20, size:8, font:reg, color:SLATE});
  }
  function newPage(){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    drawHeaderBand();
    drawFooter();
    y = PAGE_H - 100;
  }
  function ensureRoom(h){ if(y - h < 60){ newPage(); } }
  newPage();

  if(!hasInspection){
    ensureRoom(20);
    page.drawText('No PUWER inspection recorded this week.', {x:MARGIN, y, size:10, font:italic, color:SLATE});
    return;
  }

  const QCOL_W = 150;
  const toolColW = tools.length ? (TABLE_W - QCOL_W)/tools.length : 0;
  const HEADER_H = 28;
  function colX(i){ return i===0 ? MARGIN : MARGIN + QCOL_W + (i-1)*toolColW; }

  if(tools.length){
    ensureRoom(HEADER_H+10);
    page.drawRectangle({x:MARGIN, y:y-HEADER_H, width:TABLE_W, height:HEADER_H, color:HEADBG});
    page.drawText('Question', {x:MARGIN+6, y:y-HEADER_H+10, size:8, font:bold, color:INK});
    tools.forEach((t,i)=>{
      const wrapped = pdfWrapText(bold, 8, t.name, toolColW-10).slice(0,2);
      wrapped.forEach((ln,li)=>{
        const tw = bold.widthOfTextAtSize(ln, 8);
        page.drawText(ln, {x:colX(i+1)+(toolColW-tw)/2, y:y-HEADER_H+18-li*10, size:8, font:bold, color:INK});
      });
    });
    page.drawLine({start:{x:MARGIN,y:y-HEADER_H}, end:{x:MARGIN+TABLE_W,y:y-HEADER_H}, thickness:1, color:INK});
    y -= HEADER_H;

    PUWER_QUESTIONS.forEach(q=>{
      const wrapped = pdfWrapText(reg, 7.5, q.text, QCOL_W-12);
      const rh = Math.max(24, 12 + wrapped.length*9.5);
      ensureRoom(rh);
      const top = y;
      page.drawText(q.label, {x:MARGIN+6, y:top-11, size:8.5, font:bold, color:INK});
      wrapped.forEach((ln,li)=>{ page.drawText(ln, {x:MARGIN+6, y:top-22-li*9.5, size:7.5, font:reg, color:SLATE}); });
      tools.forEach((t,i)=>{
        const mark = t[q.key] ? '✓' : '✗';
        const markColor = t[q.key] ? GREEN : RED;
        const tw = bold.widthOfTextAtSize(mark, 11);
        page.drawText(mark, {x:colX(i+1)+(toolColW-tw)/2, y:top-rh/2-4, size:11, font:bold, color:markColor});
      });
      page.drawLine({start:{x:MARGIN,y:top-rh}, end:{x:MARGIN+TABLE_W,y:top-rh}, thickness:0.5, color:LINE});
      y = top - rh;
    });
    {
      const rh = 26;
      ensureRoom(rh);
      const top = y;
      page.drawText('Status', {x:MARGIN+6, y:top-16, size:8.5, font:bold, color:INK});
      tools.forEach((t,i)=>{
        const pass = PUWER_QUESTIONS.every(q=>t[q.key]);
        const label = pass ? 'Acceptable' : 'Cannot be used';
        const color = pass ? GREEN : RED;
        const tw = bold.widthOfTextAtSize(label, 7.5);
        page.drawText(label, {x:colX(i+1)+(toolColW-tw)/2, y:top-16, size:7.5, font:bold, color});
      });
      page.drawLine({start:{x:MARGIN,y:top-rh}, end:{x:MARGIN+TABLE_W,y:top-rh}, thickness:1, color:INK});
      y = top - rh;
    }
    const allPass = tools.every(t=>PUWER_QUESTIONS.every(q=>t[q.key]));
    y -= 6;
    ensureRoom(20);
    const boxH = 18;
    if(allPass){
      page.drawRectangle({x:MARGIN, y:y-boxH, width:TABLE_W, height:boxH, color:PDFLib.rgb(0.91,0.97,0.93)});
      page.drawText('All tools inspected are acceptable for use.', {x:MARGIN+8, y:y-boxH+6, size:8.5, font:bold, color:GREEN});
    } else {
      page.drawRectangle({x:MARGIN, y:y-boxH, width:TABLE_W, height:boxH, color:PDFLib.rgb(0.98,0.92,0.92)});
      page.drawText('One or more tools cannot be used until brought in line with PUWER regulations.', {x:MARGIN+8, y:y-boxH+6, size:8.5, font:bold, color:RED, maxWidth:TABLE_W-16});
    }
    y -= boxH;
  }

  y -= 14;
  ensureRoom(24);
  page.drawText('Any Other Comments', {x:MARGIN, y, size:9, font:bold, color:INK});
  y -= 14;
  const commentLines = pdfWrapText(reg, 8.5, comments || '—', TABLE_W);
  commentLines.forEach(ln=>{ ensureRoom(12); page.drawText(ln, {x:MARGIN, y, size:8.5, font:reg, color:INK}); y -= 12; });

  y -= 10;
  ensureRoom(20);
  page.drawText('Inspected by ' + inspectedByName + ' · ' + new Date().toLocaleDateString('en-GB'), {x:MARGIN, y, size:8.5, font:italic, color:SLATE});
  y -= 20;

  if(tools.length){
    ensureRoom(24);
    page.drawText('TOOL PHOTO SUMMARY', {x:MARGIN, y, size:11, font:bold, color:INK});
    y -= 18;
    for(let i=0;i<tools.length;i++){
      const t = tools[i];
      const pass = PUWER_QUESTIONS.every(q=>t[q.key]);
      ensureRoom(160);
      page.drawText('Tool '+(i+1)+': '+t.name, {x:MARGIN, y, size:10, font:bold, color:INK});
      y -= 14;
      page.drawText('Item ID: '+(t.serial_number||'—'), {x:MARGIN, y, size:8.5, font:reg, color:SLATE});
      y -= 12;
      let imgH = 0;
      if(t.photo_path){
        try{
          const bytes = await pdfFetchImageBytes(publicUrl('operative-tools', t.photo_path));
          if(bytes){
            let img; try{ img = await pdfDoc.embedJpg(bytes); }catch(e){ img = await pdfDoc.embedPng(bytes); }
            const dim = img.scale(1);
            const maxW = 140, maxH = 105;
            const s = Math.min(maxW/dim.width, maxH/dim.height, 1);
            const w = dim.width*s, h = dim.height*s;
            ensureRoom(h+10);
            page.drawImage(img, {x:MARGIN, y:y-h, width:w, height:h});
            imgH = h;
          }
        }catch(e){}
      }
      const boxY = y - Math.max(imgH, 20);
      const boxW = 200, boxH2 = 16;
      page.drawRectangle({x:MARGIN+160, y:y-boxH2, width:boxW, height:boxH2, color: pass ? GREEN : RED});
      page.drawText(pass ? 'Compliant' : 'Non-Compliant', {x:MARGIN+168, y:y-boxH2+5, size:8.5, font:bold, color:WHITE});
      y = boxY - 14;
      if(!pass){
        const warnLines = pdfWrapText(italic, 7.5, 'Cannot be used until brought in line with PUWER regulations.', TABLE_W);
        warnLines.forEach(ln=>{ ensureRoom(10); page.drawText(ln, {x:MARGIN, y, size:7.5, font:italic, color:RED}); y -= 10; });
      }
      y -= 8;
      page.drawLine({start:{x:MARGIN,y}, end:{x:MARGIN+TABLE_W,y}, thickness:0.5, color:LINE});
      y -= 10;
    }
  }
}

/* ================= DAILY BRIEFINGS =================
   Uses the same templated Report system as Reports (a template with
   sections/items, filled per site — see SITE REPORTS below) but any
   template flagged is_daily_briefing surfaces here instead of Reports.
   Adds a document-level "issue for signing" step (every operative on the
   app can then tap to sign it, mirroring RAMS) and exports exactly like
   RAMS — a PDF with a signature table appended — except issuing is never
   compulsory: a briefing a PM has simply completed can be exported with
   zero signatures. */
let briefingPickerOpen = false;
let briefingTemplatesManageOpen = false;
async function renderDailyBriefings(siteId){
  const __gen = RENDER_GEN;
  const site = SITES.find(s=>s.id===siteId);
  const canManage = isManager(ME);
  const allTemplates = canManage ? await dbSelect('report_templates', 'org_id=eq.'+ME.org_id+'&archived=eq.false&order=name.asc') : [];

  let submissions = [];
  if(templates.length){
    const ids = templates.map(t=>t.id).join(',');
    submissions = await dbSelect('report_submissions', 'site_id=eq.'+siteId+'&template_id=in.('+ids+')&order=submitted_at.desc');
  }
  await loadAllProfiles();
  let sigsBySubmission = {};
  if(submissions.length){
    const subIds = submissions.map(s=>s.id).join(',');
    const sigs = await dbSelect('daily_briefing_signatures', 'submission_id=in.('+subIds+')');
    sigs.forEach(s=>{ (sigsBySubmission[s.submission_id]=sigsBySubmission[s.submission_id]||[]).push(s); });
  }
  if(__gen === RENDER_GEN){ document.getElementById('app').innerHTML = shell(`
    ${canManage ? `
      <div class="ddrow" style="margin-top:0;" onclick="briefingTemplatesManageOpen=!briefingTemplatesManageOpen;render()"><span class="arrow">${briefingTemplatesManageOpen?'▼':'▶'}</span> Daily Briefing Templates (${templates.length})</div>
      ${briefingTemplatesManageOpen ? `
        <div class="card">
          ${templates.map(t=>`
            <div class="sitecard">
              <div class="info"><div class="name">${escapeHtml(t.name)}</div>${t.description?`<div class="addr">${escapeHtml(t.description)}</div>`:''}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${ME.role==='admin' ? `<button class="ghostbtn" style="width:auto;padding:8px 12px;" onclick="openTemplateEditor('${t.id}',null,'#/site/${siteId}/hs/briefings')">Edit</button>` : ''}
                <button class="ghostbtn" style="width:auto;padding:8px 12px;color:var(--warn);" onclick="removeTemplateFromDailyBriefings('${siteId}','${t.id}')">Remove</button>
              </div>
            </div>
          `).join('') || `<div class="empty">No Daily Briefing templates yet.</div>`}
          <button class="darkbtn" style="margin-top:10px;" onclick="createDailyBriefingTemplate('${siteId}')">+ New Daily Briefing Template</button>
        </div>
      ` : ''}
      <button class="darkbtn" style="margin:14px 0 10px;" onclick="briefingPickerOpen=!briefingPickerOpen;render()">${briefingPickerOpen?'Cancel':'+ New Briefing'}</button>
      ${briefingPickerOpen ? `
        <div class="card" style="margin-bottom:14px;">
          <p class="stub" style="margin:0 0 8px;">Pick a Daily Briefing template to start:</p>
          ${templates.map(t=>`
            <div class="sitecard">
              <div class="info"><div class="name">${escapeHtml(t.name)}</div>${t.description?`<div class="addr">${escapeHtml(t.description)}</div>`:''}</div>
              <button class="darkbtn" style="width:auto;padding:8px 14px;" onclick="startBriefing('${siteId}','${t.id}')">Start</button>
            </div>
          `).join('') || `<div class="empty">No Daily Briefing templates yet — use "Daily Briefing Templates" above to create or add one.</div>`}
        </div>
      ` : ''}
    ` : ''}
    ${submissions.map(s=>{
      const sigs = sigsBySubmission[s.id]||[];
      const mine = sigs.find(x=>x.user_id===ME.id);
      const needsMySignature = s.issued_at && s.status==='completed' && !mine;
      return `
      <div class="sitecard" style="flex-wrap:wrap;">
        <div class="info" style="cursor:pointer;" onclick="go('#/site/${siteId}/hs/briefings/${s.status==='in_progress'?'fill':'view'}/${s.id}')">
          <div class="name">${escapeHtml(s.template_name)}</div>
          <div class="addr">${s.status==='in_progress' ? 'Started' : 'Completed'} ${new Date(s.submitted_at).toLocaleString('en-GB')} · ${escapeHtml(nameOf(s.submitted_by))}</div>
          <div class="addr">${s.issued_at ? `Issued for signing · ${sigs.length} signed` : 'Not issued for signing'}</div>
        </div>
        <span class="statustag2 ${REPORT_STATUS_CLASS[s.status]||'closed'}">${REPORT_STATUS_LABEL[s.status]||s.status}</span>
        ${s.status==='in_progress' && ME.role==='admin' ? `<div class="taskicon danger" style="flex:0 0 auto;" onclick="deleteBriefingSubmission('${siteId}','${s.id}')">🗑</div>` : ''}
      </div>
      ${needsMySignature ? `
        <div class="siglinebox" style="cursor:pointer;margin:-6px 0 10px;" onclick="signBriefing('${siteId}','${s.id}')">Tap to sign — ${escapeHtml(s.template_name)}</div>
      ` : ''}
    `;}).join('') || `<div class="empty">No Daily Briefings yet${templates.length?'.':' — set up a Daily Briefing template first.'}</div>`}
  `, {title:'Daily Briefings', subtitle:site.name, back:`#/site/${siteId}/hs`, siteId, activeTab:'more'}); }
}
window.deleteBriefingSubmission = async function(siteId, submissionId){
  if(!await customConfirm('Delete this in-progress briefing? This can\'t be undone.')) return;
  const ok = await dbDelete('report_submissions', submissionId);
  if(ok){ toast('Briefing deleted'); render(); }
};
window.startBriefing = async function(siteId, templateId){
  const rows = await dbSelect('report_templates', 'id=eq.'+templateId+'&limit=1');
  const t = rows[0];
  if(!t){ toast('Template not found'); return; }
  const answers = {};
  const site = SITES.find(s=>s.id===siteId);
  (t.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{
    if(!it.autofill) return;
    const v = autofillValue(it.autofill, site);
    if(v!==undefined) answers[it.id] = v;
  }));
  const inserted = await dbInsert('report_submissions', {
    template_id: t.id, org_id: ME.org_id, site_id: siteId,
    template_name: t.name, sections: t.sections, answers,
    submitted_by: ME.id, status:'in_progress',
  });
  if(inserted && inserted[0]){
    reportFillDraft = null;
    briefingPickerOpen = false;
    toast('Briefing started');
    go(`#/site/${siteId}/hs/briefings/fill/${inserted[0].id}`);
  }
};
window.issueBriefing = async function(siteId, submissionId){
  if(!await customConfirm('Issue this briefing for signing? Every operative in the app will be able to sign it — this is optional and can still be exported without any signatures.')) return;
  const row = await dbUpdate('report_submissions', submissionId, {issued_at:new Date().toISOString(), issued_by:ME.id});
  if(row){ toast('Briefing issued for signing'); render(); }
};
window.signBriefing = async function(siteId, submissionId){
  if(!ME.signature_path){
    toast('Adopt your signature first — one tap and it\'s used everywhere.');
    go('#/signature');
    return;
  }
  const rows = await dbInsert('daily_briefing_signatures', {submission_id:submissionId, user_id:ME.id, signature_image_path:ME.signature_path});
  if(rows){ toast('Signed'); render(); }
};
window.exportDailyBriefingPDF = async function(submissionId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  toast('Building PDF…');
  const built = await buildReportPdf(submissionId);
  if(!built) return;
  try{
    const sigs = await dbSelect('daily_briefing_signatures', 'submission_id=eq.'+submissionId+'&order=signed_at.asc');
    if(sigs.length){
      const pdfDoc = await PDFLib.PDFDocument.load(built.bytes);
      const signers = sigs.map(s=>({
        name: nameOf(s.user_id),
        when: new Date(s.signed_at).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
        imagePath: s.signature_image_path,
      }));
      await drawSignatureTablePages(pdfDoc, {title: built.sub.template_name, disclaimer: `I confirm I have read and understood the contents of this briefing (${built.sub.template_name}).`, signers});
      const outBytes = await pdfDoc.save();
      await deliverPdf(outBytes, built.filename);
      return;
    }
    await deliverPdf(built.bytes, built.filename);
  }catch(e){
    console.error(e);
    toast('Could not build the signed PDF.');
  }
};

/* ================= TOOLBOX TALKS =================
   PMs upload a weekly PDF as "Bank TBT", then tap "Issue for Signing" to make
   it the one Live TBT — operatives only ever see the currently-live talk plus
   any they've personally already signed (enforced in the RLS policy on
   toolbox_talks, not just hidden client-side). Signing uses the same adopted
   signature as RAMS, and once complete a PM can export a signed PDF just like
   RAMS. */
let tbtFilter = 'live'; // PM tab state: bank | live | completed
let selectedTbtIds = new Set(); // ticked toolbox talks in the Completed tab, for a combined email
window.toggleTbtSelect = function(id){
  if(selectedTbtIds.has(id)) selectedTbtIds.delete(id); else selectedTbtIds.add(id);
  render();
};
const TBT_STATUS_LABEL = {bank:'BANK', live:'LIVE', completed:'COMPLETED'};
const TBT_STATUS_CLASS = {bank:'pending', live:'open', completed:'closed'};
async function renderToolboxTalks(siteId){
  const __gen = RENDER_GEN;
  const site = SITES.find(s=>s.id===siteId);
  const isPM = isManager(ME);
  const talks = await dbSelect('toolbox_talks', 'site_id=eq.'+siteId+'&order=created_at.desc');
  await loadAllProfiles();
  let sigCounts = {};
  if(isPM && talks.length){
    const ids = talks.map(t=>t.id).join(',');
    const sigs = await dbSelect('toolbox_talk_signatures', 'tbt_id=in.('+ids+')&select=tbt_id');
    sigs.forEach(s=>{ sigCounts[s.tbt_id] = (sigCounts[s.tbt_id]||0)+1; });
  }
  const visibleTalks = isPM ? talks.filter(t=>t.status===tbtFilter) : talks;
  if(__gen === RENDER_GEN){ document.getElementById('app').innerHTML = shell(`
    ${isPM ? `
    <div class="filterrow">
      <div class="filterchip ${tbtFilter==='bank'?'active':''}" onclick="tbtFilter='bank';selectedTbtIds=new Set();render()">Bank TBT</div>
      <div class="filterchip ${tbtFilter==='live'?'active':''}" onclick="tbtFilter='live';selectedTbtIds=new Set();render()">Live TBT</div>
      <div class="filterchip ${tbtFilter==='completed'?'active':''}" onclick="tbtFilter='completed';selectedTbtIds=new Set();render()">Completed TBT</div>
    </div>
    ` : ''}

    ${isPM && tbtFilter==='completed' && selectedTbtIds.size>0 ? `
      <button class="darkbtn" style="margin-bottom:10px;" onclick="openEmailSelectedTbtsPrompt('${siteId}')">✉ Email ${selectedTbtIds.size} Selected (individual PDFs, one email)</button>
    ` : ''}
    ${visibleTalks.map(t=>`
      <div class="card" style="margin-bottom:10px;" onclick="${isPM && tbtFilter==='completed' ? `toggleTbtSelect('${t.id}')` : `go('#/site/${siteId}/hs/tbt/${t.id}')`}">
        <div class="top" style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
            ${isPM && tbtFilter==='completed' ? `<input type="checkbox" style="width:17px;height:17px;flex:0 0 17px;margin-top:2px;" ${selectedTbtIds.has(t.id)?'checked':''} onclick="event.stopPropagation();toggleTbtSelect('${t.id}')">` : ''}

// Once every operative assigned to this site has signed a live TBT, close it
// automatically and email a signed copy to the responsible PM (or every
// PM/admin if no one's been set as this site's owner) — best-effort, never
// blocks the signing flow itself if anything here fails.
async function maybeAutoCompleteToolboxTalk(siteId, tbtId){
  try{
    const [assigned, sigs] = await Promise.all([
      dbSelect('site_assignments', 'site_id=eq.'+siteId+'&select=user_id'),
      dbSelect('toolbox_talk_signatures', 'tbt_id=eq.'+tbtId+'&select=user_id'),
    ]);
    if(!assigned.length) return; // nobody assigned to compare against yet
    const signedIds = new Set(sigs.map(s=>s.user_id));
    if(!assigned.every(a=>signedIds.has(a.user_id))) return;
    const row = await dbUpdate('toolbox_talks', tbtId, {status:'completed'});
    if(row){
      toast('Everyone has signed — TBT closed automatically');
      await emailCompletedTbtToPM(siteId, tbtId);
    }
  }catch(e){ /* best-effort */ }
}

window.confirmEmailSelectedTbts = async function(siteId){
  const input = document.getElementById('tbtEmailAddressInput');
  const email = input ? input.value.trim() : '';
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Enter a valid email address.'); return; }
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }

  if(btn){ btn.disabled = true; btn.textContent = 'Building PDFs…'; }
  const ids = Array.from(selectedTbtIds);
  const attachments = [];
  const titles = [];
  let skipped = 0;
  for(const id of ids){
    try{
      const built = await buildSignedToolboxTalkPdfBytes(id);
      if(!built){ skipped++; continue; }
      let binary=''; const chunk=0x8000;
      for(let i=0;i<built.outBytes.length;i+=chunk) binary += String.fromCharCode.apply(null, built.outBytes.subarray(i,i+chunk));
      attachments.push({filename: built.filename, content: btoa(binary)});
      titles.push(built.talk.title);
    }catch(e){ console.error(e); skipped++; }
  }
  if(!attachments.length){
    toast('None of the selected talks have signatures to build a PDF from.');
    if(btn){ btn.disabled = false; btn.textContent = 'Confirm & Send'; }
    return;
  }
  if(btn) btn.textContent = 'Sending…';
  const site = SITES.find(s=>s.id===siteId);
  try{
    const res = await sbFetch('/functions/v1/send-tbt-completion', {method:'POST', body: JSON.stringify({
      site_id: siteId, recipients:[email], site_name: site?site.name:'', tbt_titles: titles, attachments,
    })});

    if(res.ok && !d.error){
      const skipNote = skipped ? `<p class="stub" style="margin:0 0 12px;color:var(--warn);">${skipped} selected talk${skipped>1?'s were':' was'} skipped — no signatures yet.</p>` : '';

      } else { selectedTbtIds = new Set(); render(); }
    } else {
      console.error('send-tbt-completion failed:', d.error || res.status);
      toast('Email failed — '+(d.error ? String(d.error).slice(0,140) : 'try again.'));
      if(btn){ btn.disabled = false; btn.textContent = 'Confirm & Send'; }
    }
  }catch(e){
    console.error(e);
    toast('Email failed — could not reach the server.');
    if(btn){ btn.disabled = false; btn.textContent = 'Confirm & Send'; }
  }

window.setToolboxTalkStatus = async function(siteId, tbtId, newStatus){
  if(newStatus==='live'){
    // Only one toolbox talk is ever "live" per site at a time — automatically
    // mark any other live talk at this site as completed first.
    const others = await dbSelect('toolbox_talks', 'site_id=eq.'+siteId+'&status=eq.live&select=id');
    for(const o of others){ await dbUpdate('toolbox_talks', o.id, {status:'completed'}); }

    // Issuing a Bank TBT for signing makes an independent live copy rather
    // than converting the bank item in place — that way the original stays
    // in Bank TBT, ready to reuse next time (e.g. next week's toolbox talk),
    // and signatures attach only to the live copy that was actually issued.
    const rows = await dbSelect('toolbox_talks', 'id=eq.'+tbtId+'&select=*');
    const source = rows && rows[0];
    if(!source){ toast('Toolbox talk not found.'); return; }
    if(source.status==='bank'){
      const created = await dbInsert('toolbox_talks', {site_id:siteId, org_id:source.org_id, title:source.title, storage_path:source.storage_path, status:'live', created_by:ME.id});
      if(created && created[0]){
        tbtFilter = 'live';
        toast('Issued for signing — original kept in Bank TBT for reuse');
        go(`#/site/${siteId}/hs/tbt/${created[0].id}`);
      }
      return;
    }
  }
  const row = await dbUpdate('toolbox_talks', tbtId, {status:newStatus});
  if(row){
    tbtFilter = newStatus;
    toast(newStatus==='live' ? 'Issued for signing' : 'Marked as completed');
    render();
  }
};
window.deleteToolboxTalk = async function(siteId, tbtId, storagePath){
  if(!await customConfirm('Delete this toolbox talk and all its signatures? This can\'t be undone.')) return;
  const ok = await dbDelete('toolbox_talks', tbtId);
  if(ok){
    // The same PDF can be shared by several talks now — the Bank TBT
    // original, the live copy issued from it, and copies pre-loaded into
    // other sites all point at the same storage_path. Only remove the
    // actual file once nothing else references it, otherwise deleting one
    // copy would break the document link on every other copy.
    try{
      const stillUsed = await dbSelect('toolbox_talks', 'storage_path=eq.'+encodeURIComponent(storagePath)+'&select=id&limit=1');
      const stillUsedAsTemplate = await dbSelect('tbt_templates', 'storage_path=eq.'+encodeURIComponent(storagePath)+'&select=id&limit=1');
      if(!stillUsed.length && !stillUsedAsTemplate.length){
        await sbFetch('/storage/v1/object/rams-docs/'+storagePath, {method:'DELETE'});
      }
    }catch(e){ /* non-fatal — the file being left behind is harmless */ }
    toast('Toolbox talk deleted');
    go(`#/site/${siteId}/hs/tbt`);
  }
};
// Shared by exportSignedToolboxTalk (manual export) and the auto-complete
// email below — builds the signed-copy PDF and hands back its bytes without
// delivering it anywhere, so both callers can decide what to do with it.
async function buildSignedToolboxTalkPdfBytes(tbtId){
  if(typeof PDFLib==='undefined') return null;
  const rows = await dbSelect('toolbox_talks', 'id=eq.'+tbtId+'&select=*');
  const talk = rows[0];
  if(!talk) return null;
  const sigs = await dbSelect('toolbox_talk_signatures', 'tbt_id=eq.'+tbtId+'&order=signed_at.asc');
  if(!sigs.length) return null;
  await loadAllProfiles();
  const srcBytes = await (await fetch(publicUrl('rams-docs', talk.storage_path))).arrayBuffer();
  const pdfDoc = await PDFLib.PDFDocument.load(srcBytes, {ignoreEncryption:true});
  const disclaimer = `I have read and understood the contents of this Toolbox Talk (${talk.title}). At all times employees must work in a safe manner both to prevent personal injury or injury/harm to others. Anything I did not understand has been explained to me to my satisfaction.`;
  const signers = sigs.map(s=>({
    name: nameOf(s.user_id),
    when: new Date(s.signed_at).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    imagePath: s.signature_image_path,
  }));
  await drawSignatureTablePages(pdfDoc, {title: talk.title, disclaimer, signers});

  const tbtSite = SITES.find(s=>s.id===talk.site_id);
  const filename = exportFilename(tbtSite?tbtSite.name:'', talk.title+' (Signed)', 'pdf');
  pdfDoc.setTitle(filename.replace(/\.pdf$/i,''));
  const outBytes = await pdfDoc.save();
  return {outBytes, filename, talk};
}
window.exportSignedToolboxTalk = async function(tbtId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  toast('Building signed PDF…');
  try{
    const built = await buildSignedToolboxTalkPdfBytes(tbtId);
    if(!built){ toast('No signatures yet.'); return; }
    await deliverPdf(built.outBytes, built.filename);
  }catch(e){
    console.error(e);
    toast('Could not build the signed PDF — the source file may not be a valid PDF.');
  }
};

// Supplier duplicate detection — company names get typed inconsistently
// (case, punctuation, "Ltd"/"Limited", or plain typos), so a straight
// string-equality check misses obvious dupes. Two tiers:
//  - "blocked": normalized-identical, OR a 1-character edit apart on a
//    reasonably long name (e.g. "Alltype" vs "altype") — this is almost
//    certainly the same company typed slightly differently, so it's never
//    allowed, no override.
//  - "warn": more loosely similar (shared prefix/substring, or a modest
//    edit distance) — flagged, but a PM can confirm and add it anyway as a
//    genuinely different company.
function normalizeSupplierName(name){
  return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
}
function levenshteinDistance(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1], prev[j], cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}
function findSupplierConflict(name, suppliers, excludeId){
  const norm = normalizeSupplierName(name);
  if(!norm) return {blocked:null, warn:null};
  let warn = null;
  for(const s of suppliers){
    if(excludeId && s.id===excludeId) continue;
    const sNorm = normalizeSupplierName(s.name);
    if(!sNorm) continue;
    if(sNorm===norm) return {blocked:s, warn:null};
    const dist = levenshteinDistance(norm, sNorm);
    const shorter = Math.min(norm.length, sNorm.length);
    if(shorter>=5 && dist<=1) return {blocked:s, warn:null};
    if(!warn){
      const maxLen = Math.max(norm.length, sNorm.length) || 1;
      const ratio = 1 - dist/maxLen;
      if(ratio>=0.6 || norm.includes(sNorm) || sNorm.includes(norm)) warn = s;
    }
  }
  return {blocked:null, warn};
}

window.importSuppliersExcel = async function(input, siteId){
  const file = input.files && input.files[0]; if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel library failed to load — check connection.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    if(!rows.length){ toast('No rows found in that file.'); return; }
    // Try to find "Name"/"Email" columns from a header row; fall back to
    // column A = name, column B = email if no matching header is found.
    let nameCol = 0, emailCol = 1, startRow = 0;
    const header = (rows[0]||[]).map(c=>String(c||'').trim().toLowerCase());
    const nameIdx = header.findIndex(h=>h.includes('name'));
    const emailIdx = header.findIndex(h=>h.includes('email'));
    if(nameIdx>-1 || emailIdx>-1){
      if(nameIdx>-1) nameCol = nameIdx;
      if(emailIdx>-1) emailCol = emailIdx;
      startRow = 1;
    }
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    // Dedupe against suppliers already on file AND against rows already
    // accepted earlier in this same import, so two near-identical rows in
    // one spreadsheet don't both get added.
    const seen = await dbSelect('suppliers', 'org_id=eq.'+ME.org_id+'&select=id,name');
    const found = [];
    let skippedDupe = 0; const skippedSimilar = [];
    for(let i=startRow;i<rows.length;i++){
      const r = rows[i]; if(!r) continue;
      const name = String(r[nameCol]!=null?r[nameCol]:'').trim();
      const email = String(r[emailCol]!=null?r[emailCol]:'').trim();
      if(!name || !EMAIL_RE.test(email)) continue;
      const conflict = findSupplierConflict(name, seen);
      if(conflict.blocked){ skippedDupe++; continue; }
      if(conflict.warn){ skippedSimilar.push(name+' (like "'+conflict.warn.name+'")'); continue; }
      found.push({org_id:ME.org_id, name, email, created_by:ME.id});
      seen.push({id:null, name});
    }
    if(!found.length){
      toast((skippedDupe || skippedSimilar.length) ? 'Nothing new to import — every row matched an existing (or similar) supplier.' : 'Could not find any name + email pairs — check the file has Name/Email columns (or Name in column A, Email in column B).');
      return;
    }
    const inserted = await dbInsert('suppliers', found);
    if(inserted){
      let msg = `${found.length} supplier${found.length===1?'':'s'} imported`;
      if(skippedDupe) msg += `, ${skippedDupe} skipped (already exists)`;
      if(skippedSimilar.length) msg += `, ${skippedSimilar.length} skipped as possible duplicates`;
      toast(msg);
      if(skippedSimilar.length) customAlert('Skipped as possible duplicates — add manually below if these are genuinely different companies: '+skippedSimilar.join(', '));
      supplierAddOpen = false; render();
    }
  }catch(e){ toast('Could not read that file — check it\'s a valid .xlsx or .csv.'); }
};

window.exportVariationsPDF = async function(siteId, scope){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  const site = SITES.find(s=>s.id===siteId);
  let qs = 'site_id=eq.'+siteId+'&order=created_at.asc';
  if(scope==='live') qs += '&status=eq.live';
  else if(scope==='closed') qs += '&status=eq.closed';
  else qs += '&status=in.(live,closed)';
  const variations = await dbSelect('variations', qs);
  if(!variations.length){ toast('No variations to export for that filter.'); return; }
  await loadAllProfiles();
  toast('Building PDF…');
  try{
    const pdfDoc = await PDFLib.PDFDocument.create();
    const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const BRAND = pdfHexToRgb((ORG && ORG.color_primary) || DEFAULT_BRAND1);
    const WHITE = PDFLib.rgb(1,1,1);
    const INK = PDFLib.rgb(0.06,0.06,0.07);
    const SLATE = PDFLib.rgb(0.36,0.37,0.41);
    const FAINT = PDFLib.rgb(0.85,0.84,0.80);
    const CARDBG = PDFLib.rgb(0.976,0.969,0.949);
    const OK = PDFLib.rgb(0.2,0.55,0.35);
    const OKBG = PDFLib.rgb(0.90,0.95,0.91);
    const WARN = PDFLib.rgb(0.69,0.45,0.06);
    const WARNBG = PDFLib.rgb(0.97,0.92,0.83);
    const PAGE_W = 595.28, PAGE_H = 841.89;
    const MARGIN = 42;
    const scopeLabel = scope==='live' ? 'Live' : scope==='closed' ? 'Closed' : 'All';
    const companyName = (ORG && ORG.name) || 'OpHUB';
    const liveCount = variations.filter(v=>v.status==='live').length;
    const closedCount = variations.filter(v=>v.status==='closed').length;

    let logoImg = null;
    const logoUrl = ORG && ORG.logo_path ? publicUrl('org-logos', ORG.logo_path) : null;
    if(logoUrl){
      const bytes = await pdfFetchImageBytes(logoUrl);
      if(bytes){ try{ logoImg = await pdfDoc.embedJpg(bytes); }catch(e){ try{ logoImg = await pdfDoc.embedPng(bytes); }catch(e2){} } }
    }

    let page, y;
    function drawHeaderBand(){
      page.drawRectangle({x:0, y:PAGE_H-92, width:PAGE_W, height:92, color:BRAND});
      if(logoImg){
        const dim = logoImg.scale(1);
        const s = 40/Math.max(dim.width, dim.height);
        const w = dim.width*s, h = dim.height*s;
        page.drawRectangle({x:MARGIN, y:PAGE_H-66, width:40, height:40, color:WHITE});
        page.drawImage(logoImg, {x:MARGIN+(40-w)/2, y:PAGE_H-66+(40-h)/2, width:w, height:h});
      }
      const textX = logoImg ? MARGIN+52 : MARGIN;
      page.drawText('VARIATIONS REPORT', {x:textX, y:PAGE_H-40, size:9, font:bold, color:WHITE, opacity:0.85});
      page.drawText(site.name, {x:textX, y:PAGE_H-60, size:16, font:bold, color:WHITE});
      page.drawText(companyName + ' · ' + scopeLabel + ' variations', {x:textX, y:PAGE_H-76, size:9.5, font:reg, color:WHITE, opacity:0.9});
    }
    function drawFooter(pageNum){
      page.drawLine({start:{x:MARGIN,y:34}, end:{x:PAGE_W-MARGIN,y:34}, thickness:0.75, color:FAINT});
      page.drawText('Generated via OpHUB · ' + new Date().toLocaleString('en-GB'), {x:MARGIN, y:20, size:8, font:reg, color:SLATE});
      page.drawText('Page ' + pageNum, {x:PAGE_W-MARGIN-40, y:20, size:8, font:reg, color:SLATE});
    }
    let pageNum = 0;
    function newPage(){
      page = pdfDoc.addPage([PAGE_W, PAGE_H]);
      pageNum++;
      drawHeaderBand();
      y = PAGE_H - 118;
    }
    newPage();
    const chipW = 150, chipGap = 14, chipY = y - 34;
    [
      {label:'Total variations', value:String(variations.length), bg:CARDBG, fg:INK},
      {label:'Live', value:String(liveCount), bg:WARNBG, fg:WARN},
      {label:'Closed', value:String(closedCount), bg:OKBG, fg:OK},
    ].forEach((c,i)=>{
      const x = MARGIN + i*(chipW+chipGap);
      page.drawRectangle({x, y:chipY, width:chipW, height:44, color:c.bg});
      page.drawText(c.value, {x:x+12, y:chipY+22, size:16, font:bold, color:c.fg});
      page.drawText(c.label.toUpperCase(), {x:x+12, y:chipY+8, size:7.5, font:bold, color:c.fg, opacity:0.8});
    });
    y = chipY - 26;

    for(let i=0;i<variations.length;i++){
      const v = variations[i];
      const blockH = 130;
      if(y - blockH < 50){ newPage(); }

      const cardTop = y;
      page.drawRectangle({x:MARGIN, y:cardTop-blockH, width:PAGE_W-2*MARGIN, height:blockH, color:CARDBG});
      const pillColor = v.status==='closed' ? OK : WARN;
      const pillBg = v.status==='closed' ? OKBG : WARNBG;
      const textLeft = MARGIN + 16;
      const imgSlot = 84;
      const textWidth = (PAGE_W-2*MARGIN) - imgSlot - 32;
      let ty = cardTop - 22;
      const desc = (v.description||'').length>90 ? v.description.slice(0,87)+'…' : (v.description||'');
      const descLines = wrapPlainText(desc, reg, 12, textWidth);
      page.drawText((i+1)+'. '+(descLines[0]||''), {x:textLeft, y:ty, size:12, font:bold, color:INK});
      const pillW = 56;
      page.drawRectangle({x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW, y:ty-3, width:pillW, height:15, color:pillBg});
      page.drawText(v.status.toUpperCase(), {x:MARGIN+(PAGE_W-2*MARGIN)-16-pillW+8, y:ty+1, size:8, font:bold, color:pillColor});
      ty -= 18;
      if(descLines[1]){ page.drawText(descLines[1], {x:textLeft, y:ty, size:10, font:reg, color:INK}); ty -= 14; }
      page.drawText('Raised by '+nameOf(v.created_by)+' · '+new Date(v.created_at).toLocaleDateString('en-GB'), {x:textLeft, y:ty, size:9, font:reg, color:SLATE});
      ty -= 14;
      if(v.status==='closed' && v.closed_at){
        page.drawText('Closed '+new Date(v.closed_at).toLocaleDateString('en-GB'), {x:textLeft, y:ty, size:9, font:reg, color:SLATE});
      }

      if(v.photo_path){
        const imgX = MARGIN+(PAGE_W-2*MARGIN)-16-imgSlot+8;
        const imgY = cardTop-blockH+14;
        const boxSize = 76;
        try{
          const bytes = await pdfFetchImageBytes(publicUrl('site-photos', v.photo_path));
          if(bytes){
            let img; try{ img = await pdfDoc.embedJpg(bytes); }catch(e){ img = await pdfDoc.embedPng(bytes); }
            const dim = img.scale(1);
            const s2 = boxSize/Math.max(dim.width, dim.height);
            const w = dim.width*s2, h = dim.height*s2;
            page.drawImage(img, {x:imgX+(boxSize-w)/2, y:imgY+(boxSize-h)/2, width:w, height:h});
          }
        }catch(e){ /* skip photo if it fails to embed */ }
      }

      y = cardTop - blockH - 14;
    }

    const variationPhotoRefs = variations.filter(v=>v.photo_path).map(v=>({path:v.photo_path, bucket:'site-photos'}));
    await appendMediaSummaryPages(pdfDoc, variationPhotoRefs);

    pdfDoc.getPages().forEach((p,idx)=>{ page = p; drawFooter((idx+1)+' of '+pdfDoc.getPageCount()); });

    const exportLabel = scope==='live' ? 'Variations Report (Live)' : scope==='closed' ? 'Variations Report (Closed)' : 'Variations Report (All)';
    const filename = exportFilename(site.name, exportLabel, 'pdf');
    pdfDoc.setTitle(filename.replace(/\.pdf$/i,''));
    const outBytes = await pdfDoc.save();
    await deliverPdf(outBytes, filename);
  }catch(e){
    console.error(e);
    toast('Could not build the PDF.');
  }
};
// Simple word-wrap into at most 2 lines for the variations export card —
// mirrors the same idea as wrapText() in drawSignatureTablePages but kept
// local since it only needs a 2-line cap, not unlimited wrapping.
function wrapPlainText(text, font, size, maxWidth){
  const words = (text||'').split(' ');
  const lines = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(font.widthOfTextAtSize(test, size) > maxWidth && cur){ lines.push(cur); cur = w; }
    else cur = test;
    if(lines.length>=2) break;
  }
  if(cur && lines.length<2) lines.push(cur);
  return lines;
}

window.renameDrawingFolder = async function(folderId, currentName){

  if(next==null) return;
  const trimmed = next.trim();
  if(!trimmed || trimmed===currentName) return;

window.moveDrawingFolder = async function(siteId, parentFolderId, folderId, dir){
  const siblings = await dbSelect('drawing_folders', 'site_id=eq.'+siteId+'&'+(parentFolderId?'parent_id=eq.'+parentFolderId:'parent_id=is.null')+'&order=position.asc.nullslast,name.asc');
  // Normalize: give every sibling a real integer position first (existing
  // folders may still have position:null from before this feature existed).
  await Promise.all(siblings.map((f,idx)=> f.position!==idx ? dbUpdate('drawing_folders', f.id, {position:idx}) : null));
  const idx = siblings.findIndex(f=>f.id===folderId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=siblings.length) return;
  await Promise.all([
    dbUpdate('drawing_folders', siblings[idx].id, {position:swapIdx}),
    dbUpdate('drawing_folders', siblings[swapIdx].id, {position:idx}),
  ]);
  render();
};
window.deleteDrawingFolder = async function(folderId){
  if(!await customConfirm('Delete this folder and everything inside it? This can\'t be undone.')) return;
  const ok = await dbDelete('drawing_folders', folderId);

};
window.uploadDrawingFile = async function(input, siteId, folderId){
  const files = input.files ? Array.from(input.files) : [];
  if(!files.length) return;
  const allowed = {'application/pdf':true, 'image/jpeg':true, 'image/png':true};
  const label = document.getElementById('drawingUploadLabel');
  let uploaded = 0, skipped = 0;
  for(let i=0; i<files.length; i++){
    const file = files[i];
    if(!allowed[file.type]){ skipped++; continue; }
    if(label) label.textContent = `Uploading ${i+1} of ${files.length}…`;
    const path = siteId+'/'+(folderId||'root')+'/'+uid()+'-'+file.name.replace(/[^a-z0-9.\-]+/gi,'_');
    const stored = await uploadToStorage('drawings', path, file, file.type);
    if(!stored) continue;
    const rows = await dbInsert('drawing_files', {site_id:siteId, folder_id:folderId||null, name:file.name, storage_path:stored, uploaded_by:ME.id});
    if(rows) uploaded++;
    pushDrawingToOneDrive(siteId, file);
  }
  if(uploaded){ toast(uploaded===1 ? 'Drawing uploaded' : `${uploaded} drawings uploaded`+(skipped?`, ${skipped} skipped (wrong file type)`:'')); drawingUploadOpen = false; }
  else if(skipped) toast('Please choose PDF, JPEG or PNG files.');
  render();
};
// Two-way OneDrive sync for Drawings, push half: best-effort, silent-fail,
// same opportunistic pattern as photo/PDF sync elsewhere — only fires when
// this site has a OneDrive folder linked (Team & Admin › Sync Folder).
async function pushDrawingToOneDrive(siteId, file){
  const site = SITES.find(s=>s.id===siteId);
  if(!site || !site.onedrive_folder_id) return;
  try{
    const buf = await file.arrayBuffer();
    let binary = ''; const bytes = new Uint8Array(buf); const chunk = 0x8000;
    for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode(...bytes.subarray(i, Math.min(i+chunk, bytes.length)));
    const base64 = btoa(binary);
    await sbFetch('/functions/v1/onedrive-upload', {method:'POST', body: JSON.stringify({filename: file.name, content_base64: base64, site_id: siteId})});
  }catch(e){ /* silent — OneDrive sync is opportunistic */ }
}

let drawingImportSiteId = null;

window.startDrawingImport = function(siteId, targetFolderId){
  const site = SITES.find(s=>s.id===siteId);
  drawingImportSiteId = siteId;
  drawingImportTargetFolderId = targetFolderId || null;
  drawingImportSelected = new Set();
  drawingImportStack = [{id: site.onedrive_folder_id, name: site.onedrive_folder_name || 'Linked Folder', driveId: site.onedrive_drive_id}];
  go(`#/site/${siteId}/drawings-import`);
  loadDrawingImportLevel();
};
async function loadDrawingImportLevel(){
  drawingImportBusy = true; render();
  const current = drawingImportStack[drawingImportStack.length-1];
  try{
    const body = {includeFiles:true};
    if(current.id){ body.parent_id = current.id; if(current.driveId) body.drive_id = current.driveId; }
    const res = await sbFetch('/functions/v1/onedrive-list-folders', {method:'POST', body:JSON.stringify(body)});
    const d = await res.json();
    if(!res.ok || d.error){ drawingImportError = d.error || 'Could not load OneDrive folders.'; drawingImportFolders = []; drawingImportFiles = []; }
    else { drawingImportFolders = d.folders || []; drawingImportFiles = d.files || []; drawingImportError = null; }
  }catch(e){ drawingImportError = 'Could not reach OneDrive.'; drawingImportFolders = []; drawingImportFiles = []; }
  drawingImportBusy = false; render();
}
window.openDrawingImportFolder = function(id, name, driveId){
  const parentDrive = drawingImportStack[drawingImportStack.length-1].driveId;
  drawingImportStack.push({id, name, driveId: driveId || parentDrive});
  loadDrawingImportLevel();
};
window.drawingImportUp = function(){
  if(drawingImportStack.length>1){ drawingImportStack.pop(); loadDrawingImportLevel(); }
};
window.toggleDrawingImportSelect = function(key){
  if(drawingImportSelected.has(key)) drawingImportSelected.delete(key); else drawingImportSelected.add(key);
  render();

window.importSelectedDrawings = async function(){
  if(!drawingImportSelected.size) return;
  const files = drawingImportFiles.filter(f=>drawingImportSelected.has(f.id+'|'+(f.driveId||'')));
  let imported = 0, failed = 0;
  for(const f of files){
    try{
      const res = await sbFetch('/functions/v1/onedrive-download-file', {method:'POST', body:JSON.stringify({item_id:f.id, drive_id:f.driveId||null, name:f.name})});
      const d = await res.json();
      if(!res.ok || d.error || !d.content_base64){ failed++; continue; }
      const bytes = Uint8Array.from(atob(d.content_base64), c=>c.charCodeAt(0));
      const blob = new Blob([bytes]);
      const path = drawingImportSiteId+'/'+(drawingImportTargetFolderId||'root')+'/'+uid()+'-'+f.name.replace(/[^a-z0-9.\-]+/gi,'_');
      const stored = await uploadToStorage('drawings', path, blob, 'application/octet-stream');
      if(!stored){ failed++; continue; }
      const rows = await dbInsert('drawing_files', {site_id:drawingImportSiteId, folder_id:drawingImportTargetFolderId||null, name:f.name, storage_path:stored, uploaded_by:ME.id});
      if(rows) imported++; else failed++;
    }catch(e){ failed++; }
  }
  toast(imported ? `${imported} drawing${imported===1?'':'s'} imported from OneDrive`+(failed?`, ${failed} failed`:'') : 'Import failed — try again.');
  go(`#/site/${drawingImportSiteId}/drawings${drawingImportTargetFolderId?'/'+drawingImportTargetFolderId:''}`);
};

window.renameCoshhLibraryFolder = async function(folderId, currentName){
  const next = prompt('Rename folder', currentName);
  if(next==null) return;
  const trimmed = next.trim();
  if(!trimmed || trimmed===currentName) return;
  const row = await dbUpdate('coshh_library_folders', folderId, {name: trimmed});
  if(row){ toast('Folder renamed'); render(); }
};
window.moveCoshhLibraryFolder = async function(parentFolderId, folderId, dir){
  const siblings = await dbSelect('coshh_library_folders', 'org_id=eq.'+ME.org_id+'&'+(parentFolderId?'parent_id=eq.'+parentFolderId:'parent_id=is.null')+'&order=position.asc.nullslast,name.asc');
  await Promise.all(siblings.map((f,idx)=> f.position!==idx ? dbUpdate('coshh_library_folders', f.id, {position:idx}) : null));
  const idx = siblings.findIndex(f=>f.id===folderId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=siblings.length) return;
  await Promise.all([
    dbUpdate('coshh_library_folders', siblings[idx].id, {position:swapIdx}),
    dbUpdate('coshh_library_folders', siblings[swapIdx].id, {position:idx}),
  ]);
  render();
};
window.deleteCoshhLibraryFolder = async function(folderId){
  if(!await customConfirm('Delete this folder and everything inside it? This can\'t be undone.')) return;
  const ok = await dbDelete('coshh_library_folders', folderId);
  if(ok){ toast('Folder deleted'); render(); }
};
window.uploadCoshhLibraryFile = async function(input, folderId){
  const files = input.files ? Array.from(input.files) : [];
  if(!files.length) return;
  const label = document.getElementById('coshhLibUploadLabel');
  let uploaded = 0;
  for(let i=0; i<files.length; i++){
    const file = files[i];
    if(label) label.textContent = `Uploading ${i+1} of ${files.length}…`;
    const path = ME.org_id+'/'+(folderId||'root')+'/'+uid()+'-'+file.name.replace(/[^a-z0-9.\-]+/gi,'_');
    const stored = await uploadToStorage('coshh-library', path, file, file.type || 'application/octet-stream');
    if(!stored) continue;
    const rows = await dbInsert('coshh_library_files', {org_id:ME.org_id, folder_id:folderId||null, name:file.name, storage_path:stored, uploaded_by:ME.id});
    if(rows) uploaded++;
  }
  if(uploaded){ toast(uploaded===1 ? 'Document uploaded' : `${uploaded} documents uploaded`); coshhLibUploadOpen = false; }
  else toast('Upload failed — try again.');
  render();
};

// Recursively collects every file id under a library folder (including
// nested subfolders, e.g. a manufacturer folder under Liquid Roofing) —
// lets "Select Folder" tick a whole element-of-works folder in one tap
// instead of ticking each document inside it individually.
async function collectCoshhLibraryFolderFileIds(folderId){
  const [files, subfolders] = await Promise.all([
    dbSelect('coshh_library_files', 'folder_id=eq.'+folderId+'&select=id'),
    dbSelect('coshh_library_folders', 'parent_id=eq.'+folderId+'&select=id'),
  ]);
  let ids = files.map(f=>f.id);
  for(const sf of subfolders){
    ids = ids.concat(await collectCoshhLibraryFolderFileIds(sf.id));
  }
  return ids;
}

window.importSelectedCoshhFromLibrary = async function(siteId){

  const ids = Array.from(coshhPickSelected);
  const files = await dbSelect('coshh_library_files', 'id=in.('+ids.join(',')+')&select=*');
  let added = 0, failed = 0;
  for(const f of files){
    try{
      const srcRes = await fetch(publicUrl('coshh-library', f.storage_path));
      const blob = await srcRes.blob();
      const path = siteId+'/coshh/'+uid()+'-'+f.name.replace(/[^a-z0-9.\-]+/gi,'_');
      const stored = await uploadToStorage('coshh-docs', path, blob, 'application/pdf');
      if(!stored){ failed++; continue; }
      const rows = await dbInsert('coshh_docs', {site_id:siteId, name:f.name, storage_path:stored, uploaded_by:ME.id});
      if(rows) added++; else failed++;
    }catch(e){ failed++; }
  }
  toast(added ? `${added} document${added===1?'':'s'} added from the library`+(failed?`, ${failed} failed`:'') : 'Could not add — try again.');
  coshhPickSelected = new Set();
  go(`#/site/${siteId}/hs/coshh`);
};
