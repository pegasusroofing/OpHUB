<style>
  :root{
    --brand1:#4E8FD1;
    --brand2:#101114;
    --red:#C8102E;
    --ink:#101114;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --line:#E4E1D8;
    --slate:#5B5F68;
    --slate-light:#9A9DA3;
    --ok:#2E6B3E;
    --ok-bg:#E4EFE4;
    --warn:#B0740F;
    --warn-bg:#F5EBD6;
    --blue:#2A4B7C;
    --blue-bg:#E7EDF5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:#EFEDE6;
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
  }
  #app{
    max-width:460px;margin:0 auto;min-height:100vh;
    background:var(--paper);
    display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  /* Same app, same layout, same everything below this width — this only
     changes how it's FRAMED on a wide desktop browser window, so it reads as
     an intentional webpage rather than a phone screen stretched into a void.
     Nothing inside #app is touched, so behavior is identical either way. */
  @media (min-width:760px){
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;
      background:linear-gradient(160deg,#E9EEF5 0%,#EFEDE6 55%,#EDE8DD 100%);}
    #app{height:92vh;max-height:900px;min-height:0;border-radius:22px;overflow:hidden;
      box-shadow:0 30px 80px -20px rgba(16,17,20,.35);}
  }
  .stripe-edge{height:7px;width:100%;flex:0 0 auto;
    background:repeating-linear-gradient(-45deg,var(--brand1) 0 5px,var(--brand2) 5px 10px);}

  .appbar{background:var(--brand1);color:#fff;padding:21px 24px 18px;flex:0 0 auto;}
  .appbar .row{display:flex;align-items:center;gap:15px;}
  .badge{background:var(--brand1);color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;padding:3px 7px;border-radius:4px;}
  .brandmark{width:72px;height:72px;border-radius:0;object-fit:contain;background:#fff;flex:0 0 72px;padding:4px;}
  .brandline{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#b9b9b9;margin-bottom:1.5px;}
  .appbar h2{margin:0;font-size:24px;font-weight:800;}
  .appbar .meta{font-size:16.5px;color:#b9b9b9;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px;}
  .backarrow{font-size:57px;font-weight:900;line-height:1;color:#fff;opacity:.95;padding:6px 21px 6px 0;margin:-6px 0;display:flex;align-items:center;min-height:66px;min-width:54px;text-shadow:0 0 1px #fff, 0.5px 0 0 #fff;}
  .rolechip{margin-left:auto;background:#232323;color:#ccc;font-size:5.2px;font-weight:700;
    padding:2px 4.5px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;}

  .scrollarea{flex:1;overflow-y:auto;padding:14px;padding-bottom:26px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .sectiontitle{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin:4px 0 10px;}

  .primarybtn,.darkbtn,.ghostbtn{
    display:block;width:100%;padding:13px;border-radius:10px;border:none;
    font-weight:800;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;text-align:center;
  }
  .primarybtn{background:var(--brand1);color:#fff;}
  .exportbtn{padding:8.125px;font-size:8.4375px;}
  .darkbtn{background:var(--brand1);color:#fff;}
  .ghostbtn{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
  .primarybtn:disabled,.darkbtn:disabled{background:#d8d5cb;color:#9a978c;}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14px;background:#fff;color:var(--ink);font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  label.field-label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--slate);margin:0 0 6px;}
  .formfield{margin-bottom:12px;}
  .row-gap{display:flex;gap:8px;}
  .row-gap > *{flex:1;}

  .rolepick{display:flex;gap:10px;margin-top:6px;}
  .rolebtn{
    flex:1;padding:18px 10px;border-radius:12px;border:2px solid var(--line);
    background:#fff;text-align:center;font-weight:800;font-size:13.5px;color:var(--slate);

  .rolebtn .ic{font-size:24px;display:block;margin-bottom:6px;}
  .rolebtn.selected{border-color:var(--brand1);background:#E9F1FB;color:var(--brand1);}

    background:linear-gradient(135deg,var(--brand1),var(--brand2));display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;}

  .sitecard .info{flex:1;min-width:0;}

  .sitecard .status.closed{background:var(--line);color:var(--slate);}

    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em;

  .pill.on{background:var(--ok-bg);color:var(--ok);}
  .pill.off{background:var(--line);color:var(--slate);}

  .tile-wide{grid-column:1 / -1;flex-direction:row;justify-content:center;align-items:center;min-height:64px;}

  .checkbox.progress{border-color:var(--warn);background:var(--warn);}
  .checkbox.done{border-color:var(--ok);background:var(--ok);}
  .taskbody{flex:1;min-width:0;}
  .statusbtns{display:flex;gap:6px;margin-top:9px;}
  .statusbtn{flex:1;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    padding:8px 4px;border-radius:8px;border:1.5px solid var(--line);color:var(--slate);background:var(--paper);}

  .taskmeta{font-size:11px;color:var(--slate);margin-top:3px;}

  .signerlist{margin-top:10px;font-size:11px;color:var(--slate);}
  .signerlist div{padding:3px 0;}

  .matcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .matcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .matcard .name{font-size:13.5px;font-weight:700;}
  .matcard .qty{font-size:11.5px;color:var(--slate);margin-top:2px;}
  .statustag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;}
  .statustag.sent{background:var(--blue-bg);color:var(--blue);}
  .statustag.pending{background:var(--warn-bg);color:var(--warn);}
  .merchantrow{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--slate);}
  .merchantchip{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;
    font-weight:700;font-size:10.5px;}
  .merchantchip.pickable{cursor:pointer;}
  .merchantchip.sent{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}

  .varcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;}
  .varcard img{width:100%;border-radius:8px;margin-bottom:8px;}
  .varcard .desc{font-size:13px;}
  .varcard .meta{font-size:11px;color:var(--slate);margin-top:6px;}
  .photoupload{background:var(--card);border:1.5px dashed var(--slate-light);border-radius:10px;
    min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--slate);font-size:12px;font-weight:700;overflow:hidden;}
  .photoupload img{width:100%;height:100%;object-fit:cover;}

  .empty{text-align:center;color:var(--slate-light);font-size:13px;padding:26px 10px;}

  .tabbar{flex:0 0 auto;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 3px 12px;
    background:#fff;border-top:1px solid var(--line);}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-weight:700;
    color:var(--slate-light);padding:4px 5px;border-radius:10px;}
  .tb.active{color:var(--brand1);}
  .tabicon{font-size:15px;}
  .tb.tb-emph{border:1.5px solid var(--line);padding:6px 9px;margin:-4px 0;background:var(--paper);font-size:9.5px;}
  .tb.tb-emph .tabicon{font-size:19px;}
  .tb.tb-emph.active{border-color:var(--brand1);}

  .toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:13px 16px;
    border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:10px;max-width:428px;margin:0 auto;z-index:100;}
  .toast .stripe{width:5px;align-self:stretch;background:var(--brand1);border-radius:3px;}

  .stub{font-size:11px;color:var(--slate-light);font-style:italic;margin-top:6px;}
  .errbox{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>

function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('read failed'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('load failed'));
      img.onload=()=>{
        const maxW=480; const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const c=document.createElement('canvas'); c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.6));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function getGeo(){
  // In the native app, use Capacitor's Geolocation plugin — it drives Android's
  // runtime permission prompt properly. Bare navigator.geolocation inside an
  // embedded WebView often silently fails on Android because nothing ever
  // triggers the permission dialog.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation){
    try{
      const perm = await window.Capacitor.Plugins.Geolocation.checkPermissions();
      if(perm.location !== 'granted' && perm.coarseLocation !== 'granted'){
        const req = await window.Capacitor.Plugins.Geolocation.requestPermissions();
        if(req.location !== 'granted' && req.coarseLocation !== 'granted'){
          return {error:'Location permission denied. Enable it for this app in your phone\'s Settings.'};
        }
      }
      const pos = await window.Capacitor.Plugins.Geolocation.getCurrentPosition({enableHighAccuracy:true, timeout:12000});
      return {lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy};
    }catch(e){
      return {error: (e && e.message) || 'Could not get your location.'};
    }
  }
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve({error:'Location not supported.'}); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),
      e=>resolve({error:e.message||'Location permission denied.'}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  });
}
function distMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7;
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-day);
  return dt.getTime();
}

/* ================= local persistence (session only — no raw passwords ever stored) ================= */
async function sget(key, shared){ try{ const r=await window.storage.get(key,shared); return r?r.value:null; }catch(e){ return null; } }
async function sset(key, value, shared){ try{ return await window.storage.set(key,value,shared);}catch(e){ console.error(e); return null; } }
async function sdelete(key, shared){ try{ return await window.storage.delete(key, shared); }catch(e){ return null; } }
async function getJSON(key, shared, fallback){ const v=await sget(key,shared); if(!v) return fallback; try{return JSON.parse(v);}catch(e){return fallback;} }
async function setJSON(key, obj, shared){ return sset(key, JSON.stringify(obj), shared); }
const K_SESSION = 'rtb-session-v1';

/* ================= Supabase data layer ================= */
let SESSION = null; // {access_token, refresh_token, expires_at, user:{id,email}}

async function ensureFreshToken(){
  if(!SESSION) return;
  if(Date.now() < SESSION.expires_at - 60000) return;
  try{
    const res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: SESSION.refresh_token})
    });
    if(res.ok){
      const d = await res.json();
      SESSION = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in*1000), user:SESSION.user};
      await setJSON(K_SESSION, SESSION, false);
    } else {
      SESSION = null; ME = null; await sdelete(K_SESSION, false);
    }
  }catch(e){ SESSION = null; ME = null; }
}
async function sbFetch(path, opts){
  opts = opts || {};
  await ensureFreshToken();
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (SESSION ? SESSION.access_token : SUPABASE_ANON_KEY),
    'Content-Type': 'application/json'
  }, opts.headers||{});
  return fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
}
async function safeErr(res){ try{ const j = await res.json(); return j.message||j.error_description||j.error||res.status; }catch(e){ return res.status; } }

async function dbSelect(table, qs){
  const res = await sbFetch('/rest/v1/'+table+'?'+qs, {method:'GET'});
  if(!res.ok){ console.error(await safeErr(res)); return []; }
  return res.json();
}
async function dbInsert(table, rowOrRows){
  const res = await sbFetch('/rest/v1/'+table, {method:'POST', headers:{'Prefer':'return=representation'}, body:JSON.stringify(rowOrRows)});
  if(!res.ok){ toast('Save failed — '+(await safeErr(res))); return null; }
  const d = await res.json();
  return d;
}
async function dbUpdate(table, id, patch){
  const res = await sbFetch('/rest/v1/'+table+'?id=eq.'+id, {method:'PATCH', headers:{'Prefer':'return=representation'}, body:JSON.stringify(patch)});
  if(!res.ok){ toast('Update failed — '+(await safeErr(res))); return null; }
  const d = await res.json();
  return Array.isArray(d)?d[0]:d;
}
async function dbDelete(table, id){
  const res = await sbFetch('/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE'});
  if(!res.ok){ toast('Delete failed — '+(await safeErr(res))); return false; }
  return true;
}
async function uploadToStorage(bucket, path, blobOrFile, contentType){
  await ensureFreshToken();
  const res = await fetch(SUPABASE_URL+'/storage/v1/object/'+bucket+'/'+path, {
    method:'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization':'Bearer '+SESSION.access_token,
      'Content-Type': contentType || blobOrFile.type || 'application/octet-stream',
      'x-upsert':'true'
    },
    body: blobOrFile
  });
  if(!res.ok){ toast('Upload failed — '+(await safeErr(res))); return null; }
  return path;
}
async function uploadDataUrl(bucket, path, dataUrl){
  const blob = await (await fetch(dataUrl)).blob();
  return uploadToStorage(bucket, path, blob, blob.type);
}
function publicUrl(bucket, path){ return path ? (SUPABASE_URL+'/storage/v1/object/public/'+bucket+'/'+path) : null; }

/* ================= auth ================= */
// `extra` becomes the new account's auth metadata. Only `invite_id` matters
// server-side: the handle_new_user() DB trigger looks it up in the `invites`
// table and resolves org_id/role from THAT row — anything else sent here
// (e.g. a role) is display-only and is never trusted by the backend.
async function signUp(email, password, extra){
  const res = await fetch(SUPABASE_URL+'/auth/v1/signup', {
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password, data: extra||{}})
  });
  const d = await res.json();
  if(!res.ok) return {error: d.msg||d.error_description||d.error||'Sign up failed'};
  if(d.access_token){
    SESSION = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in*1000), user:{id:d.user.id, email:d.user.email}};
    await setJSON(K_SESSION, SESSION, false);
    return {ok:true, confirmed:true};
  }
  return {ok:true, confirmed:false};
}
async function getInviteInfo(inviteId){
  const res = await sbFetch('/rest/v1/rpc/get_invite_info', {method:'POST', body: JSON.stringify({p_invite_id: inviteId})});
  if(!res.ok) return null;
  const rows = await res.json();
  return rows && rows[0] ? rows[0] : null;
}
async function signIn(email, password){
  const res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const d = await res.json();
  if(!res.ok) return {error: d.msg||d.error_description||d.error||'Sign in failed'};
  SESSION = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in*1000), user:{id:d.user.id, email:d.user.email}};
  await setJSON(K_SESSION, SESSION, false);
  return {ok:true};
}
window.doSignOut = async function(){
  try{ await sbFetch('/auth/v1/logout', {method:'POST'}); }catch(e){}
  SESSION = null; ME = null; ORG = null;
  applyTheme(null);
  await sdelete(K_SESSION, false);
  location.hash = '';
  render();
};
async function loadProfile(){
  const rows = await dbSelect('profiles', 'id=eq.'+SESSION.user.id+'&select=*');
  ME = rows[0] || null;
}

/* ================= push notifications ================= */
// Registers this device for push (native app only) and saves the FCM token
// against the signed-in user so server-side reminders (e.g. the 3pm sign-out
// nudge) know where to deliver. Silently no-ops on the plain website.
let pushRegistered = false;
async function registerPushNotifications(){
  try{
    if(pushRegistered) return;
    if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
    const PN = window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
    if(!PN) return;
    let perm = await PN.checkPermissions();
    if(perm.receive !== 'granted'){ perm = await PN.requestPermissions(); }
    if(perm.receive !== 'granted') return;
    pushRegistered = true;
    PN.addListener('registration', async (token)=>{
      if(!ME || !token || !token.value) return;
      try{
        await sbFetch('/rest/v1/push_tokens?on_conflict=token', {
          method:'POST',
          headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify({user_id: ME.id, token: token.value, platform:'android', updated_at: new Date().toISOString()})
        });
      }catch(e){ console.error('Could not save push token', e); }
    });
    PN.addListener('registrationError', (err)=>{ console.error('Push registration error', err); });
    await PN.register();
  }catch(e){ console.error('Push notification setup failed', e); }
}

  '<text x="32" y="41" font-size="22" font-family="-apple-system,Arial,sans-serif" font-weight="800" fill="#fff" text-anchor="middle">OH</text></svg>'

  const rows = await dbSelect('organizations', 'id=eq.'+ME.org_id+'&select=*');
  ORG = rows[0] || null;

}
function applyTheme(org){
  const root = document.documentElement.style;
  root.setProperty('--brand1', (org && org.color_primary) || DEFAULT_BRAND1);
  root.setProperty('--brand2', (org && org.color_secondary) || DEFAULT_BRAND2);
}
// Feature gating by company package. 'starter' (OpHUB Basic) doesn't include
// GPS check-in & geofencing — everything else (growth/enterprise) does.
// Superadmin has no ORG at all, so treat that as unrestricted.
function orgAllowsGps(){ return !ORG || ORG.plan_tier !== 'starter'; }
const PLAN_LABEL = { starter:'OpHUB Basic', growth:'OpHUB Pro', enterprise:'OpHUB Enterprise' };
function orgLogoUrl(org){
  return org && org.logo_path ? publicUrl('org-logos', org.logo_path) : OPHUB_LOGO;
}
// 'admin' is a superset of 'pm' capabilities everywhere in this app —
// mirrors the DB's is_pm() which now also means "pm or admin".
function isManager(u){ return !!u && (u.role==='pm' || u.role==='admin'); }
function roleLabel(role){
  return role==='admin' ? 'Company Admin' : role==='pm' ? 'Project Manager' : role==='superadmin' ? 'Super Admin' : 'Operative';
}

async function loadAllProfiles(){

/* ================= init ================= */
async function init(){
  SESSION = await getJSON(K_SESSION, false, null);
  if(SESSION){
    await ensureFreshToken();
    if(SESSION){
      await loadProfile();
      if(!ME){ SESSION=null; ME=null; }
    }
  }
  if(SESSION && ME){
    await loadOrg();
    await loadAllProfiles();
    SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
    if(ME.role!=='superadmin') registerPushNotifications();
  } else {
    applyTheme(null);
  }
  render();
}

/* ================= shell ================= */
function shell(innerHtml, opts){
  opts = opts||{};
  return `
    <div style="display:flex;flex-direction:column;min-height:100vh;">
      <div class="stripe-edge"></div>
      <div class="appbar">
        ${opts.centerTitle ? `
          <div class="row" style="justify-content:center;text-align:center;">
            <h2>OpHUB${ORG && ORG.name ? ' - '+escapeHtml(ORG.name) : ' - Welcome to your Operative Hub'}</h2>
          </div>
        ` : opts.centerHeader ? `
          <div class="row" style="flex-direction:column;gap:8px;text-align:center;">
            <img class="brandmark" src="${orgLogoUrl(ORG)}" alt="OpHUB" onerror="this.onerror=null;this.src='${OPHUB_LOGO_INLINE}'">
            <div class="brandline">OpHUB${ORG && ORG.name ? ' - '+escapeHtml(ORG.name) : ''}</div>
            <h2>${opts.title||''}</h2>
            ${ME ? `<span class="rolechip" style="margin:2px auto 0;">${roleLabel(ME.role)}</span>` : ''}
          </div>
        ` : `
        <div class="row">
          ${opts.back ? `<span class="backarrow" onclick="go('${opts.back}')">‹</span>` : `<img class="brandmark" src="${orgLogoUrl(ORG)}" alt="OpHUB" onerror="this.onerror=null;this.src='${OPHUB_LOGO_INLINE}'">`}
          <div>
            ${!opts.back ? `<div class="brandline">OpHUB${ORG && ORG.name ? ' - '+escapeHtml(ORG.name) : ''}</div>` : ''}
            <h2>${opts.title||''}</h2>
            ${opts.subtitle ? `<div class="meta">${opts.subtitle}</div>` : ''}
          </div>
          ${ME ? `<span class="rolechip">${roleLabel(ME.role)}</span>` : ''}
        </div>
        `}
      </div>
      <div class="scrollarea">${innerHtml}</div>
      ${opts.tabs===false ? '' : tabbar(opts.siteId, opts.activeTab)}
    </div>
  `;
}
let currentUnreadMsgs = 0;
function tabbar(siteId, active){
  if(!siteId) return '';
  const tabs = [
    {k:'home', ic:'🏠', lbl:'Home', href:`#/site/${siteId}/home`},
    {k:'schedule', ic:'📋', lbl:'SOW', href:`#/site/${siteId}/schedule`},
    {k:'checkin', ic:'📍', lbl:'Check In', href:`#/site/${siteId}/checkin`, emph:true},
    {k:'messages', ic:'💬', lbl:'Messages', href:`#/site/${siteId}/messages`, badge:currentUnreadMsgs},
    {k:'more', ic:'☰', lbl:'More', href:`#/site/${siteId}/more`},
  ];
  return `<div class="tabbar">${tabs.map(t=>`
    <div class="tb ${t.emph?'tb-emph':''} ${active===t.k?'active':''}" onclick="go('${t.href}')" style="position:relative;">
      <span class="tabicon">${t.ic}</span>${t.lbl}
      ${t.badge?`<span class="badge-count" style="position:absolute;top:2px;right:calc(50% - 22px);">${t.badge}</span>`:''}
    </div>`).join('')}</div>`;
}

window.maybeAutoSignIn = function(ev){
  // Only Enter submits — a bare "fields look filled" trigger caused false
  // sign-ins whenever the browser's saved-password autofill populated the
  // form (e.g. switching accounts on a shared device), signing people in as
  // whoever was saved before they could change the email. Explicit Sign In
  // click or Enter key only, from here on.
  if(ev && ev.key === 'Enter'){ doSignIn(); }
};
window.doSignIn = async function(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ authError='Enter your email and password.'; render(); return; }
  authBusy = true; authError = null; render();
  const r = await signIn(email, password);
  authBusy = false;
  if(r.error){ authError = r.error; render(); return; }
  await loadProfile();
  if(!ME || (!ME.org_id && ME.role!=='superadmin')){
    authError = 'Your account isn\'t linked to a company yet. Contact your Project Manager for an invite.';
    await doSignOut();
    return;
  }
  if(ME.role==='superadmin'){ go('#/'); return; }
  await loadOrg();
  await loadAllProfiles();
  SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  registerPushNotifications();
  go('#/sites');
};

/* ================= JOIN (invite-only account creation) ================= */
let joinBusy = false;
let joinError = null;
let joinInfo = undefined; // undefined = not loaded yet, null = invalid, {org_name,is_valid} = loaded
async function renderJoin(inviteId){
  const app = document.getElementById('app');
  if(joinInfo === undefined){
    app.innerHTML = shell(`<p class="stub">Checking invite…</p>`, {title:'Join OpHUB', tabs:false});
    joinInfo = await getInviteInfo(inviteId);
    render();
    return;
  }
  if(!joinInfo || !joinInfo.is_valid){
    app.innerHTML = shell(`
      <div class="card">
        <p class="stub" style="margin-top:0;">This invite link isn't valid — it may have already been used or expired. Ask your Project Manager for a new one.</p>
        <button class="ghostbtn" onclick="joinInfo=undefined;go('#/')">Back to Sign In</button>
      </div>
    `, {title:'Invite not valid', tabs:false});
    return;
  }
  // Preview the inviting company's own branding on this screen — falls back
  // to the generic OpHUB mark/colours if they haven't finished company setup yet.
  ORG = {name: joinInfo.org_name, logo_path: joinInfo.logo_path, color_primary: joinInfo.color_primary, color_secondary: joinInfo.color_secondary};
  applyTheme(ORG);
  app.innerHTML = shell(`
    <div class="card">
      <p class="stub" style="margin:0 0 12px;">You've been invited to join <b>${escapeHtml(joinInfo.org_name)}</b> on OpHUB.</p>
      ${joinError ? `<div class="errbox">${escapeHtml(joinError)}</div>` : ''}
      <div class="formfield">
        <label class="field-label">Name</label>
        <input type="text" id="joinName" placeholder="e.g. Andy Turner">
      </div>
      <div class="formfield">
        <label class="field-label">Email</label>
        <input type="email" id="joinEmail" placeholder="you@yourcompany.co.uk">
      </div>
      <div class="formfield">
        <label class="field-label">Password</label>
        <input type="password" id="joinPassword" placeholder="••••••••">
      </div>
      <button class="primarybtn" ${joinBusy?'disabled':''} onclick="doJoin('${inviteId}')">
        ${joinBusy ? '<span class="spinner"></span>Please wait…' : 'Join Team'}
      </button>
    </div>
    <div style="text-align:center;margin-top:22px;">
      <img src="${orgLogoUrl(joinInfo)}" onerror="this.onerror=null;this.src='${OPHUB_LOGO_INLINE}'" style="width:64px;height:64px;border-radius:14px;object-fit:cover;">
    </div>
  `, {title:'Join OpHUB', tabs:false});
}
window.doJoin = async function(inviteId){
  const name = document.getElementById('joinName').value.trim();
  const email = document.getElementById('joinEmail').value.trim();
  const password = document.getElementById('joinPassword').value;
  if(!email || !password || !name){ joinError='Fill in every field.'; render(); return; }
  if(password.length < 6){ joinError='Password needs to be at least 6 characters.'; render(); return; }
  joinBusy = true; joinError = null; render();
  const r = await signUp(email, password, {name, invite_id: inviteId});
  joinBusy = false;
  if(r.error){ joinError = r.error; render(); return; }
  if(r.confirmed){
    await loadProfile();
    if(!ME || !ME.org_id){
      joinError = 'That invite couldn\'t be applied to your account — it may have just been used by someone else. Contact your Project Manager.';
      await doSignOut();
      return;
    }
    joinInfo = undefined;
    await loadOrg();
    await loadAllProfiles();
    SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
    go('#/sites');
  } else {
    joinInfo = undefined;
    location.hash = '';
    authError = 'Account created — check your email to confirm it, then sign in.';
    render();
  }
};

window.addSite = async function(){
  const name = document.getElementById('newSiteName').value.trim();
  const addr = document.getElementById('newSiteAddr').value.trim();
  if(!name) return;
  // Deliberately not asking PostgREST for the row back here (no
  // Prefer: return=representation) — Postgres has a known quirk where a
  // table's own SELECT policy, if it re-queries that same table (as sites'
  // does via has_site_access()), can't reliably see a row that's still
  // mid-insert within the same statement, which makes any "insert and
  // return the new row" call get rejected even though the insert itself
  // is fully allowed. Inserting plain, then re-fetching the list, sidesteps
  // it without weakening the security policy.
  const res = await sbFetch('/rest/v1/sites', {method:'POST', body: JSON.stringify({name, address:addr||null, status:'active', created_by:ME.id, org_id:ME.org_id})});
  if(!res.ok){ toast('Save failed — '+(await safeErr(res))); return; }
  SITES = await dbSelect('sites', 'select=*&order=created_at.asc');
  toast('Site created');
  render();
};
window.deleteSite = async function(siteId, name){
  if(!confirm(`Delete "${name}"? This permanently removes the site along with its schedule, RAMS, snags, materials, variations and check-in history. This can't be undone.`)) return;
  const ok = await dbDelete('sites', siteId);
  if(ok){
    SITES = SITES.filter(s=>s.id!==siteId);
    toast('Site deleted');
    render();
  } else {
    toast('Could not delete — try again.');
  }
};

window.connectOneDrive = async function(){
  odBusy = true; render();
  try{
    const res = await sbFetch('/functions/v1/onedrive-oauth-start', {method:'POST', body: JSON.stringify({})});
    const d = await res.json();
    odBusy = false;
    if(!res.ok || d.error){ toast(d.error || 'Could not start OneDrive connection.'); render(); return; }
    // Microsoft's sign-in screen refuses to load inside an app's embedded
    // webview (a security measure most OAuth providers enforce) — open it in
    // the system browser instead when running as the native app. On the
    // plain website, a normal same-tab redirect works fine.
    if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser){
      window.Capacitor.Plugins.Browser.open({url: d.url});
      toast('Finish connecting in the browser that just opened, then come back here.');
    } else {
      location.href = d.url;
    }
  }catch(e){ odBusy=false; toast('Could not reach the server.'); render(); }
};

window.doCheckAction = async function(siteId, type){
  checkinError = null;
  checkinBusy = true;
  render();

  // OpHUB Basic doesn't include GPS check-in & geofencing — just log the
  // timestamp with no location and skip the distance check entirely.
  if(!orgAllowsGps()){
    const rows = await dbInsert('checkins', {site_id:siteId, user_id:ME.id, type});
    checkinBusy = false;
    if(rows){
      toast((type==='in'?'Checked in':'Checked out')+' · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
    }
    render();
    return;
  }

  const g = await getGeo();
  if(g.error){
    checkinBusy = false; checkinError = g.error; render(); return;
  }
  const site = SITES.find(s=>s.id===siteId);
  if(site.geofence_lat){
    const dist = Math.round(distMeters(g.lat, g.lon, site.geofence_lat, site.geofence_lon));
    if(dist > 100){
      checkinBusy = false;
      checkinError = `${dist}m from site — must be within 100m to ${type==='in'?'check in':'check out'}. Move closer and try again.`;
      render();
      return;
    }
  }
  const rows = await dbInsert('checkins', {site_id:siteId, user_id:ME.id, type, lat:g.lat, lon:g.lon, accuracy_m:Math.round(g.accuracy||0)});
  checkinBusy = false;
  if(rows){
    toast((type==='in'?'Checked in':'Checked out')+' · '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}));
  }
  render();
};
window.exportCheckins = async function(siteId, scope){
  if(typeof XLSX==='undefined'){ toast('Excel library failed to load — check connection.'); return; }
  const site = SITES.find(s=>s.id===siteId);
  let qs = 'site_id=eq.'+siteId+'&order=ts.asc';
  if(scope==='week') qs += '&ts=gte.'+new Date(startOfWeek(Date.now())).toISOString();
  const rows = await dbSelect('checkins', qs);
  if(!rows.length){ toast('No check-ins in that range.'); return; }
  const data = rows.map(c=>({
    Name: nameOf(c.user_id),
    Type: c.type==='in'?'Check In':'Check Out',
    Date: new Date(c.ts).toLocaleDateString('en-GB'),
    Time: new Date(c.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    Latitude: c.lat,
    Longitude: c.lon,
    'Accuracy (m)': c.accuracy_m||''
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:18},{wch:11},{wch:11},{wch:8},{wch:11},{wch:11},{wch:11}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Check-ins');
  const label = scope==='week' ? 'ThisWeek' : 'AllTime';
  XLSX.writeFile(wb, `${site.name.replace(/[^a-z0-9]+/gi,'-')}-checkins-${label}.xlsx`);
  toast('Excel file downloaded');
};

window.setTaskStatus = async function(siteId, taskId, next){
  if(next==='done'){
    const photos = await dbSelect('schedule_photos', 'task_id=eq.'+taskId+'&select=id&limit=1');
    if(!photos || !photos.length){
      toast('Add a completion photo before marking this complete.');
      return;
    }
  }
  const row = await dbUpdate('schedule_tasks', taskId, {status:next});
  if(row) render();
};
// Kept separate from created_at deliberately -- created_at ties (e.g. from a
// bulk Excel import) have no reliable scan order, and an UPDATE (like
// marking a task in-progress) can shuffle rows tied on created_at. Position
// is set once here and never touched again, so the list order stays locked
// to upload/add order regardless of status changes.
async function nextTaskPosition(siteId){
  const rows = await dbSelect('schedule_tasks', 'site_id=eq.'+siteId+'&select=position&order=position.desc.nullslast&limit=1');
  return ((rows[0] && rows[0].position) || 0) + 1;
}
window.addTask = async function(siteId){
  const input = document.getElementById('newTaskName');
  const name = input.value.trim(); if(!name) return;
  const position = await nextTaskPosition(siteId);
  const rows = await dbInsert('schedule_tasks', {site_id:siteId, name, status:'todo', position});
  if(rows){ toast('Task added'); render(); }
};
window.saveTaskEdit = async function(siteId, taskId){

window.deleteTask = async function(siteId, taskId){

window.taskPhoto = async function(input, siteId, taskId){
  const file = input.files && input.files[0]; if(!file) return;
  try{
    const dataUrl = await compressImage(file);
    const path = siteId+'/schedule/'+taskId+'/'+uid()+'.jpg';
    const stored = await uploadDataUrl('site-photos', path, dataUrl);
    if(!stored) return;
    const rows = await dbInsert('schedule_photos', {task_id:taskId, storage_path:stored, uploaded_by:ME.id});
    if(rows){
      toast('Photo added');
      render();
      syncPhotoToOneDrive(dataUrl, path.split('/').pop(), (SITES.find(s=>s.id===siteId)||{}).name || siteId);
    }
  }catch(e){ toast('Could not process photo.'); }
};
// Best-effort background sync — never blocks the UI or shows an error toast,
// since most companies won't have OneDrive connected yet.
async function syncPhotoToOneDrive(dataUrl, filename, subfolder){
  try{
    const base64 = dataUrl.split(',')[1];
    await sbFetch('/functions/v1/onedrive-upload', {method:'POST', body: JSON.stringify({filename, content_base64: base64, subfolder})});
  }catch(e){ /* silent — OneDrive sync is opportunistic */ }
}
window.importScheduleExcel = async function(input, siteId){
  const file = input.files && input.files[0]; if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel library failed to load — check connection.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const names = rows.slice(1).map(r=>r[0]).filter(v=>v!=null && String(v).trim()!=='');
    if(!names.length){ toast('No task names found in column A.'); return; }
    const startPos = await nextTaskPosition(siteId);
    const newRows = names.map((n,i)=>({site_id:siteId, name:String(n).trim(), status:'todo', position:startPos+i}));
    const inserted = await dbInsert('schedule_tasks', newRows);
    if(inserted){ toast(`${names.length} task(s) imported`); render(); }
  }catch(e){ toast('Could not read that file — check it\'s a valid .xlsx or .csv.'); }
};

let snagFilter = 'live';
let snagNewPhoto = null;
let snagNewPdf = null; // {file, name} chosen in the "Add snag" form, not yet uploaded
let attachingPdfSnagId = null;
let closingSnagId = null;
async function renderSnagging(siteId){
  const site = SITES.find(s=>s.id===siteId);
  const canAdd = isManager(ME);
  const status = snagFilter==='live' ? 'open' : 'closed';
  const snags = await dbSelect('snags', 'site_id=eq.'+siteId+'&status=eq.'+status+'&order=created_at.desc');

  document.getElementById('app').innerHTML = shell(`
    <div class="filterrow">
      <div class="filterchip ${snagFilter==='live'?'active':''}" onclick="snagFilter='live';render()">Live</div>
      <div class="filterchip ${snagFilter==='closed'?'active':''}" onclick="snagFilter='closed';render()">Closed</div>
    </div>

    ${snags.map(s=>`
      <div class="snag">
        <div class="top">
          <div><div class="title">${escapeHtml(s.title)}</div><div class="loc">${escapeHtml(s.location||'—')}</div></div>
          <span class="statustag2 ${s.status}">${s.status}</span>
        </div>
        ${s.photo_path ? `<img class="snagthumb" src="${publicUrl('site-photos',s.photo_path)}">` : ''}
        ${s.pdf_path ? `<a class="ghostbtn" style="display:block;margin-top:10px;text-align:center;" href="${publicUrl('site-photos',s.pdf_path)}" target="_blank" rel="noopener">📄 View PDF</a>` : ''}
        ${s.status==='closed' ? `
          <div class="closurerow">
            ${s.closed_photo_path ? `<img src="${publicUrl('site-photos',s.closed_photo_path)}">` : ''}
            <div class="stub" style="margin-top:0;">Closed by ${escapeHtml(nameOf(s.closed_by))} · ${s.closed_at ? new Date(s.closed_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'}) : ''}</div>
          </div>
        ` : `
          ${closingSnagId===s.id ? `
            <div class="card" style="margin:10px 0 0;padding:10px;">
              <p class="stub" style="margin:0 0 8px;">Upload a photo showing this is fixed.</p>
              <label class="ghostbtn" style="display:block;cursor:pointer;text-align:center;">📷 Take closing photo
                <input type="file" accept="image/*" capture="environment" style="display:none" onchange="closeSnagPhoto(this,'${siteId}','${s.id}')">
              </label>
              <button class="ghostbtn" style="margin-top:8px;" onclick="closingSnagId=null;render()">Cancel</button>
            </div>
          ` : `<button class="ghostbtn" style="margin-top:10px;" onclick="closingSnagId='${s.id}';render()">Close snag</button>`}
        `}
        ${canAdd && !s.pdf_path ? (
          attachingPdfSnagId===s.id ? `
            <label class="ghostbtn" style="display:block;margin-top:8px;cursor:pointer;text-align:center;">📄 Choose PDF to attach
              <input type="file" accept="application/pdf" style="display:none" onchange="attachSnagPdf(this,'${siteId}','${s.id}')">
            </label>
          ` : `<button class="ghostbtn" style="margin-top:8px;" onclick="attachingPdfSnagId='${s.id}';render()">Attach PDF</button>`
        ) : ''}
      </div>
    `).join('') || `<div class="empty">No ${snagFilter} snags.</div>`}

    <p class="sectiontitle" style="margin-top:18px;">Export</p>
    <button class="ghostbtn exportbtn" onclick="exportSnaggingPDF('${siteId}','live')">Export live snags (PDF)</button>
    <button class="ghostbtn exportbtn" style="margin-top:8px;" onclick="exportSnaggingPDF('${siteId}','closed')">Export closed snags (PDF)</button>
    <button class="ghostbtn exportbtn" style="margin-top:8px;" onclick="exportSnaggingPDF('${siteId}','both')">Export all snags (PDF)</button>

    ${canAdd ? `
      <div class="card" style="margin-top:14px;">
        <p class="sectiontitle" style="margin-top:0;">Add snag</p>
        <div class="formfield"><input type="text" id="snagTitle" placeholder="Issue"></div>
        <div class="formfield"><input type="text" id="snagLoc" placeholder="Location"></div>
        <div class="formfield">
          <label class="field-label">Photo</label>
          <label class="photoupload" style="cursor:pointer;">
            ${snagNewPhoto ? `<img src="${snagNewPhoto}">` : `<div style="font-size:20px;">📷</div>Tap to capture`}
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="snagAddPhoto(this)">
          </label>
        </div>
        <div class="formfield">
          <label class="field-label">PDF Attachment (optional)</label>
          <label class="ghostbtn" style="display:block;cursor:pointer;text-align:center;">
            ${snagNewPdf ? `📄 ${escapeHtml(snagNewPdf.name)}` : `📄 Choose PDF`}
            <input type="file" accept="application/pdf" style="display:none" onchange="snagAddPdf(this)">
          </label>
        </div>
        <button class="darkbtn" onclick="addSnag('${siteId}')">Add Snag</button>
      </div>
    ` : ''}
  `, {title:'Snagging', subtitle:site.name, back:`#/site/${siteId}/home`, siteId, activeTab:'more'});
}
window.snagAddPhoto = async function(input){
  const file = input.files && input.files[0]; if(!file) return;
  try{ snagNewPhoto = await compressImage(file); render(); }
  catch(e){ toast('Could not process photo.'); }
};
window.snagAddPdf = function(input){
  const file = input.files && input.files[0]; if(!file) return;
  if(file.type !== 'application/pdf'){ toast('Choose a PDF file.'); return; }
  snagNewPdf = file;
  render();
};
window.addSnag = async function(siteId){
  const title = document.getElementById('snagTitle').value.trim();
  const location = document.getElementById('snagLoc').value.trim();
  if(!title) return;
  let photoPath = null;
  if(snagNewPhoto){
    photoPath = await uploadDataUrl('site-photos', siteId+'/snags/'+uid()+'.jpg', snagNewPhoto);
  }
  let pdfPath = null;
  if(snagNewPdf){
    pdfPath = await uploadToStorage('site-photos', siteId+'/snags/'+uid()+'.pdf', snagNewPdf, 'application/pdf');
  }
  const rows = await dbInsert('snags', {site_id:siteId, title, location, photo_path:photoPath, pdf_path:pdfPath, status:'open', created_by:ME.id});
  if(rows){
    snagNewPhoto = null;
    snagNewPdf = null;
    toast('Snag added');
    render();
  }
};
window.attachSnagPdf = async function(input, siteId, snagId){
  const file = input.files && input.files[0]; if(!file) return;
  if(file.type !== 'application/pdf'){ toast('Choose a PDF file.'); return; }
  const path = await uploadToStorage('site-photos', siteId+'/snags/'+snagId+'-'+uid()+'.pdf', file, 'application/pdf');
  if(!path) return;
  const row = await dbUpdate('snags', snagId, {pdf_path: path});
  if(row){
    attachingPdfSnagId = null;
    toast('PDF attached');
    render();
  }
};
window.closeSnagPhoto = async function(input, siteId, snagId){
  const file = input.files && input.files[0]; if(!file) return;
  try{
    const dataUrl = await compressImage(file);
    const path = await uploadDataUrl('site-photos', siteId+'/snags/'+snagId+'-closed-'+uid()+'.jpg', dataUrl);
    if(!path) return;
    const row = await dbUpdate('snags', snagId, {status:'closed', closed_photo_path:path, closed_by:ME.id, closed_at:new Date().toISOString()});
    if(row){
      postSystemMessage(siteId, 'snag_closed', `${ME.name} closed a snag: "${row.title||'Untitled'}"`);
      closingSnagId = null;
      toast('Snag closed');
      render();
    }
  }catch(e){ toast('Could not process photo.'); }
};
window.exportSnaggingPDF = async function(siteId, scope){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  const site = SITES.find(s=>s.id===siteId);
  let qs = 'site_id=eq.'+siteId+'&order=created_at.asc';
  if(scope==='live') qs += '&status=eq.open';
  else if(scope==='closed') qs += '&status=eq.closed';
  else qs += '&status=in.(open,closed)';
  const snags = await dbSelect('snags', qs);
  if(!snags.length){ toast('No snags to export for that filter.'); return; }
  await loadAllProfiles();
  toast('Building PDF…');
  try{
    const pdfDoc = await PDFLib.PDFDocument.create();
    const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const RED = PDFLib.rgb(0.784,0.063,0.180);
    const INK = PDFLib.rgb(0.06,0.06,0.07);
    const SLATE = PDFLib.rgb(0.36,0.37,0.41);
    const OK = PDFLib.rgb(0.2,0.55,0.35);
    const WARN = PDFLib.rgb(0.69,0.45,0.06);
    const PAGE_W = 595.28, PAGE_H = 841.89;
    const scopeLabel = scope==='live' ? 'Live' : scope==='closed' ? 'Closed' : 'All';

    let page, y;
    function newPage(continued){
      page = pdfDoc.addPage([PAGE_W, PAGE_H]);
      y = PAGE_H - 60;
      page.drawText('Snagging Report' + (continued ? ' (continued)' : ''), {x:50, y, size:18, font:bold, color:RED});
      y -= 8;
      page.drawLine({start:{x:50,y}, end:{x:PAGE_W-50,y}, thickness:1.5, color:INK});
      y -= 26;
      if(!continued){
        page.drawText(site.name + ' — ' + scopeLabel + ' snags', {x:50, y, size:12, font:bold, color:INK});
        y -= 18;
        page.drawText('Generated ' + new Date().toLocaleString('en-GB'), {x:50, y, size:9, font:reg, color:SLATE});
        y -= 22;
      }
    }
    newPage(false);
    snags.forEach((s,i)=>{
      if(y < 110) newPage(true);
      page.drawText((i+1)+'. '+s.title, {x:50, y, size:12.5, font:bold, color:INK});
      page.drawText(s.status.toUpperCase(), {x:PAGE_W-120, y, size:9.5, font:bold, color: s.status==='closed' ? OK : WARN});
      y -= 16;
      page.drawText('Location: '+(s.location||'—'), {x:60, y, size:10, font:reg, color:SLATE});
      y -= 14;
      page.drawText('Raised by '+nameOf(s.created_by)+' · '+new Date(s.created_at).toLocaleDateString('en-GB'), {x:60, y, size:9.5, font:reg, color:SLATE});
      y -= 14;
      if(s.status==='closed'){
        page.drawText('Closed by '+nameOf(s.closed_by)+(s.closed_at?' · '+new Date(s.closed_at).toLocaleDateString('en-GB'):''), {x:60, y, size:9.5, font:reg, color:SLATE});
        y -= 14;
      }
      page.drawText('Photo: '+(s.photo_path?'attached':'none')+(s.status==='closed'?', closing photo: '+(s.closed_photo_path?'attached':'none'):''), {x:60, y, size:9, font:reg, color:SLATE});
      y -= 22;
    });

    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = site.name.replace(/[^a-z0-9]+/gi,'-') + '-snagging-' + scope + '.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not build the PDF.');
  }
};

/* ================= RAMS ================= */
let ramsPollTimer = null;
function ramsDocsHtml(siteId, docs, sigsByDoc, canAdd){
  return docs.map(r=>{
    const sigs = sigsByDoc[r.id]||[];
    const mine = sigs.find(s=>s.user_id===ME.id);
    return `
    <div class="ramsdoc">
      <div class="taskrowtop">
        <div class="name">${escapeHtml(r.name)}</div>
        ${canAdd ? `<div class="taskicons"><div class="taskicon danger" onclick="deleteRams('${r.id}','${r.storage_path.replace(/'/g,"\\'")}')">🗑</div></div>` : ''}
      </div>
      <div class="meta">Uploaded by ${escapeHtml(nameOf(r.uploaded_by))} · ${new Date(r.uploaded_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</div>
      <a class="viewlink" href="${publicUrl('rams-docs', r.storage_path)}" target="_blank" rel="noopener">View document ↗</a>
      <div class="siglinebox ${mine?'signed':''}" onclick="${mine?'':`signRams('${siteId}','${r.id}')`}" style="${mine?'':'cursor:pointer;'}">
        ${mine ? `<span class="name">${escapeHtml(ME.name)}</span><span>Signed ${new Date(mine.signed_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</span>` : 'Tap to sign'}
      </div>
      ${sigs.length ? `<div class="signerlist">${sigs.map(s=>`<div>✓ ${escapeHtml(nameOf(s.user_id))} — ${new Date(s.signed_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</div>`).join('')}</div>
        ${canAdd ? `<button class="ghostbtn" style="margin-top:10px;" onclick="exportSignedRams('${r.id}')">Export PDF with all signatures</button>` : ''}` : ''}
    </div>`;
  }).join('') || `<div class="empty">No RAMS uploaded.</div>`;
}
async function fetchRamsData(siteId){
  const docs = await dbSelect('rams_docs', 'site_id=eq.'+siteId+'&order=uploaded_at.desc');
  let sigsByDoc = {};
  if(docs.length){
    const ids = docs.map(d=>d.id).join(',');
    const sigs = await dbSelect('rams_signatures', 'rams_id=in.('+ids+')');
    sigs.forEach(s=>{ (sigsByDoc[s.rams_id]=sigsByDoc[s.rams_id]||[]).push(s); });
  }
  return {docs, sigsByDoc};
}
async function renderRams(siteId){
  const site = SITES.find(s=>s.id===siteId);
  const canAdd = isManager(ME);
  const {docs, sigsByDoc} = await fetchRamsData(siteId);

  document.getElementById('app').innerHTML = shell(`
    <div id="ramsDocsList">${ramsDocsHtml(siteId, docs, sigsByDoc, canAdd)}</div>

    ${canAdd ? `
      <div class="card">
        <p class="sectiontitle" style="margin-top:0;">Upload RAMS</p>
        <div class="formfield"><input type="text" id="ramsName" placeholder="Document name, e.g. Working at Height"></div>
        <label class="ghostbtn" style="display:block;cursor:pointer;text-align:center;margin-bottom:10px;">Choose PDF
          <input type="file" accept="application/pdf" id="ramsFile" style="display:none" onchange="document.getElementById('ramsFileName').textContent=this.files[0]?this.files[0].name:''">
        </label>
        <p class="stub" id="ramsFileName" style="margin:-4px 0 10px;"></p>
        <button class="darkbtn" onclick="addRams('${siteId}')">Upload</button>
        <p class="stub">Original PDF is stored untouched. Each signature is recorded separately, so multiple operatives can sign without corrupting the file — see the note in chat.</p>
      </div>
    ` : ''}
  `, {title:'RAMS', subtitle:site.name, back:`#/site/${siteId}/home`, siteId, activeTab:'rams'});

  if(ramsPollTimer) clearInterval(ramsPollTimer);
  ramsPollTimer = setInterval(async ()=>{
    const el = document.getElementById('ramsDocsList');
    if(!el){ clearInterval(ramsPollTimer); ramsPollTimer = null; return; }
    const {docs, sigsByDoc} = await fetchRamsData(siteId);
    const freshEl = document.getElementById('ramsDocsList');
    if(freshEl) freshEl.innerHTML = ramsDocsHtml(siteId, docs, sigsByDoc, canAdd);
  }, 7000);
}
window.addRams = async function(siteId){
  const name = document.getElementById('ramsName').value.trim();
  const fileInput = document.getElementById('ramsFile');
  const file = fileInput.files && fileInput.files[0];
  if(!name || !file){ toast('Add a name and choose a PDF.'); return; }
  const path = siteId+'/rams/'+uid()+'-'+file.name.replace(/[^a-z0-9.\-]+/gi,'_');
  const stored = await uploadToStorage('rams-docs', path, file, 'application/pdf');
  if(!stored) return;
  const rows = await dbInsert('rams_docs', {site_id:siteId, name, storage_path:stored, uploaded_by:ME.id});
  if(rows){ toast('RAMS uploaded'); render(); }
};
window.signRams = async function(siteId, ramsId){
  const rows = await dbInsert('rams_signatures', {rams_id:ramsId, user_id:ME.id});
  if(rows){ toast('Signed — archived automatically'); render(); }
};
window.exportSignedRams = async function(ramsId){
  if(typeof PDFLib==='undefined'){ toast('PDF library failed to load — check connection.'); return; }
  toast('Building signed PDF…');
  const docs = await dbSelect('rams_docs', 'id=eq.'+ramsId+'&select=*');
  const doc = docs[0];
  if(!doc){ toast('Document not found.'); return; }
  const sigs = await dbSelect('rams_signatures', 'rams_id=eq.'+ramsId+'&order=signed_at.asc');
  if(!sigs.length){ toast('No signatures yet.'); return; }
  try{
    const srcBytes = await (await fetch(publicUrl('rams-docs', doc.storage_path))).arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(srcBytes);
    const bold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const reg = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const RED = PDFLib.rgb(0.784,0.063,0.180);
    const INK = PDFLib.rgb(0.06,0.06,0.07);
    const SLATE = PDFLib.rgb(0.36,0.37,0.41);
    const PAGE_W = 595.28, PAGE_H = 841.89;

    let page, y;
    function newSigPage(continued){
      page = pdfDoc.addPage([PAGE_W, PAGE_H]);
      y = PAGE_H - 60;
      page.drawText('Signature Record' + (continued ? ' (continued)' : ''), {x:50, y, size:18, font:bold, color:RED});
      y -= 8;
      page.drawLine({start:{x:50,y}, end:{x:PAGE_W-50,y}, thickness:1.5, color:INK});
      y -= 26;
      if(!continued){
        page.drawText(doc.name, {x:50, y, size:12, font:bold, color:INK});
        y -= 22;
      }
    }
    newSigPage(false);
    sigs.forEach(s=>{
      if(y < 70) newSigPage(true);
      const name = nameOf(s.user_id);
      const when = new Date(s.signed_at).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      page.drawText('Signed: ' + name, {x:50, y, size:12, font:reg, color:INK});
      page.drawText(when, {x:330, y, size:11, font:reg, color:SLATE});
      y -= 24;
    });
    y -= 14;
    if(y < 60) newSigPage(true);
    page.drawText('Generated ' + new Date().toLocaleString('en-GB') + ' — original document pages are unmodified above.', {x:50, y, size:8.5, font:reg, color:SLATE});

    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = doc.name.replace(/[^a-z0-9]+/gi,'-') + '-signed.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('Signed PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not build the signed PDF — the source file may not be a valid PDF.');
  }
};
window.deleteRams = async function(ramsId, storagePath){
  if(!confirm('Delete this RAMS document and all its signatures? This can\'t be undone.')) return;
  try{ await sbFetch('/storage/v1/object/rams-docs/'+storagePath, {method:'DELETE'}); }catch(e){}
  const ok = await dbDelete('rams_docs', ramsId);
  if(ok){ toast('RAMS document deleted'); render(); }
};

/* ================= MATERIALS ================= */
let matFilter = 'live';
async function renderMaterials(siteId){
  const site = SITES.find(s=>s.id===siteId);
  const isPM = isManager(ME);
  const statusQS = matFilter==='live' ? 'status=in.(pending,sent)' : 'status=in.(closed,cancelled)';
  const [materials, suppliers] = await Promise.all([
    dbSelect('materials', 'site_id=eq.'+siteId+'&'+statusQS+'&order=created_at.desc'),
    isPM ? dbSelect('suppliers', 'org_id=eq.'+ME.org_id+'&order=name.asc') : Promise.resolve([]),
  ]);
  const supplierName = id => { const s=suppliers.find(x=>x.id===id); return s ? s.name : null; };
  const opStatusLabel = {pending:'Awaiting action', sent:'Actioned', closed:'Closed', cancelled:'Cancelled'};

  document.getElementById('app').innerHTML = shell(`
    <div class="filterrow">
      <div class="filterchip ${matFilter==='live'?'active':''}" onclick="matFilter='live';render()">Live</div>
      <div class="filterchip ${matFilter==='closed'?'active':''}" onclick="matFilter='closed';render()">Closed</div>
    </div>

    ${materials.map(m=>`
      <div class="matcard">
        <div class="top">
          <div><div class="name">${escapeHtml(m.item)}</div><div class="qty">Qty ${escapeHtml(m.qty)} · Requested by ${escapeHtml(nameOf(m.requested_by))}</div></div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="statustag ${m.status}">${isPM ? m.status : (opStatusLabel[m.status]||m.status)}</span>
            ${isPM ? `<div class="taskicon danger" onclick="deleteMaterial('${siteId}','${m.id}')">🗑</div>` : ''}
          </div>
        </div>
        ${m.status==='sent' ? (isPM ? `<div class="merchantrow">→ <span class="merchantchip sent">${escapeHtml(m.merchant||supplierName(m.supplier_id)||'Supplier')}</span> ${m.email_sent_at ? '<span class="statustag closed" style="margin-left:6px;">✓ Email sent</span>' : '<span class="statustag pending" style="margin-left:6px;">Email pending</span>'}</div>` : '') :
          m.status==='cancelled' ? `<div class="merchantrow" style="color:var(--warn);">Cancelled by ${escapeHtml(nameOf(m.cancelled_by))}${m.cancel_reason ? ' — '+escapeHtml(m.cancel_reason) : ''}</div>` :
          m.status==='pending' ? (isPM ? `<div class="merchantrow">Send to:
            ${suppliers.length ? suppliers.map(s=>`<span class="merchantchip pickable" onclick="sendMaterial('${siteId}','${m.id}','${s.id}')">${escapeHtml(s.name)}</span>`).join('') : `<span class="stub" style="margin:0;">No suppliers set up yet — add one below.</span>`}
          </div>` : `<div class="merchantrow">Awaiting action from project manager</div>`) : ''}
        ${!isPM && m.status==='pending' && m.requested_by===ME.id ? `<button class="ghostbtn" style="margin-top:10px;color:var(--warn);" onclick="cancelMaterial('${siteId}','${m.id}')">Cancel request</button>` : ''}
        ${isPM && m.status!=='closed' && m.status!=='cancelled' ? `<button class="ghostbtn" style="margin-top:10px;" onclick="closeMaterial('${siteId}','${m.id}')">Close request</button>` : ''}
      </div>
    `).join('') || `<div class="empty">No ${matFilter} material requests.</div>`}

    <div class="card">
      <p class="sectiontitle" style="margin-top:0;">Request material</p>
      <div class="formfield"><input type="text" id="matItem" placeholder="Item"></div>
      <div class="formfield"><input type="text" id="matQty" placeholder="Quantity"></div>
      <button class="darkbtn" onclick="addMaterial('${siteId}')">Request</button>
    </div>
    ${isPM ? `
    <div class="card">
      <p class="sectiontitle" style="margin-top:0;">Suppliers</p>
      ${suppliers.map(s=>`
        <div class="sitecard" style="padding:8px 10px;">
          <div class="info"><div class="name">${escapeHtml(s.name)}</div><div class="addr">${escapeHtml(s.email)}</div></div>
          <div class="taskicon danger" onclick="deleteSupplier('${siteId}','${s.id}')">🗑</div>
        </div>
      `).join('') || `<div class="empty" style="padding:10px;">No suppliers yet.</div>`}
      <div class="formfield" style="margin-top:10px;"><input type="text" id="supName" placeholder="Supplier name"></div>
      <div class="formfield"><input type="email" id="supEmail" placeholder="Supplier order email"></div>
      <button class="ghostbtn" onclick="addSupplier('${siteId}')">Add Supplier</button>
    </div>
    ` : ''}
  `, {title:'Material Needs', subtitle:site.name, back:`#/site/${siteId}/home`, siteId, activeTab:'materials'});
}
window.addSupplier = async function(siteId){
  const name = document.getElementById('supName').value.trim();
  const email = document.getElementById('supEmail').value.trim();
  if(!name || !email){ toast('Enter a supplier name and email.'); return; }
  const rows = await dbInsert('suppliers', {org_id: ME.org_id, name, email, created_by: ME.id});
  if(rows){ toast('Supplier added'); render(); }
};
window.deleteSupplier = async function(siteId, supplierId){
  if(!confirm('Remove this supplier?')) return;
  const ok = await dbDelete('suppliers', supplierId);
  if(ok){ toast('Supplier removed'); render(); }
};
window.cancelMaterial = async function(siteId, matId){
  const reason = prompt('Why are you cancelling this request? This will be visible to your Project Manager.');
  if(reason === null) return;
  if(!reason.trim()){ toast('A reason is required to cancel.'); return; }
  const row = await dbUpdate('materials', matId, {status:'cancelled', cancel_reason: reason.trim(), cancelled_by: ME.id});
  if(row){ toast('Request cancelled'); render(); }
};
window.addMaterial = async function(siteId){
  const item = document.getElementById('matItem').value.trim();
  const qty = document.getElementById('matQty').value.trim();
  if(!item) return;
  const rows = await dbInsert('materials', {site_id:siteId, item, qty:qty||'1', requested_by:ME.id, status:'pending'});
  if(rows){
    postSystemMessage(siteId, 'material_request', `${ME.name} requested material: ${item} (qty ${qty||'1'})`);
    toast('Request added'); render();
  }
};
window.sendMaterial = async function(siteId, matId, supplierId){
  const suppliers = await dbSelect('suppliers', 'id=eq.'+supplierId+'&select=*');
  const supplier = suppliers && suppliers[0];
  if(!supplier){ toast('Could not find that supplier.'); return; }
  const material = (await dbSelect('materials', 'id=eq.'+matId+'&select=*'))[0];
  const row = await dbUpdate('materials', matId, {status:'sent', merchant:supplier.name, supplier_id:supplierId, sent_at:new Date().toISOString()});
  if(!row){ return; }
  toast('Order routed to '+supplier.name+' — emailing…');
  render();
  try{
    const res = await sbFetch('/functions/v1/send-material-order', {method:'POST', body: JSON.stringify({
      material_id: matId, supplier_email: supplier.email, supplier_name: supplier.name,
      item: material ? material.item : '', qty: material ? material.qty : '', site_id: siteId,
    })});
    const d = await res.json();
    if(res.ok && !d.error){
      await dbUpdate('materials', matId, {email_sent_at:new Date().toISOString()});
      toast('Order emailed to '+supplier.name);
    } else {
      console.error('send-material-order failed:', d.error || res.status);
      toast('Routed to '+supplier.name+', but the order email failed to send — '+(d.error ? String(d.error).slice(0,140) : 'check it manually.'));
    }
  }catch(e){
    console.error('send-material-order failed:', e);
    toast('Routed to '+supplier.name+', but the order email failed to send — check it manually.');
  }
  render();
};
window.closeMaterial = async function(siteId, matId){
  const row = await dbUpdate('materials', matId, {status:'closed'});
  if(row){ toast('Material request closed'); render(); }
};
window.deleteMaterial = async function(siteId, matId){
  if(!confirm('Delete this material request? This can\'t be undone.')) return;
  const ok = await dbDelete('materials', matId);
  if(ok){ toast('Material request deleted'); render(); }
};

/* ================= VARIATIONS ================= */
let varDraft = null;
let varFilter = 'live';
async function renderVariations(siteId){
  const site = SITES.find(s=>s.id===siteId);
  varDraft = varDraft || {photo:null, desc:''};
  const variations = await dbSelect('variations', 'site_id=eq.'+siteId+'&status=eq.'+varFilter+'&order=created_at.desc');

  document.getElementById('app').innerHTML = shell(`
    <div class="card">
      <p class="sectiontitle" style="margin-top:0;">Raise a variation</p>
      <div class="formfield">
        <label class="field-label">Photo evidence</label>
        <label class="photoupload" style="cursor:pointer;">
          ${varDraft.photo ? `<img src="${varDraft.photo}">` : `<div style="font-size:22px;">📷</div>Tap to capture`}
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="varPhoto(this)">
        </label>
      </div>
      <div class="formfield">
        <label class="field-label">Description</label>
        <textarea id="varDesc" placeholder="What's changed and why...">${escapeHtml(varDraft.desc)}</textarea>
      </div>
      <button class="primarybtn" ${(varDraft.photo)?'':'disabled'} onclick="submitVariation('${siteId}')">Submit Variation</button>
    </div>

    <div class="filterrow">
      <div class="filterchip ${varFilter==='live'?'active':''}" onclick="varFilter='live';render()">Live</div>
      <div class="filterchip ${varFilter==='closed'?'active':''}" onclick="varFilter='closed';render()">Closed</div>
    </div>
    ${variations.map(v=>`
      <div class="varcard">
        <img src="${publicUrl('site-photos', v.photo_path)}">
        <div class="top" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div class="desc">${escapeHtml(v.description)}</div>
          <span class="statustag2 ${v.status}">${v.status}</span>
        </div>
        <div class="meta">${escapeHtml(nameOf(v.created_by))} · ${new Date(v.created_at).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</div>
        ${isManager(ME) && v.status==='live' ? `<button class="ghostbtn" style="margin-top:8px;" onclick="closeVariation('${siteId}','${v.id}')">Mark as closed</button>` : ''}
      </div>
    `).join('') || `<div class="empty">No ${varFilter} variations.</div>`}
  `, {title:'Variations', subtitle:site.name, back:`#/site/${siteId}/home`, siteId, activeTab:'more'});
}
window.varPhoto = async function(input){
  const file = input.files && input.files[0]; if(!file) return;
  try{ varDraft.photo = await compressImage(file); render(); }
  catch(e){ toast('Could not process photo.'); }
};
window.submitVariation = async function(siteId){
  const desc = document.getElementById('varDesc').value.trim();
  const path = await uploadDataUrl('site-photos', siteId+'/variations/'+uid()+'.jpg', varDraft.photo);
  if(!path) return;
  const rows = await dbInsert('variations', {site_id:siteId, photo_path:path, description:desc||'—', created_by:ME.id, status:'live'});
  if(rows){
    postSystemMessage(siteId, 'variation', `${ME.name} raised a variation: ${desc||'(no description)'}`);
    varDraft = null;
    toast('Variation submitted');
    render();
  }
};
window.closeVariation = async function(siteId, varId){
  const row = await dbUpdate('variations', varId, {status:'closed', closed_at:new Date().toISOString()});
  if(row){ toast('Variation closed'); render(); }
};

/* ================= MESSAGES ================= */
// One-way announcements: PMs/Admins post down to operatives (per-site or
// whole company); operative actions elsewhere (material requests, snag
// closures, variations) post automatically up to whichever PM owns the site.
async function postSystemMessage(siteId, kind, body){
  // Best-effort — never blocks or errors out the action that triggered it.
  try{
    await dbInsert('messages', {org_id: ME.org_id, site_id: siteId, sender_id: ME.id, audience:'managers', kind, body});
  }catch(e){ /* silent */ }
}
async function markMessagesRead(ids){
  if(!ids || !ids.length) return;
  try{
    const rows = ids.map(id=>({message_id:id, user_id:ME.id}));
    await sbFetch('/rest/v1/message_reads', {method:'POST', headers:{'Prefer':'resolution=ignore-duplicates,return=minimal'}, body: JSON.stringify(rows)});
  }catch(e){ /* silent */ }
}
let msgDraft = '';
async function renderMessages(siteId){
  const site = SITES.find(s=>s.id===siteId);
  if(!site){ go('#/sites'); return; }
  const mgr = isManager(ME);
  await loadAllProfiles();

  let broadcasts = [], fromTeam = [];
  if(mgr){
    [broadcasts, fromTeam] = await Promise.all([
      dbSelect('messages', `audience=eq.operatives&or=(site_id.eq.${siteId},site_id.is.null)&order=created_at.desc&limit=50`),
      dbSelect('messages', `audience=eq.managers&site_id=eq.${siteId}&order=created_at.desc&limit=50`),
    ]);
  } else {
    broadcasts = await dbSelect('messages', `audience=eq.operatives&or=(site_id.eq.${siteId},site_id.is.null)&order=created_at.desc&limit=50`);
  }
  markMessagesRead([...broadcasts, ...fromTeam].map(m=>m.id));
  currentUnreadMsgs = 0; // just marked everything shown as read — clear the tab badge immediately

  const kindLabel = {material_request:'Material request', snag_closed:'Snag closed', variation:'Variation raised', message:null};
  const msgRow = m => `
    <div class="card" style="padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <div style="font-size:12px;color:var(--slate);margin-bottom:4px;">${escapeHtml(nameOf(m.sender_id))} · ${new Date(m.created_at).toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${!m.site_id?' · All sites':''}${kindLabel[m.kind]?` · <span style="color:var(--blue);">${kindLabel[m.kind]}</span>`:''}</div>
        ${mgr ? `<div class="taskicon danger" style="flex:0 0 auto;" onclick="deleteMessage('${siteId}','${m.id}')">🗑</div>` : ''}
      </div>
      <div style="font-size:13.5px;">${escapeHtml(m.body)}</div>
    </div>`;

  document.getElementById('app').innerHTML = shell(`
    ${mgr ? `
      <div class="card">
        <p class="sectiontitle" style="margin-top:0;">Send a message</p>
        <div class="formfield"><textarea id="msgBody" placeholder="Message to operatives...">${escapeHtml(msgDraft)}</textarea></div>
        <div class="formfield">
          <label class="field-label">Send to</label>
          <select id="msgTarget">
            <option value="site">This site's operatives</option>
            <option value="all">All operatives (whole company)</option>
          </select>
        </div>
        <button class="darkbtn" onclick="sendBroadcast('${siteId}')">Send</button>
      </div>
      <p class="sectiontitle" style="margin-top:18px;">From your team</p>
      ${fromTeam.map(msgRow).join('') || `<div class="empty">Nothing from the crew yet.</div>`}
      <p class="sectiontitle" style="margin-top:18px;">Sent to operatives</p>
      ${broadcasts.map(msgRow).join('') || `<div class="empty">No messages sent yet.</div>`}
    ` : `
      ${broadcasts.map(msgRow).join('') || `<div class="empty">No messages yet.</div>`}
    `}
  `, {title:'Messages', subtitle:site.name, back:`#/site/${siteId}/home`, siteId, activeTab:'messages'});
}
window.deleteMessage = async function(siteId, messageId){
  if(!confirm('Delete this message? This can\'t be undone.')) return;
  const ok = await dbDelete('messages', messageId);
  if(ok){ toast('Message deleted'); render(); }
};
window.sendBroadcast = async function(siteId){
  const bodyInput = document.getElementById('msgBody');
  const body = bodyInput.value.trim();
  const target = document.getElementById('msgTarget').value;
  if(!body){ toast('Write a message first.'); return; }
  const rows = await dbInsert('messages', {org_id: ME.org_id, site_id: target==='all' ? null : siteId, sender_id: ME.id, audience:'operatives', kind:'message', body});
  if(rows){
    msgDraft = '';
    toast(target==='all' ? "Sent to all operatives" : "Sent to this site's operatives");
    render();
  }
};

/* ================= router / render ================= */
async function render(){
  if(ramsPollTimer){ clearInterval(ramsPollTimer); ramsPollTimer = null; }
  const preParts = parseRoute();
  if(preParts[0]==='join' && preParts[1]){ return renderJoin(preParts[1]); }
  if(!SESSION || !ME){ renderLogin(); return; }
  if(ME.role==='superadmin'){ return renderAdmin(); }
  if(ME.role==='admin' && ORG && !ORG.logo_path){ renderCompanySetup(); return; }
  const parts = parseRoute();
  if(!parts.length || parts[0]==='sites'){ renderSites(); return; }
  if(parts[0]==='team'){ return renderTeam(); }
  if(parts[0]==='site' && parts[1]){
    const siteId = parts[1];
    const page = parts[2] || 'home';
    // Keep the bottom tab bar's Messages badge fresh on every site-scoped
    // navigation, not just when visiting Messages itself.
    if(page!=='messages'){ currentUnreadMsgs = await unreadCountForSite(siteId); }
    if(page==='home') return renderSiteHome(siteId);
    if(page==='more') return renderMore(siteId);
    if(page==='checkin') return renderCheckin(siteId);
    if(page==='schedule') return renderSchedule(siteId);
    if(page==='snagging') return renderSnagging(siteId);
    if(page==='rams') return renderRams(siteId);
    if(page==='materials') return renderMaterials(siteId);
    if(page==='messages') return renderMessages(siteId);
    if(page==='variations') return renderVariations(siteId);
    if(page==='team') return renderAssignTeam(siteId);
  }
  renderSites();
}

init();
</script>
